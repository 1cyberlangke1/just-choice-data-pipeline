# 质检提示词（简体中文）。
#
# 约定（由 tests/core/test_llmjudge.py 锁住）：
# - `perspectives` 必须覆盖 llmjudge.PERSPECTIVES 的全部视角，每个视角 rules 非空；
# - 只写「怎么看」，**不写任何领域词表**——通用层不认识任何具体 workflow。

language_name = "简体中文"

intro = "你在给一批合成数据做质检。下面就是数据本身：素材、题目与金答案。"
material_head = "【素材】"
question_head = "【题目与金答案】"
options_label = "选项"
levels_label = "等级"
answer_label = "金答案"
perspective_head = "你的视角"
rules_head = "判断标准："
closing = "只给结论：verdict=true 表示这个视角下没有问题，score 是你对这个结论的把握（0~1），reason 一句话指出具体位置或具体毛病。不要重写数据、不要补全数据。"

[perspectives.solvable]
title = "可解性"
rules = [
  "只看素材与题面，答案能不能唯一确定；",
  "信息不足（素材里根本没有这条信息）算有问题；",
  "两个选项都说得通（歧义）也算有问题。",
]

[perspectives.answer]
title = "答案正确性"
rules = [
  "不要相信金答案——它就是被检查的对象，按素材独立算一遍再下结论；",
  "题目问「第几项」时，注意题面说的顺序与素材里的排列顺序是不是同一套；",
  "金答案与素材对不上就是有问题，哪怕它看起来很合理。",
]

[perspectives.distractors]
title = "干扰项质量"
rules = [
  "干扰项要与正确答案同类、粒度相当，不能一眼就排除；",
  "选项描述必须两两不同——重复的选项等于有两个正确答案；",
  "不能出现素材里根本不存在的取值。",
]

[perspectives.levels]
title = "等级互斥"
rules = [
  "各等级的描述必须互斥：同一份素材只能落进一个等级；",
  "等级要覆盖从最轻到最重的全部情况，不留空档；",
  "等级之间不能互相包含（例如「2：至少两处」与「3：三处以上」在边界上同时成立）。",
]

[perspectives.wording]
title = "措辞"
rules = [
  "题面要通顺、无歧义，像人真的会问的问题；",
  "语言要与素材一致，不要中英混排、不要留下模板占位符；",
  "不要出现「根据上文」「如题所示」这类依赖上下文的说法。",
]
