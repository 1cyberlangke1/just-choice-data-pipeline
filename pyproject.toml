# 项目声明：src 布局（src/jc 是通用层，workflows/ 是各 workflow）。
# 装法：.venv\Scripts\python.exe -m pip install -e . --no-build-isolation

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "just-choice"
version = "0.1.0"
description = "JEV 风格选择题数据合成管线：通用层（src/jc）+ workflow（workflows/）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "赛博浪客", email = "13411627+cyberlangke@user.noreply.gitee.com" }]
urls = { Repository = "https://github.com/1cyberlangke1/just-choice-data-pipeline" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = []  # 通用层与迷宫 workflow 都只用标准库

[project.optional-dependencies]
# LLM 后端（PLAN 3.1）的可选依赖：只有需要调模型的 workflow 才装。
# 刻意不引 LiteLLM——它核心依赖 22 个包（含 boto3 / tokenizers），而我们只需要
# OpenAI 兼容端点，instructor 已经覆盖；多夹一层还会让端点能力探测失真。
llm = [
    "instructor>=1.17",
    "pydantic>=2.8",
    "openai>=2.0",
    "pyrate-limiter>=4.0",
    "tenacity>=9.0",  # 重试退避；instructor 也依赖它，这里显式声明免得被上游改动连坐
]
# 静态检查（本地门禁，pre-commit 钩子会跑）。刻意**不用 mypy**，实测（2026-09-30）：
# `mypy --follow-imports=silent src workflows` = 6572 处报错 / 184 个文件，加上 tests 是
# 14618 处 / 481 个文件；其中 `--disallow-any-explicit` 的 36 / 39 处**全是假阳性**——
# pydantic 模型类会让它把 `class X(BaseModel):` 那一行判成「显式 Any」。现在开 mypy 等于
# 把闸门焊死，还得先做一次跨上百个文件的重构。ruff 的 ANN/F821 只做 AST 层面的判断，
# 没有这问题；「Any 及其等价物」（裸泛型 / `Callable[..., X]` / 空容器 / `noqa: ANN…` /
# 生产代码的 `json.loads`）由 `tests/core/test_no_any.py` 的 AST 尺子管。
# 测试运行器也要在这里：README 的「零 token 的验证闸」那一节让你装 `.[llm,dev]` 之后跑
# `python -m pytest -q`。2026-10-04 实测，只有 ruff 的时候那条命令是 `No module named pytest`。
dev = ["pytest>=8", "ruff>=0.16"]

