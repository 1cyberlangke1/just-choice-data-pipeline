lang = "zh"
language_name = "简体中文"

# 正文里不许出现的话术：只收**表名**。这份清单刻意短——正文是一段代码，`test` / `size` /
# `config` 这类标识符在代码里到处都是，收进来会大面积误伤；而表名在代码里几乎不可能自然出现，
# 命中就是模型把段落结构抄进去了。只收高精度短语，宁可漏检也不误判。
banned_intent_phrases = [
  "改动内容",
  "改动清单",
  "审查规则",
  "严重度表",
  "门控表",
]

[meta]
body_label = "改动内容"
manifest_label = "改动清单"
rules_label = "审查规则"
severity_label = "严重度表"
gate_label = "门控表"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
manifest_columns = "文件类型 | 变更类型 | 规模"
rules_columns = "规则名 | 条件"
severity_columns = "规则名 | 源码 | 测试 | 配置 | 文档；档位：0 不提 / 1 轻 / 2 中 / 3 重"
gate_columns = "档位 | 新增 | 修改 | 删除；动作：allow 放行 / request_changes 请求修改 / block 拦下"

[dims]
secret = "改动的新增行里有没有出现「凭据名 = 带引号的值」这种写法"
debug = "改动的新增行里有没有出现调试输出调用"
file_kind = "文件类型"
change_kind = "变更类型"
size = "改动规模"

[prompt]
intro = "下面是一处**代码改动**的特征清单。请按清单写出这处改动的正文——也就是 diff 里那几行，**每行开头都要有前缀**：`+` 是新增、`-` 是删除、空格是上下文，例如 `+ timeout = 60`。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "正文只写改动的那几行，**每行一个前缀**：`+` 是新增行、`-` 是删除行、空格是上下文行（前缀后面跟一个空格）",
  "行数要落在「改动规模」说的区间里：小 1~4 行、中 3~8 行、大 6~12 行",
  "行前缀要跟「变更类型」对得上：新增不许有 `-` 行、删除不许有 `+` 行",
  "不要写 Markdown 围栏，不要写行号，不要写 `@@` 那种 hunk 头，也不要写「改动内容 / 改动清单 / 审查规则 / 严重度表 / 门控表」这些表名",
  "要像真的代码：标识符保持 ASCII，注释与字符串用{language}写",
  "「凭据字面量」那一档要一眼看得出来：有就在**新增行**上写成 `db_password = \"…\"` 这种**带引号的值**（写在代码里最自然，写在说明文字里也算）；没有就一个都别写（读环境变量、读配置不算）。只在删除行上出现的字面量不算「有」——那是把这行删掉",
  "「调试输出」那一档也要一眼看得出来：有就在**新增行**上写成 print( / console.log( / logger.debug( 这类调用；没有就一个都别写",
  "不要写真实存在的公司、产品或代码库名字，一律用虚构的名字",
  "文档改动也要带前缀：`+ ## 安装指南` 是对的，光写 `## 安装指南` 不行（前缀是第一位的，文件类型只决定写什么内容）",
]

[feature.secret.no]
brief = "新增行里没有「凭据名 = 带引号的值」"
hint = "一个带引号的密码 / 令牌 / 密钥都别写，要用就去读环境变量"

[feature.secret.yes]
brief = "新增行里有「凭据名 = 带引号的值」"
hint = "在**新增行**上写成 `db_password = \"hunter2\"` 这种带引号的值（写在代码里最自然，写在说明文字里也算）"

[feature.debug.no]
brief = "新增行里没有调试输出"
hint = "别写 print( / console.log( / logger.debug( 这类调试输出"

[feature.debug.yes]
brief = "新增行里有调试输出"
hint = "在**新增行**上写成像 print( 或 logger.debug( 那样把中间状态打出来"

[feature.file_kind.source]
brief = "源码文件"
hint = "写业务代码的**改动行**：带前缀的函数、分支、取值，例如 `+ def total(x):`"

[feature.file_kind.test]
brief = "测试文件"
hint = "写测试代码的**改动行**：带前缀的用例名、断言、夹具，例如 `+ def test_total():`"

[feature.file_kind.config]
brief = "配置文件"
hint = "写配置的**改动行**：带前缀的键值对，例如 `+ timeout: 60`（YAML / TOML / JSON 风格都行），光写 `timeout: 60` 不行"

[feature.file_kind.docs]
brief = "文档文件"
hint = "写说明文字（Markdown 那种）的**改动行**，不要写代码：`+ ## 安装指南` 是对的，光写 `## 安装指南` 不行"

[feature.change_kind.added]
brief = "新增"
hint = "整块都是新加的行，每行都以 `+` 开头"

[feature.change_kind.modified]
brief = "修改"
hint = "既有新加的行也有删掉的行，两种前缀都要有"

[feature.change_kind.deleted]
brief = "删除"
hint = "整块都是删掉的行，每行都以 `-` 开头"

[feature.size.small]
brief = "小改动"
hint = "1~4 行"

[feature.size.medium]
brief = "中等改动"
hint = "3~8 行"

[feature.size.large]
brief = "大改动"
hint = "6~12 行"

[rules.credential]
condition = "改动的新增行里有「凭据名 = 带引号的值」，而且文件类型是源码 / 测试 / 配置"

[rules.debug]
condition = "改动的新增行里有调试输出（print( / console.log( / logger.debug( 之类），而且文件类型是源码 / 配置"

[rules.size]
condition = "改动规模是「大」，而且文件类型是源码"

[rules.none]
condition = "以上都不命中"

[verify]
intro = "下面是一处代码改动。请按给定的选项反解它的特征。"
state_header = "【改动全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"

[fam.secret]
q = [
  "改动的新增行里有没有出现「凭据名 = 带引号的值」这种写法？",
  "按「新增行里有没有这种写法」选一项。",
  "这处改动的新增行里有没有凭据字面量？",
]
[fam.secret.criteria]
true = "有：**新增行**里出现了形如 `db_password = \"…\"` 的写法（写在代码里或说明文字里都算）"
false = "没有：新增行里没有这种写法（只在删除行上出现不算）"

[fam.debug]
q = [
  "改动的新增行里有没有出现调试输出调用？",
  "按「新增行里有没有调试输出」选一项。",
  "这处改动的新增行里有没有留下调试输出？",
]
[fam.debug.criteria]
true = "有：**新增行**里出现了 print( / console.log( / logger.debug( 这类调用"
false = "没有：新增行里一处这种调用都没有（只在删除行上出现不算）"

[fam.rule]
q = [
  "这处改动会命中审查规则表里的哪一条？",
  "审查规则表从上往下看，第一条命中的是哪一条？",
  "按审查规则表选一条命中的规则。",
]
[fam.rule.criteria]
credential = "改动的新增行里有「凭据名 = 带引号的值」，而且文件类型是源码 / 测试 / 配置"
debug = "改动的新增行里有调试输出，而且文件类型是源码 / 配置"
size = "改动规模是「大」，而且文件类型是源码"
none = "以上都不命中"

[fam.severity]
q = [
  "这处改动的严重度是第几档？",
  "按严重度表给这处改动定一档。",
  "这处改动该记在第几档？",
]
levels = [
  "0 档：不提（不构成发现）",
  "1 档：轻",
  "2 档：中",
  "3 档：重",
]

[fam.gate]
q = [
  "这处改动该放行、请求修改，还是拦下？",
  "按门控表，这处改动该怎么处置？",
  "这处改动的门控动作是哪一档？",
]
[fam.gate.criteria]
allow = "放行"
request_changes = "请求修改"
block = "拦下"
