# 改动审查 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的标签与三张词表互不重叠、
# 抬头三格的分隔符（cell_sep）**必须一致**（`reparse` 用的合并表只按一个分隔符切行）、
# 并且每一条正文模板真的**只**命中它标注的那一条规则（题面判据是文本匹配，
# 构造侧用的是键，两边不一致时产出的答案就是错的）。

[meta]
title = "改动审查单"
change_label = "改动"
colon = "："
cell_sep = " · "
body_indent = "    "

[file]
src = "源码"
test = "测试"
doc = "文档"
config = "配置"

[change]
add = "新增"
edit = "修改"
remove = "删除"

[size]
small = "小"
big = "大"

[body]
# 正文模板：键是 `{规则}_{槽}`（干净槽是 `clean_{槽}`）。模板里的字面量正是规则判据
# 要抓的东西——凭据槽里必须有「凭据名 = 带引号的字面量」，调试槽里必须有 `print(` 这类
# 调用，规模槽靠抬头里的规模格（正文一个字都不许踩另外两条规则）。
secret_heavy = "把数据库口令写死成 password = \"hunter2\" 就提交了"
secret_noise0 = "示例里抄了 password = \"example\" 这种写法"
debug_medium = "加了一行 print(中间结果) 用来排查"
debug_noise0 = "说明里贴了一段 print(调试输出) 的用法"
debug_noise1 = "测试里加了一行 console.log(结果)"
bulk_light = "这一处一口气改了几十行"
bulk_noise1 = "这一处整段重排了一遍"
clean_clean = "把这里的注释补全了"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、三条审查规则——凭据规则：正文里出现「凭据名 = 带引号的字面量」这种硬编码，凭据名是含 password、passwd、pwd、secret、token、api_key、access_key、private_key、credential 的词，严重度是重；调试规则：正文里出现 print( 、console.log( 、debugger 、var_dump 、logger.debug( 、fmt.Print( 这类调试输出，严重度是中；规模规则：抬头里的规模格是『大』，严重度是轻。二、该不该提——命中规则不等于该提：凭据规则只在源码、测试、配置里该提，文档里不该提；调试规则只在源码、配置里该提，测试与文档里不该提；规模规则只有源码该提。三、严重度档——凭据是重、调试是中、规模是轻。四、门控——重的一律拦下；中的在新增与修改时请求修改、在删除时拦下；轻的在修改时请求修改、在新增与删除时放行。五、最严重的一处——严重度档最高的那一处该提改动；两处并列最高时不出这个题。"

[fam.flag]
q = [
  "第 {n} 处该提审查意见吗？",
  "按规则，第 {n} 处要不要提出来？",
  "第 {n} 处算不算问题？",
]

[fam.flag.criteria]
true = "该提：这一处命中了某条规则，而且它所在的文件在该规则的适用范围内"
false = "不该提：这一处没命中任何规则，或者命中了但文件不在该规则的适用范围内"

[fam.severity]
q = [
  "第 {n} 处的严重度是第几档？",
  "按严重度表，第 {n} 处属于第几档？",
  "第 {n} 处有多严重？",
]
levels = [
  "第 1 档（轻）：只是提醒，不挡合入",
  "第 2 档（中）：要作者回应之后才能合",
  "第 3 档（重）：必须拦下",
]

[fam.gate]
q = [
  "第 {n} 处该怎么处置？",
  "按门控表，第 {n} 处走哪一条？",
  "第 {n} 处应当放行、退回还是拦下？",
]

[fam.top]
q = [
  "最严重的是第几处？",
  "这几处里最严重的是哪一处？",
  "按严重度档，最该拦下的是第几处？",
]

[option.gate]
pass = "放行：这处改动可以直接进主干"
request = "请求修改：这处改动退回作者改完再说"
block = "拦下：这处改动不能进主干"

[option.position]
element = "第 {n} 处：{file} · {change} · {size}"
