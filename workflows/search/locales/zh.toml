lang = "zh"
language_name = "简体中文"

# 标题与摘要里不许出现的话术：来源类型 / 时效都归「来源与时效」那一行管，文本里再写一遍
# 就可能与那一行打架。只收高精度短语——宁可漏检也不误判，误判会在渲染期白拒一条本来
# 能用的数据。`official` / `unknown` / `stale` 是那一行的**取值词元本身**，照抄等于泄底。
banned_intent_phrases = [
  "官方",
  "官网",
  "权威",
  "来源类型",
  "时效",
  "已废弃",
  "过时",
  "official",
  "authoritative",
  "unknown",
  "stale",
]

[meta]
query_label = "查询"
source_label = "来源与时效"
title_label = "标题"
snippet_label = "摘要"
rules_label = "规则表"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
source_columns = "来源类型 | 时效"
rules_columns = "规则名 | 条件 | 处置"

[rules.spam_result]
condition = "摘要是垃圾内容：关键词堆砌、导流软文、纯广告"
verdict = "drop"

[rules.off_topic]
condition = "结果与查询不切题"
verdict = "drop"

[rules.navigational_non_official]
condition = "查询是找某个具体页面，而来源类型不是官方"
verdict = "drop"

[rules.unverified_source]
condition = "来源类型是看不出出处的转载站"
verdict = "cite_with_caveat"

[rules.stale_source]
condition = "时效是好几年没动过的"
verdict = "cite_with_caveat"

[rules.community_source]
condition = "来源类型是社区来源：论坛、博客、个人站"
verdict = "cite_with_caveat"

[rules.none]
condition = "以上都不命中"
verdict = "cite"

[dims]
query_kind = "查询意图"
topicality = "是否切题"
spam = "内容性质"

[prompt]
intro = "下面是一条**搜索结果**的特征清单。请按清单写出一句查询，再写出这条结果的标题与摘要。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "三段文本都必须是**单行**：查询一行、标题一行、摘要一到两句；不要换行，不要用 Markdown 围栏",
  "查询、标题、摘要里**不要**写这条结果是从哪儿来的，也不要写它有多新——来源类型与时效归「来源与时效」那一行管，写进文本就会跟它打架",
  "具体说：不要出现「官方 / 官网 / 权威 / 来源 / 时效 / 已废弃 / 过时」这类词，也不要写 official / unknown / stale 这几个词",
  "标题要像真实网页标题（一行，别写成一整句话）；摘要要像搜索引擎抓下来的那段正文",
  "查询意图那一档要一眼看得出来：找某个具体页面、想弄懂一件事、想办成一件事，三种之一",
  "「找某个具体页面」那一档：查询要写成**在找那个页面本身**（站点名或页面名），别写成「登录 / 下载 / 下单」这类动作——带动作词就变成「想办成一件事」了",
  "是否切题那一档要一眼看得出来：摘要要能看出跟查询是同一个话题，还是岔到别处去了",
  "**跑题**那一条：标题与摘要的**主体**必须是别的话题，整段读下来明显不是在回答那句查询——只在末尾顺带提一句不算跑题",
  "内容性质那一档要一眼看得出来：是正常网页，还是关键词堆砌 / 导流软文 / 纯广告",
  "不要写真实存在的公司、产品或代码库名字，一律用虚构的名字",
  "全部用{language}写；文件名与域名片段保持 ASCII",
]

[feature.query_kind.navigational]
brief = "这句查询是要找某个具体的页面或站点"
hint = "写成真人在搜索框里敲的那种找站点的问法：写站点名或页面名，不要写「登录 / 下载 / 下单」这类动作"

[feature.query_kind.informational]
brief = "这句查询是想弄懂一件事"
hint = "写成像是在问「为什么会这样」"

[feature.query_kind.transactional]
brief = "这句查询是想办成一件事"
hint = "写成像是要下单、下载或登录"

[feature.topicality.on_topic]
brief = "这条结果与查询是切题的"
hint = "标题与摘要要正面回答那句查询"

[feature.topicality.off_topic]
brief = "这条结果与查询是跑题的"
hint = "标题与摘要的主体都要岔到别的话题上去（不能只是顺带提一句），但仍要像同一领域里能搜到的东西"

[feature.spam.clean]
brief = "这条结果是干净内容"
hint = "像一篇正常网页的标题与摘要"

[feature.spam.spam]
brief = "这条结果是垃圾内容"
hint = "摘要仍要与查询是同一个话题，但满屏关键词堆砌、导流话术或纯广告"

[verify]
intro = "下面是一条搜索结果页。请按给定的选项反解它的特征。"
state_header = "【结果页全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"

[fam.query_kind]
q = [
  "这句查询想干什么？",
  "这句查询属于哪一类意图？",
  "按查询的意图选一项。",
]
[fam.query_kind.criteria]
navigational = "找某个具体的页面或站点"
informational = "想弄懂一件事"
transactional = "想办成一件事（下单 / 下载 / 登录）"

[fam.topicality]
q = [
  "这条结果与查询切题吗？",
  "这条结果是切题的还是跑题的？",
  "按「是否切题」选一项。",
]
[fam.topicality.criteria]
on_topic = "切题：摘要正面回应了那句查询"
off_topic = "跑题：摘要岔到别的话题去了"

[fam.spam]
q = [
  "这条结果是垃圾内容吗？",
  "这条结果的摘要是正常网页，还是垃圾内容？",
  "按「内容性质」选一项。",
]
[fam.spam.criteria]
true = "是垃圾内容：关键词堆砌 / 导流软文 / 纯广告"
false = "不是垃圾内容：正常网页的标题与摘要"

[fam.rule]
q = [
  "这条结果会命中规则表里的哪一条？",
  "规则表从上往下看，第一条命中的是哪一条？",
  "按规则表选一条命中的规则。",
]
[fam.rule.criteria]
spam_result = "摘要是垃圾内容"
off_topic = "结果与查询不切题"
navigational_non_official = "查询是找某个具体页面，而来源不是官方"
unverified_source = "来源是看不出出处的转载站"
stale_source = "时效是好几年没动过的"
community_source = "来源是社区来源"
none = "以上都不命中"

[fam.verdict]
q = [
  "最终该怎么处置这条结果？",
  "这条结果该直接引用、带保留地引用，还是弃用？",
  "按处置选一项。",
]
[fam.verdict.criteria]
cite = "直接引用"
cite_with_caveat = "引用，但要标注不确定性"
drop = "弃用，换别的结果"

[fam.trust]
q = [
  "这条结果的可信度是第几档？",
  "按可信度给这条结果定一档。",
  "这条结果可信到第几档？",
]
levels = [
  "0 档：完全不可信",
  "1 档：偏低",
  "2 档：中等",
  "3 档：高",
]
