# 检索 workflow 的中文文案：标签、文档类型、来源权威、主题词表、标题与摘要模板、问法与选项。
#
# 约定（由 tests/workflows/search/test_locales.py 锁住）：
# - 各语言的标签互不重叠（`reparse` 用合并表做语言无关的反解）；
# - 主题名之间、要点词之间都互不包含——判别器靠「问题里出现了哪个主题名」认主题、
#   靠「摘要里出现了几个要点词」算覆盖度，包含关系会同时污染这两条判据；
# - 只有 `conflict_a` / `conflict_b` 两条摘要提到指标名，所以整页里唯一的矛盾源
#   就是被点名的那一对；
# - 问「结果 {n}」/「结果 {i} 与结果 {j}」的那几族题面里，数字**只允许**是编号本身
#   （判别器从题面读编号重算）。

[meta]
title = "检索请求"
query_label = "用户问题"
kind_label = "要求的文档类型"
since_label = "更新日期不早于"
points_label = "问题要点"
results_label = "检索结果"
snippet_label = "摘要"
updated_label = "更新"
colon = "："
list_sep = "、"
field_sep = " · "

[doc_kind]
guide = "操作手册"
policy = "政策规定"
api = "接口文档"
incident = "故障复盘"
release = "版本说明"
faq = "常见问题"

[authority]
official = "官方文档"
team = "团队内部"
community = "社区问答"
blog = "个人博客"

[query]
# 三种问法：都嵌了主题名与两个要点词（判别器靠这两样认出主题、算覆盖度）。
tpl = [
  "{label}这件事，{p1}和{p2}分别是怎么规定的？",
  "关于{label}，我想了解{p1}与{p2}。",
  "{label}：{p1}、{p2} 有什么要求？",
]

[topic.refund]
label = "退款"
points = ["审批", "时限"]
metric = "金额上限"
values = ["5000 元", "20000 元"]

[topic.login]
label = "双因素登录"
points = ["恢复码", "重置"]
metric = "有效期"
values = ["7 天", "30 天"]

[topic.ratelimit]
label = "接口限流"
points = ["配额", "重试"]
metric = "每分钟上限"
values = ["600 次", "1200 次"]

[topic.retention]
label = "数据留存"
points = ["期限", "归档"]
metric = "保留月数"
values = ["18 个月", "36 个月"]

[topic.outage]
label = "线上故障"
points = ["根因", "改进"]
metric = "影响时长"
values = ["42 分钟", "95 分钟"]

[topic.rollout]
label = "版本发布"
points = ["变更", "兼容"]
metric = "灰度比例"
values = ["5%", "20%"]

[topic.billing]
label = "账单对账"
points = ["差异", "申诉"]
metric = "对账周期"
values = ["T+1", "T+7"]

[topic.webhook]
label = "回调通知"
points = ["签名", "投递"]
metric = "重试次数"
values = ["3 次", "8 次"]

[title.full]
text = "{label}流程说明"

[title.partial]
text = "{label}流程说明"

[title.empty]
text = "{label}规范说明"

[title.twin]
text = "{label}操作手册"

[title.old_hit]
text = "{label}常见问题"

[title.stale]
text = "{label}流程说明（旧版）"

[title.weak_hit]
text = "{label}历史文档"

[title.wrong_kind]
text = "{label}管理规定"

[title.other_topic]
text = "{other}说明"

[title.conflict]
text = "{label}：{p1}与{p2}要求"

[title.plain_a]
text = "{label}：{p1}说明"

[title.plain_b]
text = "{label}：{p2}说明"

[title.other_a]
text = "{other}：{op1}说明"

[title.other_b]
text = "{other}：{op2}说明"

[snippet.full]
text = "{label}：{p1}需要二级确认，{p2}以工单记录为准。"

[snippet.partial]
text = "{label}：{p1}需要二级确认。"

[snippet.empty]
text = "（未提供摘要）"

[snippet.twin]
text = "{label}操作手册：{p1}与{p2}的完整流程。"

[snippet.old_hit]
text = "{label}：{p1}与{p2}的常见问题解答。"

[snippet.stale]
text = "{label}（旧版）：{p1}与{p2}的规定。"

[snippet.weak_hit]
text = "{label}（历史归档）：{p1}与{p2}的旧口径。"

[snippet.wrong_kind]
text = "{label}的{p1}相关规定。"

[snippet.other_topic]
text = "{other}：{op1}与{op2}说明。"

[snippet.conflict_a]
text = "{label}：{p1}与{p2}要求，{metric}为 {v1}。"

[snippet.conflict_b]
text = "{label}：{p1}与{p2}要求，{metric}为 {v2}。"

[snippet.plain_a]
text = "{label}：{p1}的说明。"

[snippet.plain_b]
text = "{label}：{p2}的说明。"

[snippet.other_a]
text = "{other}：{op1}说明。"

[snippet.other_b]
text = "{other}：{op2}操作要点。"

[fam.best_result]
# 判据写在题面里：排序规则四档，读者只看 state 与题面就能算出唯一答案。
q = [
  "按排序规则，引擎应当把哪一条结果排在第一？排序规则：① 相关度高的在前；② 相关度相同时，来源权威高的在前（官方文档 > 团队内部 > 社区问答 > 个人博客）；③ 权威相同时，更新日期晚的在前；④ 再相同则编号小的在前。相关度的定义见相关度那一道题的量表。",
  "这几条结果里，最该先看的是哪一条？排序规则：① 相关度高的在前；② 相关度相同时，来源权威高的在前（官方文档 > 团队内部 > 社区问答 > 个人博客）；③ 权威相同时，更新日期晚的在前；④ 再相同则编号小的在前。",
  "哪一条结果该排在第一位？排序规则：① 相关度高的在前；② 相关度相同时，来源权威高的在前（官方文档 > 团队内部 > 社区问答 > 个人博客）；③ 权威相同时，更新日期晚的在前；④ 再相同则编号小的在前。",
]

[fam.next_action]
# 判据写在题面里：三档由「最相关那条」的相关度与要点覆盖决定，选项描述就是那三行。
q = [
  "下一步该做什么？",
  "拿到这页结果之后，下一步该采取哪个动作？",
  "接下来该走哪条路？",
]

[fam.answerable]
q = [
  "最相关的那条结果，摘要是否覆盖了问题的全部要点（要点词原样出现在摘要里才算覆盖）？",
  "排在第一的那条，摘要把问题的要点都提到了吗（要点词原样出现在摘要里才算覆盖）？",
  "最该先看的那条，摘要有没有覆盖问题的每一个要点（要点词原样出现在摘要里才算覆盖）？",
]
criteria = { "true" = "是，问题的要点在摘要里都出现了", "false" = "否，至少有一个要点没在摘要里出现" }

[fam.conflict]
q = [
  "结果 {i} 与结果 {j} 的摘要是否互相矛盾？",
  "结果 {i} 和结果 {j} 是不是对同一个指标给出了不同的取值？",
  "结果 {i} 与结果 {j} 有没有互相打架？",
]
criteria = { "true" = "是，两条对同一个指标给出了不同的取值", "false" = "否，两条没有互相矛盾的说法" }

[fam.same_source]
q = [
  "结果 {i} 与结果 {j} 是否来自同一份文档？",
  "结果 {i} 和结果 {j} 是同一份文档的两次命中吗？",
  "结果 {i} 与结果 {j} 的文档号相同吗？",
]
criteria = { "true" = "是，两条的文档号相同", "false" = "否，两条的文档号不同" }

[fam.probe_fresh]
q = [
  "结果 {n} 的更新日期是否不早于问题要求的日期？",
  "结果 {n} 够新吗（更新日期不早于要求的日期）？",
  "结果 {n} 的时效达标吗？",
]
criteria = { "true" = "达标，更新日期不早于要求的日期", "false" = "不达标，更新日期早于要求的日期" }

[fam.relevance]
q = [
  "结果 {n} 的相关度是几级？",
  "按下面的量表，给结果 {n} 的相关度定级。",
  "结果 {n} 属于哪一级相关度？",
]
levels = [
  "0 级：标题讲的不是问题问的主题",
  "1 级：主题对，但文档类型不是问题要求的类型",
  "2 级：主题与类型都对，但更新日期早于问题要求的日期",
  "3 级：主题、类型、更新日期都满足问题要求",
]

[fam.covered_points]
q = [
  "结果 {n} 的摘要覆盖了问题里的几个要点（要点词原样出现在摘要里才算覆盖）？",
  "数一下结果 {n} 的摘要里出现了几个问题要点（原样出现才算）。",
  "结果 {n} 的摘要提到了问题要点中的几个？",
]
levels = [
  "一个要点都没提到",
  "提到了 1 个要点",
  "提到了 2 个要点",
]

[option.result]
# 选项名是 `result_<编号>`，描述带文档号 / 标题 / 更新日期——三者一起才唯一
# （「又矛盾又同源」那一档里，被点名的两条是同一份文档、同一个标题）。
text = "{doc_id}｜{title}｜更新 {updated}"

[option.next_action]
answer = "直接回答——最相关那条相关度 3 级，且摘要覆盖了问题的全部要点，可以据此作答"
search_more = "再检一轮——最相关那条相关度 3 级，但摘要没覆盖全部要点，换个关键词再来一次"
switch_source = "换数据源——最相关那条连类型或时效都不对（相关度 ≤ 2），这页结果指望不上"
