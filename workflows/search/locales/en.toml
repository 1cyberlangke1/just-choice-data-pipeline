lang = "en"
language_name = "English"

# Phrases banned from the title and the snippet: the source type and the freshness belong to the
# "source and freshness" row, and repeating them here makes the two rows fight. Kept to
# high-precision phrases only — a false positive rejects an otherwise usable sample at render
# time. `official` / `unknown` / `stale` are the row's own value tokens: echoing them leaks the
# answer.
banned_intent_phrases = [
  "official",
  "authoritative",
  "source type",
  "freshness",
  "unknown",
  "stale",
  "deprecated",
]

[meta]
query_label = "Query"
source_label = "Source and freshness"
title_label = "Title"
snippet_label = "Snippet"
rules_label = "Rules"
header = "[{title}]"
row_prefix = "- "
paren = " ({text})"
colon = ": "
source_columns = "source type | freshness"
rules_columns = "rule | condition | verdict"

[rules.spam_result]
condition = "the snippet is spam: keyword stuffing, a funnel article, or a plain ad"
verdict = "drop"

[rules.off_topic]
condition = "the result is off topic"
verdict = "drop"

[rules.navigational_non_official]
condition = "the query seeks one specific page, and the source is not official"
verdict = "drop"

[rules.unverified_source]
condition = "the source is a repost site with no traceable origin"
verdict = "cite_with_caveat"

[rules.stale_source]
condition = "the source has not been touched in years"
verdict = "cite_with_caveat"

[rules.community_source]
condition = "the source is a community source: forum, blog, or personal site"
verdict = "cite_with_caveat"

[rules.none]
condition = "none of the above"
verdict = "cite"

[dims]
query_kind = "query intent"
topicality = "on topic"
spam = "content nature"

[prompt]
intro = "Below is a **feature list for one search result**. Write the query a user would type, then the title and the snippet of that result."
bullet = "- {dim}: {brief} ({hint})"
rules = [
  "All three pieces must be **single line**: one line for the query, one for the title, one or two sentences for the snippet; no line breaks, no Markdown fences",
  "Never state where this result came from, and never state how new it is — the source type and the freshness belong to the \"source and freshness\" row, and repeating them makes the two rows fight",
  "Concretely: do not write official / authoritative / unknown / stale, and do not mention the source type or the freshness at all",
  "The title must read like a real page title (one line, not a whole sentence); the snippet must read like the passage a search engine scraped",
  "The query intent must be **unmistakable**: seeking one specific page, trying to understand something, or trying to get something done",
  "For the **seeking one specific page** case: write the query as looking for **the page itself** (a site or page name), not as an action like \"login / download / order\" — an action verb turns it into \"trying to get something done\"",
  "The topicality must be **unmistakable**: the snippet must show whether it answers the query or wanders off to another topic",
  "For the **off-topic** case, the title and the snippet must be **mainly about another subject** — read as a whole it clearly does not answer the query; one stray sentence at the end is not enough",
  "The content nature must be **unmistakable**: an ordinary page, or keyword stuffing / a funnel article / a plain ad",
  "Do not name real companies, products, or code repositories: invent a concrete brand-like or code name of your own — never write placeholder wording such as \"fictional company\"",
  "Write everything in {language}; keep file names and domain fragments in ASCII",
]

[feature.query_kind.navigational]
brief = "the query seeks one specific page or site"
hint = "write a site or page name the way a person types it into a search box; no action verbs like login, download, or order"

[feature.query_kind.informational]
brief = "the query tries to understand something"
hint = "write it as if asking \"why does this happen\""

[feature.query_kind.transactional]
brief = "the query tries to get something done"
hint = "write it as if about to order, download, or sign in"

[feature.topicality.on_topic]
brief = "this result is on topic"
hint = "the title and snippet must answer the query head-on"

[feature.topicality.off_topic]
brief = "this result is off topic"
hint = "the title and the snippet must both be mainly about another subject (not one stray sentence), yet still look like something the same search could return"

[feature.spam.clean]
brief = "this result is clean"
hint = "like the title and snippet of an ordinary page: concrete facts about the subject, **not** marketing filler (even when the subject is not the query's)"

[feature.spam.spam]
brief = "this result is spam"
hint = "keep the snippet about the same topic as the query, but make it reek of keyword stuffing, funnel copy, or a plain ad"

[verify]
intro = "Below is one search result page. Infer its features using the given options."
state_header = "[Full page]"
questions_header = "[Questions]"
option_line = "   - {name}: {desc}"

# 反解提示词里 `spam` 那一题的选项名用**取值本身**（`clean` / `spam`），不是数据集那道
# noul 题的 criteria key（`true` / `false`）：草稿要的是前者，两套词摆在一起模型得自己翻译，
# 实测就是翻译错（en 侧 6 条里 5 条把 `clean` 读成 `spam`）。
[verify.trace_options.spam]
spam = "keyword stuffing / a funnel article / a plain ad — the page exists to sell or funnel"
clean = "the title and snippet of an ordinary page — a page about another subject is not spam, however irrelevant it looks"

[fam.query_kind]
q = [
  "What is this query after?",
  "Which kind of intent does this query carry?",
  "Pick one by the query's intent.",
]
[fam.query_kind.criteria]
navigational = "seeking one specific page or site"
informational = "trying to understand something"
transactional = "trying to get something done (order / download / sign in)"

[fam.topicality]
q = [
  "Is this result on topic?",
  "Is this result on topic or off topic?",
  "Pick one for topicality.",
]
[fam.topicality.criteria]
on_topic = "on topic: the snippet answers the query head-on"
off_topic = "off topic: the snippet wanders to another topic"

[fam.spam]
q = [
  "Is this result spam?",
  "Is the snippet an ordinary page or spam?",
  "Pick one for the content nature.",
]
[fam.spam.criteria]
true = "spam: keyword stuffing / a funnel article / a plain ad"
false = "not spam: the title and snippet of an ordinary page — a page about **another subject** is not spam, however irrelevant it looks"

[fam.rule]
q = [
  "Which rule does this result hit?",
  "Reading the rules top to bottom, which one hits first?",
  "Pick the rule this result hits.",
]
[fam.rule.criteria]
spam_result = "the snippet is spam"
off_topic = "the result is off topic"
navigational_non_official = "the query seeks one specific page, and the source is not official"
unverified_source = "the source is a repost site with no traceable origin"
stale_source = "the source has not been touched in years"
community_source = "the source is a community source"
none = "none of the above"

[fam.verdict]
q = [
  "What should be done with this result?",
  "Should this result be cited, cited with a caveat, or dropped?",
  "Pick one for the verdict.",
]
[fam.verdict.criteria]
cite = "cite it"
cite_with_caveat = "cite it, but flag the uncertainty"
drop = "drop it and use another result"

[fam.trust]
q = [
  "Which trust level does this result deserve?",
  "Score this result's trust.",
  "How trustworthy is this result?",
]
levels = [
  "level 0: not trustworthy at all",
  "level 1: low",
  "level 2: medium",
  "level 3: high",
]
