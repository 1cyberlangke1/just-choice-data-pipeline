# 安全警报风险定级（alertrisk）workflow 的中文文案。
#
# 输入：`workflows.alertrisk.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 四个抬头标记两两不互为前缀（fact_mark / matrix_mark / rule_mark / content_mark）；
# - `[level.*]` 的键与 `features.LEVELS` 一一对应、`[act.*]` 的键与 `features.ACTS` 一一对应；
# - `[fact.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[source.*]` 的键与 `features.SOURCES` 一一对应；
# - 每条因子的 `avoid` 都不许误触**别的**因子（`test_locales` 会逐条扫）；
# - 判据原文与反面文案里一个花括号都不许有（它们会被拼进提示词，花括号是填槽标记）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"

[state]
fact_mark = "【判定事实】"
matrix_mark = "【定级矩阵】"
rule_mark = "【处置档位】"
content_mark = "【待定级警报】"
tag_sep = "："
rule_sep = " —— "
matrix_arrow = " → "
matrix_note = "（R1=high 表示 R1 那条判据成立，R1=low 表示不成立；等级由这三格查表得来）"

[fact.R1]
name = "暴露面对公网可达"
rule = "`exposure:` 那一行里写着 `reachable=public`（这台机器从公网就能访问到）——**只看这一行**，别处的同名字样不算"
avoid = "在 `exposure:` 那一行里写 `reachable=public`"

[fact.R2]
name = "无需凭据即可利用"
rule = "`exploit:` 那一行里写着 `auth=none`（利用它不需要任何凭据）——**只看这一行**"
avoid = "在 `exploit:` 那一行里写 `auth=none`"

[fact.R3]
name = "影响十台以上"
rule = "`impact:` 那一行里 `hosts=` 后面跟着**至少两位数字**（十台以上，没有前导零）——**只看这一行**"
avoid = "在 `impact:` 那一行里把 `hosts=` 顶到两位数以上"

[level.L1]
name = "1 级（可忽略）"

[level.L2]
name = "2 级（低）"

[level.L3]
name = "3 级（中）"

[level.L4]
name = "4 级（高）"

[level.L5]
name = "5 级（紧急）"

[act.monitor]
name = "记入清单，按周巡检"

[act.ticket]
name = "开一张工单，按常规排期修"

[act.patch_now]
name = "当天出补丁并推送"

[act.isolate]
name = "先隔离受影响的机器，再升级处理"

[source.edr]
desc = "终端检测（EDR）：主机上装的 agent 报出来的可疑进程与脚本行为"

[source.waf]
desc = "Web 应用防火墙（WAF）：网关上报出来的可疑 HTTP 请求"

[source.cloud]
desc = "云配置审计：云账号里被扫出来的不合规配置项"

[prompt]
intro = "你是合成数据的写手。请写**一屏安全警报记录**——一条真实告警进来时留下的那几行材料，五行，必须读得通：键名与冒号照下面的格式规格写，整屏在 {min} 到 {max} 个字符之间。"
lang_rule = "键名与 `hosts=` / `reachable=` / `auth=` 这些**取值**用英文原样写（它们本来就是机器格式），但 `detail:` 那一行的描述一律用{language}书写。"
text_only = "这一屏**只写文本**：不要真的去连任何机器、跑任何命令、查任何漏洞库或威胁情报（判据认的只是字面，跑不跑都不改变标签）。"
source_line = "这条警报来自：{source}。"
direction_line = "这条警报指向的**手法方向**是：{direction}。`detail:` 那一行要真的落在它上面（写清是什么手法、打到了什么），不要写成放到哪条通道都一样的套话。"
format_header = "**格式规格**（五行，每行的键名与冒号照抄，取值自己编）："
hits_header = "这屏记录**必须取到**下面这几条风险因子的高危档。取到 = 下面这个形状**真的出现在它说的那一行里**（把形状挪到别的行、换个写法、少写一个字符，都不算取到）："
hits_line = "- 因子「{name}」的判据是：{rule}——记录里必须真的出现**符合这个判据、且落在它那一行**的内容"
vary_rule = "判据里列的那些词只是**形状**的举例：规则名、主机名、进程名、端口、CVE 编号、描述都自己编、记录内容自己组织；但**判据要的那个形状本身要原样出现**（取值、数字位数这些照写，不是「换个说法」），只是**不要**把判据的整段原文贴进记录。"
no_hits = "这屏记录**一个因子都不许取到高危档**：下面三条判据一条都不能满足——它得是一条**平平无奇、看一眼就能关掉**的警报。"
miss_header = "同时，这屏记录**不许**取到下面这几条："
miss_line = "- 不许出现：{avoid}（因子「{name}」是「{rule}」）"
length_rule = "整屏记录 {min}~{max} 个字符，五个键名都要**单独占一行、后面跟冒号**，不要标题、不要分点、不要解释、不要围栏。"
self_check = "输出前逐条自查：要求出现的形状，是不是**按形状、按要求的那一行**真的出现了（真的在 `exposure:` 行里、真的在 `exploit:` 行里、真的在 `impact:` 行里）？要求不许出现的那几条，记录里真的一处都没有吗？`detail:` 那一行是{language}吗？它写的是**这条警报本身**（哪台机器、什么进程或请求、命中了什么规则、要不要人管），而不是在复述判据、也没有提到判据名？它有没有真的落在上面指定的**手法方向**上（而不是随便一句放到哪条通道都一样的套话）？五个键名都写全了吗（一行都不许少）？"
output = "只输出一个 JSON 对象，字段是 packet（那五行记录字符串）；不要解释、不要围栏。"

# 手法方向词表：spec 里存的是**下标**，所以这份表要与别的语言等长（test_locales.py 锁住）。
# 每一条都是**跨通道通用**的手法（哪条通道都报得出来），所以它不会与 `source` 打架。
directions = [
  "凭据窃取：偷账号口令、会话令牌或凭据文件",
  "数据外传：把内网数据成批发往外部地址",
  "加密勒索：加密文件后索要赎金",
  "挖矿劫持：占用算力偷偷挖加密货币",
  "横向移动：从一台机器往别的机器上扩散",
  "后门持久化：留下一个能反复回来的入口",
  "权限提升：从普通权限爬到管理员或越权拿到数据",
  "探测扫描：成批试探端口、路径或账号",
]

[prompt.format]
rule = "`rule: <这条警报是哪条规则报出来的>` —— 写一个规则名（自己编，写成英文标识符那种样子）"
impact = "`impact: hosts=<受影响的主机台数>` —— `hosts=` 后面跟台数（十进制整数），再跟一句短说明（都是些什么机器）"
exposure = "`exposure: reachable=<public 或 internal>` —— 从公网能访问到就写 `public`，只有内网能访问就写 `internal`"
exploit = "`exploit: auth=<none 或 required>` —— 利用它不需要凭据就写 `none`，需要凭据就写 `required`"
detail = "`detail: <一句告警描述>` —— 用目标语言写一句**值班的人**看得懂的描述：哪台机器、什么进程或请求、命中了什么规则、要不要人管。**不要**描述这条警报「算不算高危」「取到没取到哪一档」，也**不要**提到判据名或这一屏的格式要求"

[fam.fact]
q = ["这条警报有没有取到「{name}」这一档？", "按「{name}」这条判据（{rule}），这条警报算不算取到它？"]
criteria_true = "取到了这一档"
criteria_false = "没有取到这一档"

[fam.grade]
q = ["按上面的定级矩阵，这条警报定几级？", "把三个因子拿去查定级矩阵，这条警报的风险等级是几级？"]

[fam.highs]
q = ["这条警报实际取到了哪几个因子的高危档？", "取到高危档的是哪几个因子？"]
none = "一个都没取到"
joiner = " + "

[fam.act]
q = ["按上面的处置档位表，这条警报该走哪一档？", "按等级查处置档位表，这条警报下一步该做什么？"]

[verify]
intro = "下面是一屏安全警报记录：先是判定事实表、定级矩阵与处置档位表，然后是这条警报本身。**每一条判定事实都印着它自己的机械判据和它看的那一行**——照着那条判据逐行比，只按字面判哪几个因子取到了高危档，再拿这三格去查定级矩阵。不要做语义联想，**也不要真的去执行任何东西、连任何机器、查任何库**。"
state_header = "[待判材料]"
q = "这条警报取到了哪几个因子的高危档？逐个给出**因子编号**与**让它取到高危档的那段原文**——原样抄，不要改写、不要缩写；一个都没取到就给空数组。抄不出来的那条不要报：抄不出来就不算。**引文自己要满足那条判据**：判据看哪一行，就把**那一行连键名一起**抄全（只抄一个取值、不带它所在的那一行，不算）。**每一条判据都要把整屏记录从头读到尾**，不要只看开头。最后再答一次风险等级（1~5 的整数，按矩阵查出来的那个）。"
