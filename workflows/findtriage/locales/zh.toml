lang = "zh"
language_name = "简体中文"

[meta]
finding_label = "审查发现"
fix_label = "建议修法"
record_label = "改动记录"
rules_label = "判定口径"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
record_columns = "序号 | 行号 | 本次改动 | 符号"
row_ref = "第 {n} 条"
no_cite = "none"
cite_pattern = '第\s*(\d+)\s*行'
cite_hint = "第 42 行"

[rules.baseless]
text = "空口：发现里引用的那个符号在记录里根本查不到 → 这条发现没有依据，处置「丢弃」。"

[rules.attribution]
text = "归因：那个行号在记录里查得到，而且「本次改动」那一列是 untouched → 不归这次改动，处置「只记录」。"

[rules.unknown]
text = "未知：那个行号在记录里根本查不到 → 引入性说不清，处置「只记录」。"

[rules.fix]
text = "修法：建议修法里没有点名任何具体符号 → 落不了地，处置「只记录」。"

[rules.else]
text = "兜底：以上都不沾 → 处置「必须修」。"

[dims]
cite = "发现指向的那一行"
fix = "建议修法"

[prompt]
intro = "下面是一次代码改动审查的场景。请写出**一条审查发现**与**一条建议修法**（各一行）。"
bullet = "- {dim}：{brief}（{hint}）"
cite_line = "发现指向的是**第 {n} 行**：照实写这个行号，别改成记录里有的别的行号。"
symbol_line = "发现引用的符号是 {symbol}：在发现里用反引号把它括起来，只括这一个。"
fix_symbol_line = "建议修法要点名的符号是 {symbol}：在修法那一行用反引号把它括起来。"
fix_vague_line = "建议修法**只写泛泛的话**（比如「需要进一步排查」）：那一行里一个符号都别点名，不要用反引号。"
rules = [
  "只写一条发现和一条修法，各一行；不要换行，不要用 Markdown 围栏",
  "发现那一行要写清它指向第几行，写成「第 42 行」这种样子",
  "发现那一行要把它引用的符号用反引号括起来（`符号名`），只括那一个",
  "修法那一行点名符号时也用反引号括起来；若上面说「只写泛泛的话」，那一行就一个反引号都别用",
  "不要写真实存在的项目、公司或代码库名字，一律用虚构的名字",
  "全部用{language}写",
]

[feature.cite.touched]
brief = "它指向的那一行**本次改动碰过**（新增或改过）"
hint = "写成是在说这次改动刚引入的问题"

[feature.cite.untouched]
brief = "它指向的那一行**本次改动没碰过**"
hint = "写成是在说一处改动之前就在的旧问题"

[feature.cite.missing]
brief = "它指向的那个行号**在记录里查不到**"
hint = "照实写那个行号，别改成记录里有的行号"

[feature.fix.concrete]
brief = "建议修法**点名了具体符号**"
hint = "写成一条能直接照做的改法"

[feature.fix.vague]
brief = "建议修法**没有点名任何符号**"
hint = "写成「需要进一步排查」这类落不了地的话"

[verify]
intro = "下面是一道「改动引入性判定」题。请只按字面反解三件事：这条发现指向改动记录里第几条、它引用的符号是哪一个、那条建议修法点没点名具体符号。"
state_header = "【题面全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"
symbol_q = "发现里用反引号括起来的那个符号是哪一个？（原样抄出来，不要带反引号）"

[fam.cite]
q = [
  "这条发现写的行号，在改动记录里是第几条？",
  "按发现里写的行号，它在记录表里是第几条？",
  "这条发现对准的是记录里的哪一条（按它写的行号）？",
]
[fam.cite.opt]
none = "记录里没有它指向的那个行号"

[fam.introduced]
q = [
  "这条发现指出的问题，是本次改动引入的吗？",
  "按记录表，它指向的那一行本次被碰过吗？",
  "这个问题的账该算在本次改动头上吗？",
]
[fam.introduced.criteria]
yes = "是：指向的那一行本次是新增或改过的"
no = "不是：指向的那一行本次没被碰过"
unknown = "说不清：那个行号在记录里查不到"

[fam.supported]
q = [
  "发现引用的那个符号，在它指向的那一条记录里吗？",
  "这条发现的证据落在哪里？",
  "按记录表看，这条发现的证据够不够硬？",
]
[fam.supported.criteria]
strong = "硬：引用的符号就在它指向的那一条记录里"
weak = "偏软：那个符号落在记录里别的条目上"
none = "没有：那个符号在记录里根本查不到"

[fam.actionable]
q = [
  "这条建议修法点名了要改的具体符号吗？",
  "照这条修法，能直接动手改吗？",
  "修法落得了地吗（有没有点名具体符号）？",
]
[fam.actionable.criteria]
true = "能：修法里点名了具体的符号"
false = "不能：修法里只有泛泛的话，一个符号都没点"

[fam.triage]
q = [
  "按判定口径，这条发现的处置档是哪一个？",
  "这条发现最终该怎么处置？",
  "按记录表与口径表算下来，它落在哪一档处置上？",
]
[fam.triage.criteria]
must_fix = "必须修：本次引入、证据够硬、修法也落得了地"
log_only = "只记录：先记下，这次不动手"
drop = "丢弃：不归这次改动"

[fam.decoy]
q = [
  "记录里有没有一条，它的符号与发现引用的符号只差一点（近形但不相同）？",
  "表里存在与引用符号长得几乎一样的条目吗？",
  "记录里有没有一个和引用符号只差一个字母的符号？",
]
[fam.decoy.criteria]
true = "有：表里有一条的符号是引用符号的近形"
false = "没有：表里没有这种近形符号"
