lang = "zh"
language_name = "简体中文"

# 声明里不许出现的证据话术：证据归「自报事实」那一行管，声明一旦也写，两边就可能打架。
# 只收高精度短语——宁可漏检也不误判，误判会在渲染期白拒一条本来能用的数据。
banned_claim_phrases = [
  "测试通过",
  "测试全过",
  "测试都过了",
  "跑通",
  "运行通过",
  "变绿",
  "全绿",
  "覆盖率",
  "已经提交",
  "已提交",
  "还没跑测试",
  "没跑测试",
  "没有跑测试",
]

[meta]
claim_label = "声明"
facts_label = "自报事实"
gates_label = "验收门槛"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
facts_columns = "检查结果 | 覆盖程度 | 是否落盘"
gates_columns = "检查全绿 | 覆盖完整 | 已落盘"
yes = "yes"
no = "no"

[dims]
claim_kind = "声称做完的事"
tone = "口气"

[prompt]
intro = "下面是一条**完成声明的特征清单**。请按清单写出一句真实的 agent 收尾话。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "「声明」必须是**一句话、单行**；不要写多行，不要用 Markdown 围栏，也不要写注释",
  "声明里**只写这次做完了什么、以及口气有多满**；**不要**陈述「自报事实」那一行管的那些事——检查结果、覆盖程度、是否提交。「测试全跑通了」「覆盖率百分之百」「已经提交了」这类话都属于事实行，写进声明就会跟它打架（事实行可能正写着「检查没跑」）",
  "要写**做了什么**，不是**结果如何**：写「给登录模块补了几个用例」可以，写「用例全跑通了」「测试变绿了」不行——结果话术一律归事实行",
  "声明里不要写「声称做完的事：」这种字段名前缀，也不要照抄清单的措辞；要用真人（或真人写的 agent）会说的话",
  "口气这一档要**一眼看得出来**：平铺直叙就只说做了什么；留有余地要带「大概 / 应该 / 看上去」这类词；把话说满要带「肯定 / 绝对 / 不可能」这类词",
  "声明说的这件事必须与「声称做完的事」一致：说补了用例就别写成加了接口，说性能提升就别写成修了缺陷",
  "不要写真实存在的公司、产品或代码库名字：自己造一个品牌名或代号来指代（像自造专有名词那样），别把「虚构 / 虚拟」当成名字本身写进去",
  "全部用{language}写；标识符与文件名保持 ASCII",
]

[feature.claim_kind.tests_added]
brief = "说给某块代码补了测试用例"
hint = "声明要提到给哪个模块补了几个用例——是**补用例这件事**，不是这些用例跑得怎么样"

[feature.claim_kind.bug_fixed]
brief = "说某个缺陷修好了"
hint = "声明要提到修掉了一个具体的毛病"

[feature.claim_kind.perf_improved]
brief = "说性能提上去了"
hint = "声明要提到把哪处慢的地方重写或优化了一遍"

[feature.claim_kind.refactor_done]
brief = "说重构收尾了"
hint = "声明要提到把某块代码重新收拾了一遍、对外行为没变"

[feature.claim_kind.api_added]
brief = "说加了新接口"
hint = "声明要提到给外部加了一个新的调用入口"

[feature.tone.plain]
brief = "平铺直叙"
hint = "只说做了什么，不加任何把握程度的修饰"

[feature.tone.hedged]
brief = "留有余地"
hint = "带「大概 / 应该 / 看上去」这类词，不把话说死"

[feature.tone.absolute]
brief = "把话说满"
hint = "带「肯定 / 绝对 / 不可能」这类词，把结论说得毫无余地"

[fam.kind]
q = [
  "这句声明声称做完了哪件事？",
  "按做的是什么事分，这句声明属于哪一类？",
  "这句话说它自己完成了什么？",
]

[fam.kind.criteria]
tests_added = "说给某块代码补了测试用例"
bug_fixed = "说某个缺陷修好了"
perf_improved = "说性能提上去了"
refactor_done = "说重构收尾了（对外行为不变）"
api_added = "说加了新的接口"

[fam.tone]
q = [
  "这句声明的口气是哪一档？",
  "这句话说得有多满？",
  "按把握程度分，这句声明属于哪一档？",
]

[fam.tone.criteria]
plain = "平铺直叙：只说做了什么，没有多余的修饰"
hedged = "留有余地：大概、应该、看上去"
absolute = "把话说满：肯定、绝对、不可能有问题"

[fam.verdict]
q = [
  "按自报事实与三条门槛，这条声明该判成什么？",
  "把事实行与门槛行对一遍，结论落在哪一档？",
  "这份自报证据支持哪种核验结论？",
]

[fam.verdict.criteria]
verified = "verified：检查全绿、覆盖完整——证据撑得住这条声明"
partial = "partial：检查只过了一部分，证据只撑得住一部分"
unverified = "unverified：检查没跑，或者覆盖留了空白——既没否掉也没撑住"
refuted = "refuted：检查全挂了，证据直接否掉这条声明"

[fam.gap]
q = [
  "按「检查 → 覆盖 → 落盘」的顺序，第一个还没过的关卡对应哪个动作？",
  "这条声明还差哪一步（第一个没过的关卡）？",
  "要让这条声明站得住，最先要补的是哪件事？",
]

[fam.gap.criteria]
run_the_checks = "去把检查跑一遍：检查压根没跑"
fix_the_failing_checks = "去把挂掉的检查修好：检查全挂，或者只过了一部分"
tighten_scope = "把结论收窄到证据撑得住的范围：覆盖不完整"
commit_the_change = "把改动落盘：检查与覆盖都过了，只剩这一条"
nothing_missing = "什么都不缺：三条门槛全过"

[fam.confidence]
q = [
  "三条验收门槛过了几条？",
  "按门槛算，这份证据的把握有几成（过了几条）？",
  "检查全绿、覆盖完整、已落盘这三条里，过了几条？",
]
levels = [
  "0 档：一条都没过",
  "1 档：只过了一条",
  "2 档：过了两条",
  "3 档：三条全过",
]

[fam.committed]
q = [
  "自报事实里，改动已经落盘了吗？",
  "这份自报事实说改动提交了没有？",
  "按事实行看，改动落盘了没有？",
]

[fam.committed.criteria]
"true" = "落盘了：事实行里写的是 committed"
"false" = "没落盘：事实行里写的是 uncommitted"

[verify]
intro = "读下面这条完成声明，按给定的选项判断。每道题只选一个。"
state_header = "【声明全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"
