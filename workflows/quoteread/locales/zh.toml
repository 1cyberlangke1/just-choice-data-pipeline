# 行情读数判读（quoteread）workflow 的中文文案。
#
# 输入：`workflows.quoteread.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 抬头 / 区块抬头两两不互为前缀，且不与英文撞车（反解靠最长前缀认标签）；
# - `[name.*]` 的键与 `features.NAME_IDS` + `features.OOD_NAME_IDS` 一一对应，名字互不相同；
# - `[unit.*]` 只有 pct / bp 两个键，且都不是标的名的一部分；
# - 四个题族的问法模板互不相同（`locate` 会静默取第一个命中）；
# - `[fam.tier].levels` 五档、`[fam.leader].criteria` 六个标的名键（按 case 取其中三个）、
#   两个 noul 族的 criteria 只有 true / false。

lang = "zh"
language_name = "简体中文"

[meta]
request = "行情读数请求号"
table = "读数表"
sep = "|"

[name]
I1 = "大盘指数"
I2 = "权重股"
I3 = "小盘股"
A1 = "商品期货"
A2 = "外汇"
A3 = "国债"

[unit]
pct = "%"
bp = "bp"

[rules]
lines = [
  "换算规则：读数表里每行的单位可能不同（百分比 % 或基准点 bp），一律先换算成基准点再比较；1% = 100 基准点。",
  "档位表（按绝对基准点数）：不足 20 为几乎平盘；20 ~ 49 为小幅波动；50 ~ 99 为中等波动；100 ~ 199 为大幅波动；200 及以上为剧烈波动。",
  "警戒线为 150 基准点：绝对值达到或超过它就算触发。",
  "并列时取表中序号靠前的标的。",
]

[fam.tier]
q = [
  "读数表里绝对值最大的那条读数，换算成基准点后落在哪一档？",
  "按档位表，这屏读数里波动最大的那一条落在哪一档？",
]
levels = [
  "几乎平盘（不足 20 基准点）",
  "小幅波动（20 ~ 49 基准点）",
  "中等波动（50 ~ 99 基准点）",
  "大幅波动（100 ~ 199 基准点）",
  "剧烈波动（200 基准点及以上）",
]

[fam.leader]
q = [
  "换算成基准点后，涨幅最大的是哪个标的？",
  "按基准点比较，这屏读数里涨得最多的标的是哪一个？",
]
criteria = { I1 = "大盘指数", I2 = "权重股", I3 = "小盘股", A1 = "商品期货", A2 = "外汇", A3 = "国债" }

[fam.alert]
q = [
  "换算成基准点后，这屏读数里有没有哪一条的绝对值达到或超过 150 基准点的警戒线？",
  "这屏读数里存在越过警戒线（绝对值 150 基准点）的标的吗？",
]
criteria = { true = "有", false = "没有" }

[fam.divergent]
q = [
  "这屏读数里有没有出现一涨一跌（既有一条在涨、又有一条在跌）？",
  "这屏读数的方向背离了吗（存在正读数、也存在负读数）？",
]
criteria = { true = "有", false = "没有" }
