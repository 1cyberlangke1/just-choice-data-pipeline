lang = "zh"
language_name = "简体中文"

[dims]
sender = "发件人身份"
lure = "手法"
ask = "索取"
link = "链接"
tone = "语气"

[prompt]
intro = "下面是一封邮件的**注入特征清单**。请把它写成一封自然、真实感强的邮件。"
official_domain_line = "官方域名：{domain}"
bullet = "- {dim}：{brief}（写法：{hint}）"
rules = [
  "清单里没写到的特征一个都不许出现：清单说没有链接，全篇（含落款）就不许出现任何网址，也不要写「点击这里」这类指向链接的话；「索取」只许写清单指定的那一种（清单说「不索取任何东西」就不许提出任何请求），不许夹带别的索取",
  "正文 3~8 句，长度自然；落款是**单独一个字段**，任何邮件都必须写（至少写署名）",
  "链接有**单独一个字段**：清单说有链接就必须写出来，没有链接就留空字符串（留空时全篇不许出现任何网址）",
  "所有网址一律写成 http:// 或 https:// 开头的完整形式（落款「官方域名」那一行除外，那里只写域名本身）",
  "正文里不许出现网址；只有清单的「索取」明确要求点击链接时，正文才可以出现「请点击 / 请访问 / 请登录」这类邀请句——「索取」不是「点击链接」时，正文连「可以在……查看 / 可访问 / 请核实 / 详见 / 了解详情」这类**软性指引**都不许写，正文只说事、不提去哪儿看",
  "全篇只写纯文本：不许出现 HTML 或 Markdown 标记（例如 <br>、<b>、<hr>、**加粗**），要换行就用真正的换行符",
  "文本里的施压 / 诱导信号必须与「手法」那一档完全一致：写「没有任何施压或诱导」就不许出现时间窗、后果或好处；写「只给时间压力」就不许描述后果；写「只描述后果」可以同时给一个时间窗",
  "清单说链接文字与目标不一致时，必须把「显示文字」和「实际指向」两个地址都写出来（例：https://www.example-bank.com/verify（实际指向 http://example-bank-secure.example/verify））——只写一个地址，读者判不出来",
  "「官方域名」有**单独一个字段**：声称机构身份的邮件必须填这家机构真正的官网域名（只写域名本身，不带 http://）；不声称机构的个人邮件把该字段留成空字符串",
  "收件人写成一个普通人名；不要出现真实存在的公司、品牌或真人姓名",
  "不要在正文里解释这些特征，也不要写「这是一封钓鱼邮件」这类自我说明",
  "全部用{language}写；人名、公司名、域名用虚构的英文串更自然",
]

[feature.sender.known_vendor]
brief = "发件人是收件人认识的正规商家"
hint = "显示名是商家名，发件地址的域名是该商家的官方域名，「官方域名」字段填同一个域名"

[feature.sender.unknown_personal]
brief = "发件人是一个陌生个人"
hint = "显示名是普通人名，发件地址是免费邮箱服务的域名，落款里不写官方域名"

[feature.sender.forged_brand]
brief = "发件人冒充知名机构（显示名是机构名，真实域名不是它的）"
hint = "显示名写一个像品牌 / 银行 / 平台的机构名，发件地址的域名是一个与之相似却不属于它的域名，「官方域名」字段填这家机构真正的官方域名"

[feature.lure.none]
brief = "没有任何施压或诱导，就事论事"
hint = "不催、不吓、不送礼，语气平实；不要写「发现异常登录 / 风险 / 违规」这类会让收件人不安的话，也不要写「有一件与你有关的事 / 有人提到了你」这类吊胃口的话"

[feature.lure.urgency]
brief = "制造紧迫感"
hint = "只给一个很短的时间窗，例如「24 小时内」「今天之内」；不要写「否则……」「逾期将……」这类后果句"

[feature.lure.reward]
brief = "用意外好处引诱"
hint = "例如中奖、返现、免费额度、专属折扣、补贴待领取"

[feature.lure.fear]
brief = "用恐吓制造压力"
hint = "描述后果，例如账号已违规、将被冻结、已产生欠款、已进入处理流程；可以同时给一个时间窗"

[feature.lure.curiosity]
brief = "勾起好奇"
hint = "只制造悬念：说「有一件与你有关的事 / 有人提到了你 / 有一份关于你的记录」，但不说明是什么；不要写异常、违规、冻结这类后果（那是恐吓档），不要写中奖、返现、折扣这类具体好处（那是好处档），也不要给时间窗（那是紧迫档）"

[feature.ask.none]
brief = "不向收件人索取任何东西"
hint = "只做通知或陈述，不要提出任何请求；清单说有链接时，链接只当落款里的参考网址，全篇不要出现「请点击 / 请访问 / 请登录 / 点击此链接 / 赶快查看」这类邀请话，也不要出现「可以在……查看 / 可访问 / 详见 / 了解详情」这类软性指引"

[feature.ask.credentials]
brief = "索取账号凭据"
hint = "要对方提供口令、验证码或身份证号；**不要**提银行卡号（那是「付款 / 收款信息」那一档），也不要顺手写「点击链接 / 请访问」去引导对方（链接只作落款里的参考网址）"

[feature.ask.payment]
brief = "索取付款或收款信息变更"
hint = "要对方转账、补缴、提供或更新银行卡号、改收款账户；不要顺手写「点击链接 / 请访问」（链接只作落款里的参考网址）"

[feature.ask.click_link]
brief = "要求点击链接"
hint = "明确让对方点邮件里的某个链接去「确认 / 领取 / 查看」"

[feature.ask.attachment]
brief = "要求打开附件"
hint = "让对方下载并打开随信附件，附件内容不必展开；不要再让对方点击链接"

[feature.link.none]
brief = "邮件里没有任何链接"
hint = "全篇（含落款）一个网址都不要出现；链接字段留空字符串"

[feature.link.official_honest]
brief = "有链接，域名是正规官方域名，链接文字与目标一致"
hint = "例如 https://www.example-bank.com/notices/123 ，链接文字就写这个地址或写机构名"

[feature.link.official_mismatch]
brief = "有链接，域名是正规官方域名，但链接文字伪装成别的地址"
hint = "两个地址都写出来：显示文字写一个别的地址（实际指向 https://www.example-bank.com/verify）"

[feature.link.lookalike_honest]
brief = "有链接，域名是与品牌相似的假域名，链接文字与目标一致"
hint = "例如品牌是 example-bank.com，域名写成 example-bank-secure.example 这类相似域名"

[feature.link.lookalike_mismatch]
brief = "有链接，域名是假域名，且链接文字伪装成官方地址"
hint = "两个地址都写出来：显示文字写官方域名（实际指向相似假域名，如 http://example-bank-secure.example/verify）"

[feature.link.ip_honest]
brief = "有链接，域名位置直接是一个 IP 地址，链接文字与目标一致"
hint = "例如 http://203.0.113.47/verify ，链接文字写这个地址"

[feature.link.ip_mismatch]
brief = "有链接，目标是一个 IP 地址，但链接文字伪装成官方域名"
hint = "两个地址都写出来：显示文字写官方域名（实际指向 http://203.0.113.47/verify）"

[feature.link.shortener_honest]
brief = "有链接，用的是短链接服务，链接文字与目标一致"
hint = "例如 https://s.example/abc123 ，链接文字写这个短地址"

[feature.link.shortener_mismatch]
brief = "有链接，目标是短链接，但链接文字伪装成官方域名"
hint = "两个地址都写出来：显示文字写官方域名（实际指向 https://s.example/abc123）"

[feature.tone.formal]
brief = "正式、书面"
hint = "用通知 / 公函的措辞"

[feature.tone.friendly]
brief = "友好、热情"
hint = "用寒暄、感谢、祝福的措辞"

[feature.tone.casual]
brief = "随意、口语"
hint = "像同事之间随手发的一条消息"

[feature.tone.curt]
brief = "生硬、公事公办"
hint = "简短、不寒暄、不用敬语，直接说事"

[fam.requested]
q = [
  "这封邮件要收件人做什么？",
  "发件人希望收件人采取什么行动？",
  "这封信对收件人的要求是什么？",
]

[fam.requested.criteria]
none = "什么都不用做，只是通知或陈述（落款里的参考网址不算要求）"
credentials = "提供口令、验证码、证件号这类秘密凭据（不含银行卡号）"
payment = "转账、付款、补缴，或提供 / 变更银行卡号、收款账户信息"
click_link = "正文明确请对方点击邮件里的链接去确认、领取或查看"
attachment = "下载并打开邮件附件"

[fam.pressure]
q = [
  "这封邮件用了什么手法？",
  "发件人靠什么让收件人照做？",
  "这封信的主要施压或诱导手法是什么？",
]

[fam.pressure.criteria]
none = "通篇没有任何施压或诱导：没有时间窗，没有后果，也没有好处，连「有件事但不明说」这种吊胃口都没有"
urgency = "只给时间压力：必须出现**明确的时限**（今天之内、24 小时内、即将失效、限时截止）——光有「尽快 / 请及时回复」这类**催促语**不算这一档"
reward = "用意外好处引诱（中奖、返现、免费额度等）"
fear = "拿后果威胁收件人（账户将被冻结 / 已违规 / 已欠款 / 将采取法律行动等）——只要出现这类后果就选这一档，即使同时给了时间窗；只是提到「发现了异常」不算"
curiosity = "只说有一件与收件人有关的事、通篇不说明是什么；没有时间窗、没有后果、也没有好处。即使正文里带了**催促语**（尽快 / 别耽误），只要没有明确时限、后果或好处，就选这一档"

[fam.link_text]
q = [
  "邮件里链接显示的文字，与它实际指向的目标一致吗？",
  "信中的链接文字是否如实反映了真实目标地址？",
  "链接文字有没有伪装成别的地址？",
]

[fam.link_text.criteria]
matches = "链接那一行只有真实目标这一个地址（只写网址、没有额外显示文字也算），或者链接文字只是机构 / 页面名"
mismatched = "链接那一行写出了显示地址与真实目标**两个不同的地址**（显示的那个伪装成别的域名 / 短链 / IP）"

[fam.sender_identity]
q = [
  "显示名声称的机构，与发件地址的域名对得上吗？",
  "这封信的显示发件人是否名副其实（官方域名与发件地址一致）？",
  "发件人有没有冒充别人？",
]

[fam.sender_identity.criteria]
matches = "显示名声称的机构，其官方域名（落款「官方域名」行）与发件地址的域名一致"
no_claim = "显示名没有声称任何机构身份，就是个普通人名（落款里也没有官方域名行）"
forged = "显示名声称了某个机构，但落款没有官方域名行，或者那一行与发件地址的域名不一致"

[fam.is_phishing]
q = [
  "这封邮件是不是钓鱼邮件？",
  "这封信属于钓鱼攻击吗？",
  "它在索取东西的同时，还带着可疑迹象吗？",
]

[fam.is_phishing.criteria]
"true" = "是钓鱼：**既**在索取（凭据、钱款，或要求点击链接），**又**存在可疑迹象（冒用机构身份、链接目标可疑、用时限或后果施压）——两者缺一不可"
"false" = "不是钓鱼：没有索取，或没有任何可疑迹象"

[fam.is_spam]
q = [
  "这封邮件属于未经请求的推广或诱导邮件吗？",
  "这封信该不该按垃圾邮件处理？",
  "它是群发推广或诱导性质的邮件吗？",
]

[fam.is_spam.criteria]
"true" = "是：未经请求的推广、诱导或陌生人的索取"
"false" = "不是：正常往来或收件人预期的邮件"

[fam.severity]
q = [
  "这封邮件的风险等级是多少？",
  "按风险从低到高，这封信该评几级？",
  "这封信的可疑程度属于哪一级？",
]
levels = [
  "0 级：正常邮件，无可疑之处",
  "1 级：轻度可疑，但还说得通",
  "2 级：明显可疑，需要留意",
  "3 级：高度可疑，风险很高",
  "4 级：风险极高，应立即处置",
]

[fam.action]
q = [
  "应当怎么处置这封邮件？",
  "对这封信应采取什么处置动作？",
  "这封信该怎么处理？",
]

[fam.action.criteria]
deliver = "正常投递，不做额外处理"
review = "降级投递并交人工复核"
quarantine = "隔离到垃圾箱，等用户确认"
block = "直接拦截，不投递"

[verify]
intro = "读下面这封邮件，按特征清单判断。每道题只从给定选项里选一个。"
state_header = "【邮件】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"
extra_question = "除了上面选中的那一项，这封邮件还向收件人提出了下面哪些请求？把**全部**都列出来（可多选，用选项名）；一项都没有就留空表"
