lang = "en"
language_name = "English"

[dims]
sender = "sender identity"
lure = "technique"
ask = "request"
link = "link"
tone = "tone"

[prompt]
intro = "Below is the **feature sheet** for one email. Write it as a natural, believable email."
official_domain_line = "official domain: {domain}"
bullet = "- {dim}: {brief} (how: {hint})"
# The link address is given per sample (paradigm 9.25 / 9.60): the `hint`s describe the shape only,
# and the concrete address is named here, so the model cannot copy one finished address into the
# whole batch. When the sheet says there is no link, this line does not appear at all.
link_address_line = "Link address: always use `/{path}` as the path segment, and if the sheet above says the target is an IP address, use `{ip}`. Copy those two values verbatim; invent everything else (the brand domain, the lookalike domain, the shortener domain), and do not reuse any other address that appears in this sheet."
rules = [
  "Never introduce a feature that is not on the sheet: if the sheet says there is no link, no URL may appear anywhere (signature included) and there must be no \"click here\" wording; write only the one request the sheet names (when the sheet asks for nothing, make no request at all) and never smuggle in a second one",
  "Write 3-8 natural sentences; the signature is its **own field** and every mail needs one (at least a sign-off), and the \"official domain\" line goes in the signature",
  "The link has its **own field**: when the sheet has a link, fill it in; when it does not, leave it as an empty string (and then no URL may appear anywhere)",
  "Write every URL in full, starting with http:// or https:// (the signature line \"official domain\" is the exception - there write the bare domain)",
  "No URL in the body; the body may invite a click (\"click here\", \"sign in at\") only when the sheet's request is explicitly to click a link - when the request is anything else, the body must not even nudge the reader (\"you can check this at\", \"see the details\", \"for more information\"), it just states the matter",
  "Plain text only: no HTML or Markdown markup anywhere (e.g. <br>, <b>, <hr>, **bold**) - use real line breaks to break lines",
  "The pressure / incentive signals in the text must match the technique exactly: \"no pressure and no incentive\" allows no deadline, no consequence and no reward; \"time pressure\" must not describe a consequence; \"consequences\" may also give a deadline",
  "When the sheet says the link text does not match its target, write both addresses in the form \"displayed address (actually points to real address)\"; with a single address the reader cannot tell",
  "A mail that claims an organisation must end with a line \"official domain: <domain>\" giving that organisation's real domain; a personal mail that claims no organisation must not have that line",
  "Address a plain ordinary person; do not use any real company, brand or person",
  "Invent a specific, believable organisation name and domain for every field - never a placeholder such as \"Vendor\", \"Company\", \"Brand\", \"Acme\" or \"Example Bank\"",
  "Do not explain the features and do not write anything like \"this is a phishing email\"",
  "Write everything in {language}; invented English-looking names and domains read most naturally",
]

[feature.sender.known_vendor]
brief = "the sender is a legitimate vendor the recipient knows"
hint = "the display name is a specific organisation name you invent (never the placeholder word \"vendor\"), the sender domain is that organisation's own domain, and the official-domain field repeats the same domain"

[feature.sender.unknown_personal]
brief = "the sender is a stranger writing as an individual"
hint = "display name is an ordinary person's name, the sender address is at a free mail provider, and the signature has no official-domain line"

[feature.sender.forged_brand]
brief = "the sender impersonates a well-known organisation (the display name is theirs, the real domain is not)"
hint = "use a specific invented brand / bank / platform name as the display name (never a placeholder such as \"Brand\"), send from a lookalike domain that does not belong to it, and put the organisation's real domain in the official-domain field"

[feature.lure.none]
brief = "no pressure and no incentive, purely business as usual"
hint = "no deadlines, no threats, no freebies; keep the tone matter-of-fact, and do not write \"we spotted an unusual login / a risk / a violation\" - that only makes the reader anxious; do not tease the unknown either, e.g. \"there is something about you\" or \"someone mentioned you\""

[feature.lure.urgency]
brief = "creates time pressure"
hint = "give a very short window only, e.g. \"within 24 hours\" or \"by the end of today\"; write no \"otherwise ...\" or \"late payments will ...\" consequence clause"

[feature.lure.reward]
brief = "dangles an unexpected benefit"
hint = "e.g. a prize, cashback, free credit, exclusive discount, unclaimed subsidy"

[feature.lure.fear]
brief = "applies fear to pressure the reader"
hint = "describe a consequence, e.g. the account broke the rules, will be frozen, has arrears, is already in a review process; a deadline may also be given"

[feature.lure.curiosity]
brief = "piques curiosity without saying what it is"
hint = "build suspense only: say there is something about the reader (\"someone mentioned you\", \"a record about you\") without telling what it is; write no consequence such as a violation, a freeze or a risk (that is the fear bucket), no concrete benefit such as a prize, cashback or discount (that is the reward bucket), and no deadline (that is the urgency bucket)"

[feature.ask.none]
brief = "asks the recipient for nothing at all"
hint = "state or notify only; make no request; when the sheet has a link it is a reference URL in the signature only - never write \"click here / sign in at / follow this link\", nor any softer nudge such as \"you can check this at / see the details / for more information\""

[feature.ask.credentials]
brief = "asks for account credentials"
hint = "ask for a password, a one-time code or an ID number; do **not** mention a card number (that belongs to the payment / payout bucket), and do not add \"click the link / visit this page\" as a nudge (the link is a reference URL in the signature only)"

[feature.ask.payment]
brief = "asks for a payment or a change of payment details"
hint = "ask the reader to transfer money, settle an amount, give or update a card number, or change payout details; do not add \"click the link / visit this page\" as a nudge (the link is a reference URL in the signature only)"

[feature.ask.click_link]
brief = "asks the reader to click a link"
hint = "explicitly tell them to click a link in the mail to confirm, claim or review something"

[feature.ask.attachment]
brief = "asks the reader to open an attachment"
hint = "tell them to download and open the attached file; no need to describe its contents; do not also ask them to click a link"

[feature.link.none]
brief = "the email contains no link at all"
hint = "no URL anywhere (signature included); leave the link field as an empty string"

[feature.link.official_honest]
brief = "there is a link on the official domain and its text matches the target"
hint = "write the link target as the full URL \"the organisation's official domain + the path segment given below\" (invent a plausible official domain), and make the link text that address or the organisation name"

[feature.link.official_mismatch]
brief = "there is a link on the official domain but its text pretends to be a different address"
hint = "give both addresses: the displayed text is some **other** address (invent that fake domain), and the real target is \"the official domain + the path segment given below\""

[feature.link.lookalike_honest]
brief = "there is a link on a lookalike domain and its text matches the target"
hint = "invent a brand official domain first, then build a similar fake domain on top of it (add a suffix such as `-secure` / `-login`, or swap the top-level domain), point the link target at the fake domain, and make the link text that address"

[feature.link.lookalike_mismatch]
brief = "there is a link on a lookalike domain and its text pretends to be the official address"
hint = "give both addresses: the displayed text is an address on the official domain (invent that domain), and the real target is \"the lookalike domain + the path segment given below\""

[feature.link.ip_honest]
brief = "the link target is a bare IP address and its text matches the target"
hint = "write the link target as \"http:// + the IP given below + the path segment given below\", and make the link text that address"

[feature.link.ip_mismatch]
brief = "the link target is a bare IP address but its text pretends to be the official domain"
hint = "give both addresses: the displayed text is an address on the official domain (invent that domain), and the real target is the IP address given below"

[feature.link.shortener_honest]
brief = "the link uses a shortener service and its text matches the target"
hint = "write the link target in the shape of a shortener (a very short domain + the path segment given below); invent the short domain, and make the link text that short address"

[feature.link.shortener_mismatch]
brief = "the link target is a shortener but its text pretends to be the official domain"
hint = "give both addresses: the displayed text is an address on the official domain (invent that domain), and the real target is \"the short domain + the path segment given below\""

[feature.tone.formal]
brief = "formal and written"
hint = "the register of an official notice or letter"

[feature.tone.friendly]
brief = "warm and friendly"
hint = "small talk, thanks, good wishes"

[feature.tone.casual]
brief = "casual and conversational"
hint = "like a quick note a colleague fires off"

[feature.tone.curt]
brief = "blunt and businesslike"
hint = "short, no pleasantries, no honorifics, straight to the point"

[fam.requested]
q = [
  "What does this email ask the recipient to do?",
  "What action does the sender want the recipient to take?",
  "What is being requested of the recipient?",
]

[fam.requested.criteria]
none = "Nothing - it only informs or states something (a reference URL in the signature does not count)"
credentials = "Hand over a secret credential (password, one-time code, ID number) - a bank card number does not count"
payment = "Transfer money, pay, settle an amount, or give / change a bank card number or payout details"
click_link = "The body explicitly asks the reader to click a link to confirm, claim or review"
attachment = "Download and open the attachment"

[fam.pressure]
q = [
  "Which technique does this email use?",
  "What is the sender leaning on to get compliance?",
  "What is the main pressure or incentive in this message?",
]

[fam.pressure.criteria]
none = "No pressure and no incentive at all: no deadline, no consequence, no reward, and not even the teaser of something unknown"
urgency = "Time pressure only: an explicit deadline (by the end of today, within 24 hours, expiring soon) - a mere hurry-up line (\"please reply as soon as possible\") does not count as this bucket"
reward = "An unexpected benefit (prize, cashback, free credit)"
fear = "The reader is threatened with a consequence (frozen account, violation, arrears, legal action) - pick this one whenever such a consequence appears, even if a deadline is also given; merely mentioning \"we spotted something unusual\" does not count"
curiosity = "Only says there is something about the reader without ever telling what it is; no deadline, no consequence and no benefit. Even if the text also carries a hurry-up line (\"reply as soon as possible\"), pick this one as long as there is no explicit deadline, no consequence and no benefit"

[fam.link_text]
q = [
  "Does the link text match where the link actually points?",
  "Is the link text an honest description of its target?",
  "Does any link text pretend to be a different address?",
]

[fam.link_text.criteria]
matches = "The link line carries only the real target (a bare URL with no extra display text also counts), or the link text is just an organisation / page name"
mismatched = "The link line writes two different addresses - the displayed one and the real target (the displayed one pretending to be another domain / a shortener / an IP)"

[fam.sender_identity]
q = [
  "Does the organisation named in the display name match the sender domain?",
  "Is the sender who the message says it is (official domain vs sender address)?",
  "Is the sender impersonating anyone?",
]

[fam.sender_identity.criteria]
matches = "The organisation named in the display name: its official domain (the signature line) equals the sender address domain"
no_claim = "The display name claims no organisation at all - an ordinary person's name (and no official-domain line in the signature)"
forged = "The display name claims an organisation, but the signature has no official-domain line, or that line differs from the sender address domain"

[fam.is_phishing]
q = [
  "Is this email a phishing attempt?",
  "Does this message belong to a phishing attack?",
  "Does it ask for something while also showing red flags?",
]

[fam.is_phishing.criteria]
"true" = "Yes: it **both** asks for something (credentials, money, or a link click) **and** shows a red flag (impersonated identity, deceptive link target, or deadline/consequence pressure)"
"false" = "No: it asks for nothing, or shows no red flag"

[fam.is_spam]
q = [
  "Is this email unsolicited promotion or bait?",
  "Should this message be treated as spam?",
  "Is it bulk marketing or an unsolicited pitch?",
]

[fam.is_spam.criteria]
"true" = "Yes: unsolicited promotion, bait, or a stranger making demands"
"false" = "No: normal correspondence or mail the recipient expects"

[fam.severity]
q = [
  "Scored as credentials asked +2, payment asked +1, suspicious link +1, link text not matching the real address while that link is suspicious +1 more, impersonated brand +1, pressure tactic +1, capped at 4: what is the risk level of this email?",
  "Add up the score (credentials asked +2, payment asked +1, suspicious link +1, link text not matching the real address while that link is suspicious +1 more, impersonated brand +1, pressure tactic +1, capped at 4): what level should this mail get?",
  "How suspicious is this message? Score: credentials asked +2, payment asked +1, suspicious link +1, link text not matching the real address while that link is suspicious +1 more, impersonated brand +1, pressure tactic +1, capped at 4.",
]
levels = [
  "Level 0: total 0 — none of the scoring items apply",
  "Level 1: total 1",
  "Level 2: total 2",
  "Level 3: total 3",
  "Level 4: total 4 (capped)",
]

[fam.action]
q = [
  "How should this email be handled?",
  "Which action should be taken on this message?",
  "What should be done with this mail?",
]

[fam.action.criteria]
deliver = "Deliver normally: neither phishing nor spam, and severity <= 2"
review = "Deliver with a warning and queue for human review: classified as spam, or severity = 3; if it is also phishing, or severity reaches 4, use the heavier action below"
quarantine = "Quarantine to the junk folder until the user confirms: classified as phishing with severity <= 2, or severity = 4; if it is phishing with severity >= 3, use the block action"
block = "Block outright, do not deliver: classified as phishing with severity >= 3"

[verify]
intro = "Read the email below and answer each question. Pick exactly one option per question."
state_header = "EMAIL:"
questions_header = "QUESTIONS:"
option_line = "   - {name}: {desc}"
extra_question = "Apart from the one you picked above, which of these does the mail ALSO ask the recipient for? List every one that applies (by option name); leave it empty if there is none"
