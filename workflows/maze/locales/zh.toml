lang = "zh"

[dirs]
up = "上"
right = "右"
down = "下"
left = "左"

[moves]
up = "向上"
right = "向右"
down = "向下"
left = "向左"

[legend]
wall = "墙"
passage = "通道"
start = "起点"
exit = "出口"
current = "当前位置"
trail = "走过的路"
marks = "标记格"

[history]
prefix = "已走过的最近决策（从起点 S 出发，按顺序）："
sep = " → "
empty = "（还没走过）"

[cell]
wall = "墙壁（走不通）"
passage = "普通通道"
start = "起点 S"
exit = "出口 E"
mark = "标记格 {letter}"
trail = "走过的路"
outside = "迷宫外"

[fam.next_step]
q = [
  "从当前位置出发，下一步朝哪个方向走能最快到达出口 E？",
  "当前位置已标记为 @，要最快走到出口 E，下一步该往哪走？",
  "从 @ 出发，最快到 E 的第一步是哪个方向？",
]

[fam.off_by_one]
q = [
  "当前位置偏离了从 S 到 E 的最优路径 1 格，下一步朝哪个方向走能回到最优路径？",
  "当前 @ 位置不在最优路径上，且只差 1 格；往哪个方向走一步能回到最优路径？",
  "要回到 S→E 的最优路径，从 @ 出发的第一步该往哪走？（当前偏离 1 格）",
]

[fam.on_optimal]
q = [
  "当前位置 @ 在从起点 S 到出口 E 的最短路径上吗？",
  "当前所在格子是否属于 S 到 E 的最优路径？",
  "从 S 到 E 的最短路径会经过当前位置 @ 吗？",
]

[fam.deviation]
q = [
  "当前位置偏离从 S 到 E 的最优路径几步？",
  "当前 @ 位置距离 S→E 最优路径有多少步？",
  "当前格子离最优路径有多远？",
]
levels = ["就在最优路径上", "偏离 1 步", "偏离 2 步", "偏离 3 步或更多"]

[fam.step_result]
q = [
  "从标记格 {letter} {dir}走一步会到哪里？",
  "从 {letter} 出发{dir}走一格，落在什么地方？",
  "标记格 {letter} 的{dir}方向，走一步后是什么？",
]
options = ["被墙挡住", "普通通道", "起点 S", "出口 E", "迷宫外"]

[fam.can_move]
q = [
  "从标记格 {letter} 能直接{dir}走一步吗？",
  "标记格 {letter} 的{dir}方向有通路吗？",
  "{letter} 处能不能{dir}走？",
]

[fam.dead_end]
q = [
  "标记格 {letter} 是死胡同吗（只有一个方向能走）？",
  "在 {letter} 处，可走的方向只剩一个吗？",
  "{letter} 是不是死胡同？",
]

[fam.exits]
q = [
  "标记格 {letter} 周围有几个方向能走？",
  "{letter} 处可走的方向有几个？",
  "从 {letter} 出发能走几个方向？",
]
levels = ["死胡同（只有 1 个方向能走）", "拐角（2 个方向能走）", "丁字或十字路口（3~4 个方向能走）"]

[fam.path_via]
q = [
  "从 S 到 E 的最短路径经过哪个标记格？",
  "S→E 的最优路径会穿过下面哪个标记？",
  "下面哪个标记格落在 S 到 E 的最短路径上？",
]
none = "都不经过"

[fam.on_path]
q = [
  "标记格 {letter} 在从 S 到 E 的最短路径上吗？",
  "S→E 的最优路径会经过 {letter} 吗？",
  "{letter} 是否属于 S 到 E 的最短路径？",
]

[fam.reachable]
q = [
  "从起点 S 能走到出口 E 吗？",
  "这个迷宫里 S 和 E 是连通的吗？",
  "从 S 出发能否到达 E？",
]

[fam.path_length]
q = [
  "从 S 到 E 最少要走几步？",
  "S 到 E 的最短路径有多长（步数）？",
  "从起点 S 走到出口 E 最少需要多少步？",
]
levels = ["1~3 步", "4~7 步", "8 步以上"]
