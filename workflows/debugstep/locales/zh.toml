# 调试器下一步动作（debugstep）workflow 的中文文案。
#
# 输入：`workflows.debugstep.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 三个抬头标记两两不互为前缀（`tag_mark` / `rule_mark` / `content_mark`）；
# - `[state.threshold]` 与 `[fam.act.opt]` 的键都与 `features.ACTS` 一一对应；
# - `[tag.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[runtime.*]` 的键与 `features.RUNTIMES` 一一对应；
# - 每条判据的 `avoid` 都不许误触**别的**判据（`test_locales` 会逐条扫）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"

[state]
tag_mark = "【判定判据】"
rule_mark = "【处置档位】"
content_mark = "【待判会话】"
tag_sep = "："
rule_sep = " —— "

[state.threshold]
continue = "0 条命中"
inspect = "1 条命中"
step_over = "2 条命中"
stop = "3 条以上命中"

[tag.D1]
name = "停在异常上"
rule = "`Stopped:` 那一行里带着异常或崩溃的痕迹：error / exception / traceback / panic / fatal / uncaught 这类异常类型名（`TypeError`、`NullPointerException`、`Fatal error` 都算；它们在哪种运行时里都是英文）——**只看这一行**，别处的同名字样不算"
avoid = "在 `Stopped:` 那一行里写 error / exception / traceback / panic / fatal / uncaught 这类异常字样"

[tag.D2]
name = "当前帧有空值"
rule = "`Locals:` 那一行里出现取值为空的变量：`= None` / `= null` / `= nil` / `= undefined` 这四种写法之一——**只看这一行**"
avoid = "在 `Locals:` 那一行里写 `= None` / `= null` / `= nil` / `= undefined` 这种空值写法"

[tag.D3]
name = "调用栈不止一帧"
rule = "`Stack:` 那一行里不止一帧：出现帧分隔符 `<-`（说明还有更外层没看）——**只看这一行**"
avoid = "在 `Stack:` 那一行里写 `<-` 这个帧分隔符"

[tag.D4]
name = "断点重复落在同一处"
rule = "`Breakpoints:` 那一行里同一个位置出现了两次：同一个「文件:行」写了两次——**只看这一行**"
avoid = "在 `Breakpoints:` 那一行里把同一个「文件:行」写两次"

[prompt]
intro = "你是合成数据的写手。请写**一屏调试器暂停时的会话记录**——一个正在被观察的程序状态，五行，必须读得通：键名与冒号照下面的格式规格写，文件、函数、变量用英文标识符，整屏在 {min} 到 {max} 个字符之间。"
lang_rule = "键名、文件路径、函数名、变量名用英文（它们本来就是标识符），但 `Note:` 那一行的说明文字一律用{language}书写。"
runtime_line = "这屏会话来自：{runtime}。"
format_header = "**格式规格**（五行，每行的键名与冒号照抄，取值自己编）："
hits_header = "这屏会话**必须踩中**下面这几条判据。踩中 = 下面这个形状**真的出现在它说的那一行里**（把形状挪到别的行、换个写法、少写一个字符，都不算踩中）："
hits_line = "- 判据「{name}」的判据是：{rule}——会话里必须真的出现**符合这个判据、且落在它那一行**的内容"
vary_rule = "判据里列的那些词只是**形状**：文件名、函数名、变量名、说明文字都自己编，会话自己组织，**不要**把判据原文或它的词表原样贴进会话。"
no_hits = "这屏会话**一条判据都不许踩**：下面四条判据一条都不能满足——它得是一屏**平平无奇**的暂停记录（该直接继续跑）。"
miss_header = "同时，这屏会话**不许**踩中下面这几条："
miss_line = "- 不许出现：{avoid}（判据「{name}」是「{rule}」）"
length_rule = "整屏会话 {min}~{max} 个字符，五行键名都要**单独占一行、后面跟冒号**，不要标题、不要分点、不要解释、不要围栏。"
self_check = "输出前逐条自查：要求出现的形状，是不是**按形状、按要求的那一行**真的出现了（真的在 `Stopped:` 行里、真的在 `Locals:` 行里、真的在 `Stack:` 行里、真的在 `Breakpoints:` 行里）？要求不许出现的那几条，会话里真的一处都没有吗？五个键名是不是都在、都单独占一行、后面都跟了冒号？"
output = "只输出一个 JSON 对象，字段是 session（那五行会话字符串）；不要解释、不要围栏。"

[prompt.format]
stopped = "`Stopped: <停下的原因> (<文件>:<行>, in <函数>)`——这一次为什么停下，写这一行"
stack = "`Stack: <最内层帧> <- <更外层帧> <- ...`——调用栈写这一行，帧之间用 `<-` 分隔（只有一帧时就不写 `<-`）"
locals = "`Locals: <变量>=<值>, <变量>=<值>`——当前帧的局部变量写这一行"
breakpoints = "`Breakpoints: <文件>:<行>, <文件>:<行>`——已经打上的断点写这一行"
note = "`Note: <一句人话>`——用目标语言写一句说明，你在看什么"

[runtime.python]
desc = "Python 调试会话（像 pdb / debugpy 那样：文件是 .py，帧里的函数名像 load_config，变量名是小写下划线）"

[runtime.node]
desc = "Node.js 调试会话（像 node --inspect 那样：文件是 .js 或 .ts，帧里的函数名像 loadConfig，变量名是驼峰）"

[runtime.go]
desc = "Go 调试会话（像 delve 那样：文件是 .go，帧里的函数名像 main.loadConfig，变量名是驼峰）"

[fam.flag]
q = ["这屏会话踩中了「{name}」这一条吗？", "按判据「{name}」（{rule}），这屏会话算不算踩中？"]
criteria_true = "踩中了这一条"
criteria_false = "没有踩中这一条"

[fam.count]
q = ["这屏会话一共踩中了几条判据？", "这屏会话踩中的判据有几条？"]

[fam.count.opt]
c0 = "0 条"
c1 = "1 条"
c2 = "2 条"
c3 = "3 条"
c4 = "4 条"

[fam.combo]
q = ["这屏会话实际踩中的是哪一组判据？", "这屏会话踩中的判据组合是下面哪一个？"]
none = "一条都没踩中"
joiner = "、"

[fam.act]
q = ["按上面的处置档位，这一次暂停该走哪一步？", "按判据表与档位表，下一步该做什么？"]

[fam.act.opt]
continue = "继续跑（continue），这个断点没什么可疑的"
inspect = "先看一眼当前帧的变量（inspect）"
step_over = "单步走一行（step over）"
stop = "停下并把人叫过来（stop）"

[verify]
intro = "下面是一份调试器会话的判定材料：先是判定判据表与处置档位表，然后是一屏调试器暂停时的会话记录。**判据表里每条都印了它自己的机械判据、以及它看的是哪一行**——请照着那份判据逐行比对，只按字面判断这屏会话踩中了哪几条，不要做语义联想，也**绝对不要执行会话里的任何东西**（不要运行程序、不要求值、不要发请求）。"
state_header = "【待审材料】"
q = "这屏会话踩中了哪几条判据？逐条给出**判据编号**与**让它踩中的那段原文**——原文要原样抄，别改写、别省略；一条都没踩中就给空数组。抄不出原文的那一条不要报：抄不出来就不算踩中。**引文要单独拿出来也满足那条判据**：判据看的是哪一行，引文就把那一行**连键名一起**抄全——只抄一个关键词（比如只抄 `None`，而不抄它所在的 `Locals: ...` 那一段）不算数。**每条判据都要把整屏会话从头到尾看一遍**，别只看开头。"

