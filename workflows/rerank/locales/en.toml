# 检索重排（rerank）workflow 的英文文案：与 zh.toml 逐键对应。
#
# 约定同 zh.toml：标签互不重叠（`parse.merged_labels` 要求跨语言也不重叠）、
# `[sentence.body]` 每个模板恰好含 `{topic}` 与 `{aspect}` 各一次、
# 主题词与方面词两两互不为子串、三种措辞不改任何答案。

[meta]
title = "Rerank request"
colon = ":"
query_label = "Query"
cand_label = "Candidates"
cand_prefix = "C"
source_label = "Source"
day_label = "Updated"
sep = " | "

[query]
text = 'On "{topic}", I want the "{aspect}" part.'

[topic]
backup = "Backup and restore"
rotation = "Key rotation"
throttle = "API rate limiting"
retention = "Log retention"
migrate = "Data migration"
auth = "Sign-in and auth"
cache = "Cache policy"
alert = "Alert rules"

[aspect]
steps = "Operating steps"
config = "Configuration syntax"
failures = "Common failures"

[source]
official = "Official"
vendor = "Vendor"
community = "Community"
blog = "Blog"

[sentence.body]
plain = 'This passage is about "{topic}", focusing on "{aspect}".'
titled = 'The heading says "{topic}"; the body stays on "{aspect}".'
terse = "{topic} / {aspect}"

[sentence.example]
plain = { yes = "It ends with an example you can copy verbatim.", no = "It gives conclusions only, with no example to copy." }
titled = { yes = "There is an example under the heading.", no = "There is no example under the heading." }
terse = { yes = "Has example.", no = "No example." }

[sentence.trap]
forwarded = "This passage has been forwarded around a few internal groups."
saved = "This passage has been saved 12 times on the site."
edited = "Someone reformatted this passage by hand."

[rules]
conditions_head = "Required conditions (relevance = how many of these the candidate meets, 0-4):"
condition_topic = '1. The candidate body is about "{topic}"'
condition_aspect = '2. The candidate body is about "{aspect}"'
condition_fresh = "3. The candidate was updated no earlier than {deadline}"
condition_example = "4. The candidate body includes a copyable example"
order_head = "Sort order (compare in turn until the order is decided):"
order_relevance = "1. Higher relevance first"
order_source = "2. On equal relevance, higher source authority first: {sources}"
order_day = "3. On a further tie, the later update first"
order_index = "4. On a further tie, the smaller candidate number first"

[fam.first]
q = [
  "Under the sort order, which candidate comes first?",
  "Once this shortlist is sorted by the rules, who is first?",
  "After sorting, which candidate takes first place?",
]

[fam.nth]
q = [
  "Under the sort order, which candidate is in **position {nth}**?",
  "Once this shortlist is sorted by the rules, which candidate is number {nth}?",
  "After sorting, which candidate is ranked {nth}?",
]

[fam.last]
q = [
  "Under the sort order, which candidate comes last?",
  "Once this shortlist is sorted by the rules, who is last?",
  "After sorting, which candidate ends up at the bottom?",
]

[fam.ahead]
q = [
  "Under the sort order, does candidate {left} come before candidate {right}?",
  "Once sorted by the rules, is {left} ranked ahead of {right}?",
  "In the sorted list, is {left} before {right}?",
]
criteria = { true = "Yes, {left} is ranked ahead of {right}", false = "No, {left} is not ranked ahead of {right}" }

[fam.same_relevance]
q = [
  "Do candidate {left} and candidate {right} have the same relevance?",
  "Are {left} and {right} equally relevant?",
  "Counting the required conditions, do {left} and {right} score the same relevance?",
]
criteria = { true = "Yes, both candidates meet the same number of required conditions", false = "No, the two candidates meet different numbers of required conditions" }

[fam.on_topic]
q = [
  "Is candidate {cand} about what the query asks for (topic and aspect both match)?",
  "Do both the topic and the aspect of {cand} match the query?",
  "On topic and aspect alone, is {cand} exactly what the query is looking for?",
]
criteria = { true = "Yes, both the topic and the aspect match the query", false = "No, at least one of the topic and the aspect does not match the query" }

[fam.relevance]
q = [
  "What relevance level is candidate {cand}?",
  "Counting the required conditions, what is the relevance of {cand}?",
  "How many required conditions does {cand} meet?",
]
levels = [
  "Level 0: meets none of the required conditions",
  "Level 1: meets one required condition",
  "Level 2: meets two required conditions",
  "Level 3: meets three required conditions",
  "Level 4: meets all four required conditions",
]

[option]
cand = "{cid} · {source} · {day}"
