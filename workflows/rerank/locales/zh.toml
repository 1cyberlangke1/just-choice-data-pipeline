# 检索重排（rerank）workflow 的中文文案：标签、主题词、方面词、正文模板、题面与选项。
#
# 约定（`tests/workflows/rerank/test_locales.py` 逐条锁住）：
# - `[meta]` 那几个标签是反解的锚点，标签之间不能有前缀关系，也不能和抬头撞车；
# - `[sentence.body]` 的模板必须**恰好**含 `{topic}` 与 `{aspect}` 各一次——反解是
#   从模板生成正则来抓这两个词的（见 `parse.py`），少一个占位符就抓不回来；
# - 主题词与方面词两两互不为子串，否则「这条讲的正是查询的主题吗」会被读错；
# - 三种措辞（`plain` / `titled` / `terse`）说的是同一件事，**不改任何答案**；
# - 判据（四条必要条件、排序四条规则）原文由 `[rules]` 提供，`questions.py` 拼进题面。

[meta]
title = "重排请求"
colon = "："
query_label = "查询"
cand_label = "候选"
cand_prefix = "C"
source_label = "来源"
day_label = "更新"
sep = " | "

[query]
text = "关于「{topic}」，我想看「{aspect}」这部分。"

[topic]
backup = "备份与恢复"
rotation = "密钥轮换"
throttle = "接口限流"
retention = "日志留存"
migrate = "数据迁移"
auth = "登录鉴权"
cache = "缓存策略"
alert = "告警规则"

[aspect]
steps = "操作步骤"
config = "配置写法"
failures = "常见故障"

[source]
official = "官方"
vendor = "厂商"
community = "社区"
blog = "博客"

[sentence.body]
plain = "这段讲的是「{topic}」，重点是「{aspect}」。"
titled = "标题写的是「{topic}」，正文集中在「{aspect}」。"
terse = "{topic} / {aspect}"

[sentence.example]
plain = { yes = "末尾附了一段可以直接抄走的示例。", no = "只写了结论，没有可照抄的示例。" }
titled = { yes = "标题下面附了示例。", no = "标题下面没有示例。" }
terse = { yes = "有示例。", no = "无示例。" }

[sentence.trap]
forwarded = "这段在内部群里被转发过几次。"
saved = "这段在站内被收藏了 12 次。"
edited = "这段的排版被人手动调过一次。"

[rules]
conditions_head = "必要条件（相关度 = 满足下面几条的条数，0~4）："
condition_topic = "① 候选正文讲的正是「{topic}」"
condition_aspect = "② 候选正文讲的正是「{aspect}」"
condition_fresh = "③ 候选的更新日期不早于 {deadline}"
condition_example = "④ 候选正文附了可照抄的示例"
order_head = "排序规则（依次比较，直到分出先后）："
order_relevance = "① 相关度高的在前"
order_source = "② 相关度相同时，来源权威度高的在前：{sources}"
order_day = "③ 再相同时，更新日期晚的在前"
order_index = "④ 再相同时，编号小的在前"

[fam.first]
q = [
  "按排序规则，排在第一位的候选是哪一个？",
  "这份短名单按规则排好之后，谁在第一？",
  "排序之后第一名是哪一条候选？",
]

[fam.nth]
q = [
  "按排序规则，排在**第 {nth} 位**的候选是哪一个？",
  "这份短名单按规则排好之后，第 {nth} 位是哪一条候选？",
  "排序之后第 {nth} 名是哪一条候选？",
]

[fam.last]
q = [
  "按排序规则，排在最后一位的候选是哪一个？",
  "这份短名单按规则排好之后，谁在最后？",
  "排序之后垫底的是哪一条候选？",
]

[fam.ahead]
q = [
  "按排序规则，候选 {left} 是否排在候选 {right} 前面？",
  "按规则排序之后，{left} 的名次比 {right} 靠前吗？",
  "在排好的名单里，{left} 是不是在 {right} 之前？",
]
criteria = { true = "是，{left} 的名次比 {right} 靠前", false = "否，{left} 的名次不比 {right} 靠前" }

[fam.same_relevance]
q = [
  "候选 {left} 与候选 {right} 的相关度是否相同？",
  "{left} 和 {right} 的相关度一样吗？",
  "按四条必要条件数下来，{left} 与 {right} 的相关度是不是同一个数？",
]
criteria = { true = "是，两条候选满足的必要条件条数相同", false = "否，两条候选满足的必要条件条数不同" }

[fam.on_topic]
q = [
  "候选 {cand} 讲的是不是查询要的那件事（主题与方面都对）？",
  "{cand} 的主题和方面是否都与查询一致？",
  "就主题与方面而言，{cand} 是否正好在讲查询要的东西？",
]
criteria = { true = "是，主题与方面都与查询一致", false = "否，主题或方面至少有一项与查询不一致" }

[fam.relevance]
q = [
  "候选 {cand} 的相关度是几档？",
  "按四条必要条件数下来，{cand} 的相关度是多少？",
  "{cand} 满足了几条必要条件？",
]
levels = [
  "0 档：一条必要条件都没满足",
  "1 档：只满足一条必要条件",
  "2 档：满足两条必要条件",
  "3 档：满足三条必要条件",
  "4 档：四条必要条件全部满足",
]

[option]
cand = "{cid} · {source} · {day}"
