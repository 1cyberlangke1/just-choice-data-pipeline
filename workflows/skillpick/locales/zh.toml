# 技能选择 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的字段名与四张词表**跨语言互不
# 重叠**（`reparse` 用的合并表按原文反查键）、抬头三格的分隔符（cell_sep）**必须一致**、
# 判据原文里必须印出全部 12 个标签、3 个范围、2 个授权、3 类资源（漏印一项那一档就不可解）。

[meta]
title = "技能选择单"
request_label = "请求号"
tag_label = "标签"
grant_label = "授权"
inuse_label = "已占用"
colon = "："
cell_sep = " · "

[tag]
# 前六个是技能表里的适用场景，后六个是**近似但不等**的干扰标签。
read_code = "读代码"
edit_code = "改代码"
fetch_web = "抓网页"
ship_release = "发版本"
tidy_sheet = "理表格"
check_data = "查数据"
read_code_notes = "读代码笔记"
edit_code_style = "改代码风格"
fetch_web_shot = "抓网页截图"
ship_release_note = "发版本通知"
tidy_sheet_tpl = "理表格模板"
check_data_src = "查数据来源"

[scope]
read = "只读"
write = "可写"
admin = "管理"

[resource]
code = "代码"
net = "网络"
data = "数据"

[grant]
read = "只读授权"
write = "可写授权"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、技能表里的六行适用场景分别是读代码、改代码、抓网页、发版本、理表格、查数据；请求标签与某一行的适用场景**完全一致**才算匹配，差一个字都不算——请求标签里还会出现读代码笔记、改代码风格、抓网页截图、发版本通知、理表格模板、查数据来源这类很像但不同的写法，它们一个技能都不匹配。二、权限范围有三档：只读、可写、管理；授权有两档：只读授权、可写授权。范围不高于授权才给用——只读技能在两种授权下都能用，可写技能只有可写授权能用，管理级技能要单独审批、两种授权都不够。三、资源有三类：代码、网络、数据；两个技能要碰同一类资源就是冲突。"

[fam.fits]
q = [
  "技能表里有能处理这条请求的技能吗？",
  "按判据，这条请求有没有对得上的技能？",
  "表里有没有一个技能正好管这件事？",
]

[fam.fits.criteria]
true = "有：表里某一行的适用场景与请求标签完全一致"
false = "没有：表里没有哪一行的适用场景与请求标签完全一致（差一个字也不算）"

[fam.pick]
q = [
  "该用第几个技能？",
  "这条请求应该交给表里的第几个技能？",
  "按判据，该选第几个？",
]

[fam.scope]
q = [
  "第 {n} 个技能的权限范围是哪一档？",
  "按权限范围表，第 {n} 个技能属于哪一档？",
  "第 {n} 个技能要什么权限？",
]

[fam.allow]
q = [
  "按这份授权，能用第 {n} 个技能吗？",
  "这份授权够不够用第 {n} 个技能？",
  "第 {n} 个技能在当前的授权下给不给用？",
]

[fam.allow.criteria]
true = "能用：那个技能的权限范围不高于这份授权"
false = "不能用：那个技能的权限范围高于这份授权（管理级技能在两种授权下都不够）"

[fam.conflict]
q = [
  "第 {n} 个技能与已占用的技能会撞吗？",
  "第 {n} 个技能和已占用的技能碰同一类资源吗？",
  "第 {n} 个技能与已占用的那个会抢资源吗？",
]

[fam.conflict.criteria]
true = "会撞：两个技能要碰同一类资源"
false = "不撞：两个技能碰的是不同的资源"

[option.scope]
read = "只读：这个技能只看不改"
write = "可写：这个技能会改动内容"
admin = "管理：这个技能能发布或删除"

[option.slot]
element = "第 {n} 个：{tag} · {scope} · {resource}"
