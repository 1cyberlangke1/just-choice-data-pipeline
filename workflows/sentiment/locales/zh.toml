# 情感与情绪（sentiment）workflow 的中文文案。
#
# 输入：`workflows.sentiment.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 格分隔符 / 词分隔符 / 规则行前缀三种**结构词元中英必须完全一致**——反解只有一份合并表；
# - 抬头 / 场景抬头 / 区块抬头两两不互为前缀，且不与英文撞车（反解靠最长前缀认标签）；
# - `[topic]` 的键与 `features.TOPICS` 一一对应，五个场景名与十个称呼互不相同；
# - `[word]` 恰好五档（-2 ~ +2），每档 `features.WORD_SLOTS` 个词，二十个词互不相同，
#   且不许跨档重复（合并后会串档）；
# - 四个题族的问法模板互不相同（`locales.pick` 会静默取第一个命中）；
# - `[fam.tone].criteria` 只有 pos / neg / flat，`[fam.pivot].criteria` 只有 t2~t5 + none，
#   `[fam.drop].levels` 五档（**下标就是答案** 0~4），`[fam.rebound].criteria` 只有 true / false。

lang = "zh"
language_name = "简体中文"

[meta]
request = "情绪弧线请求号"
topic = "场景"
words = "情绪词表"
turns = "对话"
rules = "判读规则"
cell_sep = "|"
word_sep = "/"
rules_prefix = "- "

[topic.support]
title = "客服对话"
role_a = "客户"
role_b = "客服"

[topic.standup]
title = "团队站会"
role_a = "主持人"
role_b = "成员"

[topic.review]
title = "产品评审会"
role_a = "讲解人"
role_b = "评审人"

[topic.interview]
title = "求职面试"
role_a = "面试官"
role_b = "求职者"

[topic.neighbors]
title = "邻里沟通"
role_a = "邻居甲"
role_b = "邻居乙"

[word]
"2" = ["特别满意", "非常开心", "赞不绝口", "拍手叫好"]
"1" = ["还不错", "有点高兴", "可以接受", "挺顺的"]
"0" = ["没什么感觉", "一般般", "说不上好", "没什么波动"]
"-1" = ["有点烦", "不太满意", "有点失望", "心里别扭"]
"-2" = ["非常生气", "彻底失望", "火冒三丈", "心灰意冷"]

[rules]
lines = [
  "规则一：每个回合的情绪分值由上面的词表给出——+2 最好、-2 最差，0 是不喜不悲。",
  "规则二：整段对话的倾向看各回合分值之和：大于 0 记「偏正」、小于 0 记「偏负」、等于 0 记「中性」。",
  "规则三：第 i 个回合（i 从 2 起）算一次「转折」，当且仅当它与上一回合一个为正、一个为负；0 与任何符号都不构成转折。",
  "规则四：相邻两回合的「最大落差」= 各相邻对里「上一回合分值减下一回合分值」的最大值；一路不变差就是 0。",
  "规则五：第 i 个回合（i 从 2 起）算一次「回升」，当且仅当上一回合分值为负、这一回合分值为正。",
]

[fam.tone]
q = [
  "整段对话的情绪倾向是什么？",
  "把所有回合的分值加起来，这段对话整体偏哪一边？",
  "这段对话整体上是偏正、偏负还是中性？",
]
criteria = { pos = "偏正", neg = "偏负", flat = "中性" }

[fam.pivot]
q = [
  "第一个转折出现在第几个回合？",
  "这段对话里第一次变调是在第几个回合？",
  "按规则三，最早的转折落在第几回合？",
]
criteria = { t2 = "第 2 回合", t3 = "第 3 回合", t4 = "第 4 回合", t5 = "第 5 回合", none = "一次转折都没有" }

[fam.drop]
q = [
  "相邻两个回合之间的最大落差是多少？",
  "这段对话里情绪掉得最狠的一次掉了多少？",
  "按规则四，相邻两回合的最大落差是几？",
]
levels = [
  "最大落差是 0（一路没有变差）",
  "最大落差是 1",
  "最大落差是 2",
  "最大落差是 3",
  "最大落差是 4",
]

[fam.rebound]
q = [
  "这段对话里有没有出现「上一回合为负、这一回合为正」的回升？",
  "按规则五，这段对话里存在回升吗？",
  "有没有哪个回合从负面直接翻成正面？",
]
criteria = { true = "有回升", false = "没有回升" }
