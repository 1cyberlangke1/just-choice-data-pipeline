# 文档包切分（segmentation）workflow 的中文文案。
#
# 输入：`workflows.segmentation.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 三个抬头标记两两不互为前缀（`table_mark` / `rule_mark` / `order_mark`），
#   而且页序抬头（`page_prefix` + 数字 + `page_suffix`）与它们都不同形；
# - `[fam.count.opt]` 的键与 `features.MAX_PACKET_CLASSES` 一一对应、
#   `[fam.route.opt]` 的键与 `features.ROUTE_LEVELS` 一一对应；
# - `[class.*]` 的键与 `features.CLASS_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[source.*]` 的键与 `features.SOURCES` 一一对应，每条都有 desc / trace；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"

[state]
table_mark = "【文档种类】"
rule_mark = "【切分规则】"
order_mark = "【页序】"
class_sep = "："
rule_sep = " —— "
page_prefix = "【第 "
page_suffix = " 页】"
# 单页正文的长度上下限。按语言校准：同样一页纸，英文的字符数天然比中文多。
page_min = 60
page_max = 260

[state.rules]
cross = "相邻两页的种类不同：一定属于两份不同的文档"
merge = "相邻两页同属「{names}」：并成同一份文档"
each = "相邻两页同属「{names}」：一页一份文档"
joiner = " / "

[class.form]
name = "表单"
rule = "页面里出现「表单编号 / 申请表 / 申请单 / 填报人」这类抬头"
avoid = "「表单编号 / 申请表 / 申请单 / 填报人」这类抬头"

[class.letter]
name = "信函"
rule = "页面里出现「尊敬的 / 此致 / 敬礼 / 顺颂」这类抬头"
avoid = "「尊敬的 / 此致 / 敬礼 / 顺颂」这类抬头"

[class.receipt]
name = "收据"
rule = "页面里出现「收据编号 / 收款人 / 已收款 / 收讫」这类抬头"
avoid = "「收据编号 / 收款人 / 已收款 / 收讫」这类抬头"

[class.contract]
name = "合同"
rule = "页面里出现「合同编号 / 甲方 / 乙方 / 签约日期」这类抬头"
avoid = "「合同编号 / 甲方 / 乙方 / 签约日期」这类抬头"

[source.scan]
desc = "扫描仪扫出来的一叠纸"
trace = "每一页正文的第一行都要有扫描仪的痕迹（比如「扫描页码：第 1 页 / 共 3 页」这种页码戳）"

[source.fax]
desc = "传真机收下来的一叠纸"
trace = "每一页正文的第一行都要有传真机的痕迹（比如「传真抬头：FAX 021-0000 2026-09-30 09:12」）"

[source.photo]
desc = "手机翻拍下来的一叠纸"
trace = "每一页正文的第一行都要有手机拍照的痕迹（比如「拍摄时间：IMG_20260930_091233.jpg」）"

[prompt]
intro = "你是合成数据的写手。请写**一包材料**的正文——一共 {pages} 页，每一页都要是一页读得通的材料（像真的申请表 / 信函 / 收据 / 合同那样），单页长度在 {min} 到 {max} 个字符之间。"
lang_rule = "整包一律用{language}书写，不要写成英文或别的语言（判据里那几个英文标记除外）。"
source_line = "这一包是从{source}来的：{trace}。"
assign_header = "逐页要求（**每一页属于哪一类是定死的，不许改**）："
assign_line = "- 第 {index} 页：属于「{name}」——正文里必须出现**这个判据里列出的某个说法**（原话照用）：{rule}"
forbid_header = "每一页都**不许**出现下面这几类的抬头（出现了这一页就会被算成别的类）："
forbid_line = "- 不许出现：{avoid}（那是「{name}」的抬头）"
vary_rule = "判据里列的那些词只是**形状**：抬头、编号、金额、地址、姓名、日期都自己编，句子自己组织，**不要**把判据原文或它的词表原样贴进正文（该有的抬头保持住就行）。"
length_rule = "每一页都要 {min}~{max} 个字符（含标点），一共 {pages} 页；不要标题、不要围栏、不要自己加页码行。"
self_check = "输出前逐条自查：每一页是不是真的带了它那一类的抬头？每一页是不是都没有带别的类的抬头？每一页是不是都带了来源痕迹？"
output = "只输出一个 JSON 对象，字段是 pages（字符串数组，长度恰好 {pages}，按页序）；不要解释、不要围栏。"

[fam.flag]
q = ["这一包里有没有出现「{name}」这一类的页？", "按判据（{rule}），这一包里有属于「{name}」的页吗？"]
criteria_true = "有这一类的页"
criteria_false = "没有这一类的页"

[fam.count]
q = ["这一包一共出现了几种文档？", "这一包里的文档种类一共有几种？"]

[fam.count.opt]
n1 = "1 种"
n2 = "2 种"
n3 = "3 种"

[fam.combo]
q = ["这一包实际出现的是哪几种文档？", "这一包里实际出现的种类是下面哪一个组合？"]
joiner = "、"

[fam.route]
q = ["按上面的切分规则，这一包该切成几份文档？", "这一包该给什么切分结论？"]

[fam.route.opt]
one = "1 份"
two = "2 份"
many = "3 份及以上"

[verify]
intro = "下面是一包待切的材料：先是文档种类表与切分规则，然后是按页序排好的每一页正文。**种类表里每一类都印了它自己的机械判据**——请照着那份判据逐页比对，只按字面判断这一包里出现了哪几类（判据是机械的抬头形状），不要做语义联想。"
state_header = "【待审材料】"
q = "这一包里出现了哪几类文档？逐类给出**种类编号**与**让它出现的那段原文**——原文要原样抄，别改写、别省略；一类都没出现就给空数组。抄不出原文的那一类不要报：抄不出来就不算出现。"
