# 缓存复用判定（cachereuse）的中文文案。
# 每个动作 / 元素键至少两种写法：下标 0 是规范写法，下标 1 是同义写法（两条轨迹「写法不同但
# 归一化后相同」时用）。写法表必须让**不同键之间不撞词**、且同一键的两种写法互不相同
# （由 tests/workflows/cachereuse/test_locales.py 锁住）。

[meta]
request = "缓存复用请求"
source = "缓存来源"
cached = "缓存轨迹"
current = "当前轨迹"
sep = "："
quote_open = "「"
quote_close = "」"

[flavor]
web = "网页版"
desktop = "桌面版"
kiosk = "自助终端"

[action]
open = ["打开", "开启"]
click = ["点击", "点一下"]
type = ["输入", "键入"]
choose = ["选择", "选中"]
scroll = ["滚动", "翻动"]
confirm = ["确认", "提交"]

[target]
search_box = ["搜索框", "搜索输入框"]
result_list = ["结果列表", "搜索结果列表"]
filter_menu = ["筛选菜单", "筛选面板"]
sort_menu = ["排序菜单", "排序面板"]
cart_button = ["购物车按钮", "购物车键"]
address_field = ["地址栏", "收货地址栏"]
pay_button = ["支付按钮", "付款按钮"]
help_link = ["帮助链接", "帮助入口"]

[rules]
lines = [
  "判据（两条轨迹逐步比，步号一一对应；比之前先把写法归一化）：",
  "一、每一步由「动作 + 元素」两个键组成；同义写法算同一个键（例如「点击」与「点一下」是同一个动作）。",
  "二、归一化后动作与元素**都相同** → 这一步等价；否则这一步不同。",
  "三、缓存能复用的步数 = 从第 1 步起**连续等价**的步数；一旦某一步不同，它和它后面的步一律不能复用（操作序列不能跳步执行），哪怕后面又对上了。",
  "四、可复用档位按「从第 1 步起连续等价的步数」划分：",
  "  · 只差最后一步：连续等价的步数 = 总步数 − 1；",
  "  · 约一半：连续等价的步数 = 总步数的一半（向上取整）；",
  "  · 只前一步：连续等价的步数 = 1；",
  "  · 一步都不能用：连续等价的步数 = 0。",
  "五、第一个不同的步号落在哪一档：第 1 步 / 第 2 步 / 中间某一步（既不是第 1、第 2 步，也不是最后一步）/ 最后一步。",
  "六、分叉那一步的差异出在哪：只差动作（元素相同）→ 动作；只差元素（动作相同）→ 元素。",
  "七、可复用步数 × 2 ≥ 总步数 就是「达到一半以上」（相等也算）。",
]

[fam.reuse_band]
q = [
  "这段缓存能复用到什么程度？给一个档位。",
  "按判据给这段缓存的可复用程度定档。",
  "缓存与当前请求的可复用程度落在哪一档？",
]
levels = [
  "只差最后一步——从第 1 步起连续等价的步数 = 总步数 − 1",
  "约一半——从第 1 步起连续等价的步数 = 总步数的一半（向上取整）",
  "只前一步——从第 1 步起连续等价的步数 = 1",
  "一步都不能用——从第 1 步起连续等价的步数 = 0",
]

[fam.diverge_at]
q = [
  "第一个不同的步号落在哪一档？",
  "两条轨迹最早在第几步开始不同？给个档位。",
  "第一个不同出现在哪一档？",
]
[fam.diverge_at.criteria]
first = "第 1 步"
second = "第 2 步"
middle = "中间某一步——既不是第 1、第 2 步，也不是最后一步"
last = "最后一步"

[fam.diff_kind]
q = [
  "第 {step} 步两边的差异出在哪？",
  "第一个不同的第 {step} 步，差的是动作还是元素？",
  "第 {step} 步与缓存比，哪一处不同？",
]
[fam.diff_kind.criteria]
action = "动作不同——元素相同，换的是动作"
target = "元素不同——动作相同，换的是元素"

[fam.reuse_half]
q = [
  "缓存能复用的步数达到总步数的一半以上吗？",
  "可复用的部分是不是至少有全长的一半？",
  "缓存是否至少能用掉一半？",
]
[fam.reuse_half.criteria]
true = "达到——可复用步数 × 2 ≥ 总步数（相等也算）"
false = "没达到——可复用步数 × 2 < 总步数"
