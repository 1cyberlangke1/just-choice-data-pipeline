# 界面元素定位 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的字段名与四张词表**跨语言互不
# 重叠**（`reparse` 用的合并表按原文反查键）、四格分隔符（cell_sep）**必须一致**、
# 判据原文里必须印出 6 个角色、3 个角色类、2 档可见性、2 档可点性
# （漏印一项那一族就不可解；6 个标签印在清单里，不印在判据里）。

[meta]
title = "元素清单"
screen_label = "屏号"
action_label = "动作"
colon = "："
cell_sep = " · "
#: 近似文本 = 标签原文 + 这个后缀（反解按同一条规则剥回去）。
shadow_suffix = "草稿"

[role]
button = "按钮"
toggle = "开关"
link = "链接"
icon = "图标"
input = "输入框"
select = "下拉"

[visibility]
visible = "可见"
hidden = "隐藏"

[clickable]
yes = "可点"
no = "不可点"

[label]
save = "保存"
cancel = "取消"
delete = "删除"
edit = "编辑"
refresh = "刷新"
submit = "提交"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、元素清单每一行是「序号 · 角色 · 可见性 · 可点性 · 文本」；角色有六种：按钮、开关、链接、图标、输入框、下拉，归成三类：按钮类（按钮、开关）、链接类（链接、图标）、输入类（输入框、下拉）。二、动作落在哪个元素上：先找**文本与动作那一行的值完全一致**的元素——差一个字不算，只把那段文本当子串含在里面也不算；这些同名元素里再筛出**可见且可点**的，那就是落点。三、同名元素里可见且可点的只有一个，所以不用比谁更靠上；其余同名元素都是被挡住的——要么隐藏，要么可见但不可点。四、名字只是近似的元素指：文本把动作标签当子串含在里面、但不完全一样。"

[fam.found]
q = [
  "屏幕上有能落点的元素吗？",
  "按判据，这屏上有没有一个能点的同名元素？",
  "动作能落到某个元素上吗？",
]

[fam.found.criteria]
true = "有：有一个元素的文本与动作完全一致，而且可见、可点"
false = "没有：要么没有文本完全一致的元素，要么它们都被挡住了（隐藏，或可见但不可点）"

[fam.shadow]
q = [
  "屏幕上有名字只是近似的元素吗？",
  "这屏上有没有文本把动作标签当子串含在里面、但不完全一样的元素？",
  "按判据，屏幕上有近似元素吗？",
]

[fam.shadow.criteria]
true = "有：某个元素的文本把动作标签当子串含在里面，但不完全一样"
false = "没有：除了完全一致的那些，没有别的元素把动作标签当子串含在里面"

[fam.target]
q = [
  "动作落在第几个元素上？",
  "按判据，该点清单里的第几行？",
  "落点是第几个元素？",
]

[fam.role]
q = [
  "落点那个元素属于哪一类？",
  "第 {n} 个元素的角色属于哪一类？",
  "按判据，落点的角色是哪一类？",
]

[fam.decoy]
q = [
  "有几个同名元素被挡住了？",
  "同名元素里，被挡住的有几条？",
  "按判据，被挡住的同名元素有几条？",
]
levels = [
  "0 个：没有同名元素被挡住",
  "1 个：有一条同名元素被挡住",
  "2 个：有两条同名元素被挡住",
]

[option.role_class]
button_like = "按钮类：按钮与开关"
link_like = "链接类：链接与图标"
input_like = "输入类：输入框与下拉"

[option.slot]
element = "第 {n} 个：{role} · {visibility} · {clickable} · {text}"
