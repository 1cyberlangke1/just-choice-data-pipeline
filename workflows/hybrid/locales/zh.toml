# 混合式 workflow 的中文文案：骨架渲染模板、题面、选项描述、词表。
#
# 约定（由 tests/workflows/hybrid/test_locales.py 锁住）：
# - `word.room` 不少于 spec.ROOM_POOL 条、`word.lead` 不少于 spec.LEAD_POOL 条；
# - `word.weekday.names` 必须是 7 条、且顺序与 spec.WEEKDAY_KEYS 一致；
# - `duration.items` 必须是 4 条（下标 = 时长 - 1，覆盖 spec.DUR_RANGES 的全部取值）；
# - 每个题族三种问法；`fam.*` 的 noul / score 必须有 criteria。

language_name = "简体中文"

[meta]
title = "会议日程"
# 行内分隔符：渲染与反解都用它，所以两种语言共用同一个字符。
sep = " · "
colon = "："
span = "{start}–{end}"

[time]
# 所有会议都从整点开始，所以分钟恒为 00。
tpl = "{h:02d}:00"

[date]
tpl = "{y:04d}-{m:02d}-{d:02d}"

[bullet]
line = "{n}. {span}{sep}{room}{sep}{lead}"
title_label = "标题"
agenda_label = "议题"

[column]
n = "#"
start = "开始"
end = "结束"
room = "会议室"
lead = "主持人"
title = "标题"
agenda = "议题"

[prompt]
intro = "下面是「会议日程」这类素材。请为每一场会议补两段文字，让素材读起来像真实日程。"
rules = [
  "共 {count} 场会议，请按顺序各写一条。",
  "标题 4~12 个字，像真实的会议名；议题一句话，10~30 个字。",
  "**不要**写出任何时刻、时间段、日期或星期（例如「9 点」「下午」「周三」「本周」）。",
  "**不要**写出任何会议室名称。",
  "各场会议的标题必须互不相同，议题也必须互不相同。",
  "不要写编号、主持人姓名、会议室名，也不要写竖线或换行。",
  "全部用{language}书写。",
]

[ask.earliest_start]
q = ["哪一场会议开始得最早？", "日程里最早开始的那场会是几点？", "这些会议中，开始时刻最早的是哪一个？"]

[ask.meeting_day]
q = ["日程上写的日期是星期几？", "这一天是星期几？", "请判断日程日期是星期几。"]

[ask.duration_of]
q = ["第 {n} 场会议开了几个小时？", "第 {n} 场会议的时长是多少？", "第 {n} 场会从开始到结束持续几个小时？"]

[ask.room_of]
q = ["第 {n} 场会议在哪间会议室？", "第 {n} 场会安排在哪个会议室？", "第 {n} 场会使用的是哪间会议室？"]

[ask.lead_of]
q = ["第 {n} 场会议由谁主持？", "第 {n} 场会议的主持人是谁？", "第 {n} 场会由哪位主持人负责？"]

[ask.title_of]
q = ["第 {n} 场会议的标题是哪一个？", "第 {n} 场会的标题是什么？", "第 {n} 场会议写的是什么标题？"]

[ask.agenda_of]
q = ["第 {n} 场会议的议题是哪一个？", "第 {n} 场会要讨论什么？", "第 {n} 场会议写的议题是什么？"]

[fam.no_overlap]
q = ["日程里的会议在时间上互不重叠，对吗？", "有没有两场会议在时间上重叠？请判断「互不重叠」这句话对不对。", "这些会议两两之间都不占用同一时段，对吗？"]
criteria = { "true" = "互不重叠", "false" = "有重叠" }

[fam.room_free]
q = ["每间会议室在任一时刻都只被一场会占用，对吗？", "有没有两场会议同时占用同一间会议室？请判断「会议室没有冲突」这句话对不对。", "会议室安排上没有冲突，对吗？"]
criteria = { "true" = "没有冲突", "false" = "有冲突" }

[fam.busy_level]
q = ["12:00 到 16:00 之间，被会议占用的整点有几个？", "下午 12:00–16:00 这段时间里，有几小时被会议占用？", "统计 12:00–16:00 被会议覆盖的整点数量，是多少？"]
levels = [
  "0：12:00–16:00 之间没有任何会议",
  "1：占用 1 个整点",
  "2：占用 2 个整点",
  "3：占用 3 个整点",
  "4：占用 4 个或更多整点",
]

[word.room]
items = ["海棠厅", "青松厅", "白鹭厅", "紫竹厅", "金桂厅", "梧桐厅"]

[word.lead]
items = ["王敏", "李强", "张伟", "陈静", "刘洋", "赵蕾", "孙鹏", "周雪"]

[word.weekday]
names = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"]

[word.duration]
items = ["1 小时", "2 小时", "3 小时", "4 小时"]
