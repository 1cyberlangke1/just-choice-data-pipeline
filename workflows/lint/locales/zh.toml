# ---------- 题面 ----------

[fam.line]
q = ["第 {n} 行命中这条规则吗？", "第 {n} 行的内容符合这条检查规则吗？"]
[fam.line.criteria]
true = "第 {n} 行确实命中了这条规则"
false = "第 {n} 行没有命中这条规则"

[fam.count]
q = ["这段片段里有几行命中这条规则？", "按这条规则过一遍，命中的行一共有几行？"]
[fam.count.opt]
c0 = "一行都没有命中"
c1 = "正好 1 行命中"
c2 = "正好 2 行命中"
c3 = "正好 3 行命中"
c4 = "正好 4 行命中"
c5 = "正好 5 行命中"
c6 = "正好 6 行命中"
c7 = "正好 7 行命中"
c8 = "8 行全部命中"

[fam.gate]
q = [
  "按题面写明的处置办法（命中 0~2 行放行、3~5 行交人工复核、6 行及以上拦下），这段片段该怎么处置？",
  "处置办法是命中 0~2 行放行、3~5 行交人工复核、6 行及以上拦下——按这个办法，这段片段该走哪一档？",
]
[fam.gate.opt]
pass = "放行"
review = "人工复核"
block = "拦下"

[fam.spot]
q = [
  "这段片段里恰好只有一行命中这条规则，是哪一行？",
  "这段片段里只有一行命中这条规则，把那一行找出来。",
]
[fam.spot.opt]
row = "第 {n} 行：{line}"
