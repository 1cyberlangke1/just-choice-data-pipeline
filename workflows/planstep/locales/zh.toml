# 有界任务推进（planstep）workflow 的中文文案。
#
# 输入：`workflows.planstep.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 格分隔符 / 前置分隔符 / 规则行前缀三种**结构词元中英必须完全一致**——反解只有一份合并表，
#   按它们切格、剥前缀；
# - 抬头 / 区块抬头两两不互为前缀，且不与英文撞车（反解靠最长前缀认标签）；
# - `[task]` 的键与 `render.TASK_KEYS` 一一对应，五个任务名互不相同；
# - `[status]` 只有 done / pending 两个词，且不与英文撞车（同一格两种语言同词会让反解认错）；
# - 四个题族的问法模板互不相同（`locales.pick` 会静默取第一个命中）；
# - `[fam.remaining].levels` 与 `[fam.rounds].levels` 各六档，**下标就是答案**（0~5）；
# - `[fam.next].opt.none` 与 `[task]` 的五个任务名互不相同（组装器会拒掉重名选项）；
# - 两个 noul 族的 criteria 只有 true / false。

lang = "zh"
language_name = "简体中文"

[meta]
request = "计划推进请求号"
tasks = "任务表"
rules = "推进规则"
cell_sep = "|"
deps_sep = ","
deps_prefix = "前置="
deps_none = "无前置"
rules_prefix = "- "

[task]
T1 = "需求梳理"
T2 = "接口设计"
T3 = "核心实现"
T4 = "集成联调"
T5 = "上线发布"

[status]
done = "已完成"
pending = "待开始"

[rules]
lines = [
  "规则一：一项任务可开工，当且仅当它的状态是「待开始」、且它的所有前置项都已完成。",
  "规则二：可开工的项里先做依赖层数最浅的，层数相同就做编号最小的。依赖层数指从最源头的项到这一项的最长前置链长度，没有前置项的层数为 0。",
  "规则三：一轮就是把当时所有可开工的项一起标记为已完成。",
  "规则四：按上面的方式反复推进，直到没有可开工的项为止。",
]

[fam.remaining]
q = [
  "按这张表，到计划推不动为止，一共还要做几项任务？",
  "这张计划还剩几项没做完？",
  "数一数：从当前状态出发，还有几项任务是待开始的？",
]
levels = [
  "一项都不剩",
  "还剩 1 项",
  "还剩 2 项",
  "还剩 3 项",
  "还剩 4 项",
  "还剩 5 项",
]

[fam.next]
q = [
  "按推进规则，下一步该做哪一项任务？",
  "这张表当前状态下的下一步是第几项任务？",
  "推进规则说下一个该动手的是哪一项？",
]
opt = { none = "没有可开工的项" }

[fam.rounds]
q = [
  "从当前状态推进到推不动为止，一共要经过几轮？",
  "按推进规则反复推进，还需要几轮才能把这张表推完？",
  "这张计划还要再推几轮才停得下来？",
]
levels = [
  "还要 0 轮（已经推不动了）",
  "还要 1 轮",
  "还要 2 轮",
  "还要 3 轮",
  "还要 4 轮",
  "还要 5 轮",
]

[fam.unlocks]
q = [
  "做完下一步那一项之后，会不会立刻有别的任务变得可开工？",
  "下一步做完，是否马上解锁至少一项新任务？",
  "推进下一步会不会让新的任务立刻可开工？",
]
criteria = { true = "会解锁", false = "不会解锁" }
