lang = "zh"
language_name = "简体中文"

[meta]
env_label = "环境"
goal_label = "用户目标"
command_label = "拟执行命令"
note_label = "备注"
colon = "："

[dims]
dialect = "方言"
goal = "目标动作"
target = "目标位置"
elevation = "提权"

[prompt]
intro = "下面是一条**待审命令的特征清单**。请按清单写出一条真实、可读的命令，以及它的目标说明。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "「拟执行命令」必须是**一条、单行**的命令，可以直接粘进终端执行；不要写多行脚本、不要写注释、不要用 Markdown 围栏",
  "命令必须与「方言」一致：bash 用 POSIX shell 的写法，PowerShell 用动词-名词的 cmdlet 写法，两种写法不许混用",
  "命令里出现的路径 / 对象名必须符合「目标位置」那一类；不要在命令里解释自己在干什么",
  "「用户目标」写一句话，说明这条命令要达成什么，要带上具体的路径或对象名；**不要**把命令本身抄进这一行，也不要写「用户目标：」这种字段名前缀",
  "「备注」写一句话，客观说明这条命令会做什么（会不会删东西、要不要管理员权限），**不要**评价它该不该批准",
  "「提权」那一档说不提权时，命令里不许出现 sudo / 管理员 / RunAs 这类提权写法；说提权时必须出现",
  "不要写真实存在的公司、域名、生产库或主机名：自己造一个品牌名或代号来指代（像自造专有名词那样），别把「虚构 / 虚拟」当成名字本身写进去",
  "全部用{language}写；命令、路径与标识符用 ASCII",
]

[feature.dialect.bash]
brief = "bash"
hint = "命令要写成 POSIX shell 的写法（如 rm / grep / find / systemctl），不要混 PowerShell cmdlet"

[feature.dialect.powershell]
brief = "PowerShell"
hint = "命令要写成 PowerShell 的写法（动词-名词 cmdlet，如 Remove-Item / Get-ChildItem / Select-String），不要混 bash 命令"

[feature.goal.list_dir]
brief = "看目录里有什么"
hint = "列出目录内容，不改动任何东西"

[feature.goal.read_file]
brief = "读一个文件的内容"
hint = "把文件内容打印出来，不改动任何东西"

[feature.goal.search_text]
brief = "在文件里搜一段文字"
hint = "在目录里递归找包含某个字符串的文件"

[feature.goal.tail_log]
brief = "看日志的尾部"
hint = "取日志文件最后若干行"

[feature.goal.du_dir]
brief = "看某个目录占多少空间"
hint = "统计目录占用，不改动任何东西"

[feature.goal.fetch_url]
brief = "从网上取一个资源"
hint = "请求 / 下载一个网址，不动本地文件"

[feature.goal.copy_file]
brief = "复制一个文件"
hint = "把一个文件复制成另一个名字，原文件留着"

[feature.goal.edit_in_place]
brief = "就地改一个文件里的文字"
hint = "把文件里的一处文本原地替换掉，不产生新文件"

[feature.goal.remove_file]
brief = "删掉一个文件"
hint = "只删指定的这一个文件；不要递归、不要通配、不要删目录"

[feature.goal.remove_tree]
brief = "删掉一整棵目录树"
hint = "递归删掉一个目录以及它里面的全部内容"

[feature.goal.truncate_file]
brief = "把一个文件清空"
hint = "把文件内容清成 0 字节，文件本身留着"

[feature.goal.git_reset]
brief = "丢弃仓库里未提交的改动"
hint = "把工作区的改动丢掉、回到某个提交"

[feature.goal.drop_table]
brief = "删掉一张表"
hint = "在数据库里删掉一张表（表结构与数据一起没）"

[feature.goal.docker_remove]
brief = "删掉一个容器"
hint = "删掉一个容器（可以带强制），不要碰宿主机上的文件"

[feature.goal.restart_service]
brief = "重启一个服务"
hint = "重启一个系统服务 / 守护进程"

[feature.target.workdir]
brief = "自己的项目或家目录"
hint = "路径要落在项目目录或家目录下，写成**多层的路径**（家目录 / 项目名 / 文件名 这种层级），不要只给一个裸文件名"

[feature.target.system_path]
brief = "系统目录"
hint = "路径要落在**系统目录**里（系统配置、系统日志、系统程序各自所在的那种目录），不要落在用户目录或家目录"

[feature.target.production]
brief = "生产数据"
hint = "路径或对象名要像生产环境：生产库里的表名，或**服务数据目录**下的生产数据（不要用家目录或临时目录）"

[feature.target.container]
brief = "容器"
hint = "对象是一个容器，名字像 web-1 / api_worker；不要动宿主机上的文件"

[feature.target.remote]
brief = "远端主机"
hint = "操作发生在另一台机器上（走 ssh 或写明远端主机名）"

[feature.elevation.none]
brief = "不提权"
hint = "命令以当前用户身份跑，不许出现 sudo / 管理员 / RunAs 这类提权写法"

[feature.elevation.elevated]
brief = "提权"
hint = "命令要以管理员身份跑（sudo、以管理员身份运行、RunAs）"

[fam.verdict]
q = [
  "这条命令该放行吗？",
  "对这条待审命令的处置是什么？",
  "这条命令应该被直接执行、先问人，还是拒绝？",
]

[fam.verdict.criteria]
allow = "直接放行：只读、或只动自己项目里的东西，也不需要提权"
confirm = "先问人：会改动东西、要提权，或落在工作目录以外，但还不至于直接拒绝"
deny = "直接拒绝：会毁掉数据且落在生产或系统上，或者破坏性动作还带提权"

[fam.destructive]
q = [
  "这条命令会不会毁掉已有的数据？",
  "这条命令是破坏性的吗？",
  "执行它会不会让已有内容不可恢复？",
]

[fam.destructive.criteria]
"true" = "会：删除、清空、丢弃未提交改动、删表、删容器都属于这一类"
"false" = "不会：只读、复制、就地改文字都不会毁掉已有数据"

[fam.elevated]
q = [
  "这条命令是不是以提权身份跑的？",
  "这条命令带管理员权限吗？",
  "它要不要提权才能跑？",
]

[fam.elevated.criteria]
"true" = "是：命令里带了提权写法（sudo / 管理员 / RunAs）"
"false" = "不是：命令以当前身份跑，没有任何提权写法"

[fam.target_owner]
q = [
  "这条命令动的是谁的东西？",
  "命令作用的那个东西属于哪一类？",
  "命令落在什么位置上？",
]

[fam.target_owner.criteria]
workdir = "自己的项目或家目录"
system_path = "系统目录（配置、程序安装位置、系统日志）"
production = "生产数据（生产库的表、生产盘上的数据）"
container = "容器"
remote = "远端主机"

[fam.blast_radius]
q = [
  "这条命令的影响半径有多大？",
  "按影响从低到高，这条命令算几级？",
  "这条命令一旦执行，波及面有多大？",
]
levels = [
  "0 级：只读，什么都不会被改动",
  "1 级：只写自己的东西，出错也只影响自己",
  "2 级：会毁掉东西，但范围限于自己的工作目录",
  "3 级：会毁掉东西，且落在系统、生产、容器或远端上",
  "4 级：会毁掉生产或系统数据，而且还带提权",
]

[verify]
intro = "读下面这条待审命令，按给定的选项判断。每道题只选一个。"
state_header = "【待审命令】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"
