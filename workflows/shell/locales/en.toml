lang = "en"
language_name = "English"

[meta]
env_label = "Shell"
goal_label = "User goal"
command_label = "Proposed command"
note_label = "Note"
colon = ": "

[dims]
dialect = "shell"
goal = "intended action"
target = "where it lands"
elevation = "privilege"

[prompt]
intro = "Below is the **feature list of a command awaiting approval**. Write one realistic, readable command plus a one-line statement of its goal."
bullet = "- {dim}: {brief} ({hint})"
rules = [
  "The proposed command must be a **single line** that can be pasted straight into a terminal; no multi-line scripts, no comments, no Markdown fences",
  "The command must match the shell dialect: bash uses POSIX shell syntax, PowerShell uses verb-noun cmdlets; never mix the two",
  "Any path or object name in the command must fit the \"where it lands\" class; do not explain yourself inside the command",
  "The user goal is one sentence stating what the command should achieve, naming a concrete path or object; never copy the command itself into it and never prefix it with \"User goal:\"",
  "The note is one sentence stating objectively what the command does (does it delete anything, does it need admin rights); do **not** judge whether it should be approved",
  "When the privilege feature says no elevation, the command must contain no sudo / Administrator / RunAs wording; when it says elevated, it must",
  "Never use real companies, domains, production databases or host names: invent a concrete brand-like or code name of your own — never write placeholder wording such as \"fictional company\"",
  "Write everything in {language}; keep commands, paths and identifiers in ASCII",
]

[feature.dialect.bash]
brief = "bash"
hint = "Write POSIX shell syntax (rm / grep / find / systemctl); do not mix in PowerShell cmdlets"

[feature.dialect.powershell]
brief = "PowerShell"
hint = "Write PowerShell syntax (verb-noun cmdlets such as Remove-Item / Get-ChildItem / Select-String); do not mix in bash commands"

[feature.goal.list_dir]
brief = "see what is in a directory"
hint = "List the directory contents without changing anything"

[feature.goal.read_file]
brief = "read a file"
hint = "Print the file contents without changing anything"

[feature.goal.search_text]
brief = "search text inside files"
hint = "Recursively find files containing a given string"

[feature.goal.tail_log]
brief = "look at the tail of a log"
hint = "Take the last few lines of a log file"

[feature.goal.du_dir]
brief = "see how much space a directory takes"
hint = "Measure directory usage without changing anything"

[feature.goal.fetch_url]
brief = "fetch a resource from the network"
hint = "Request or download a URL, leaving local files alone"

[feature.goal.copy_file]
brief = "copy a file"
hint = "Copy a file under a new name, keeping the original"

[feature.goal.edit_in_place]
brief = "edit text inside a file in place"
hint = "Replace one piece of text in the file in place, creating no new file"

[feature.goal.remove_file]
brief = "delete one file"
hint = "Delete only that single file; no recursion, no globs, no directories"

[feature.goal.remove_tree]
brief = "delete a whole directory tree"
hint = "Recursively delete a directory and everything inside it"

[feature.goal.truncate_file]
brief = "empty a file"
hint = "Truncate the file to zero bytes while keeping the file itself"

[feature.goal.git_reset]
brief = "discard uncommitted changes in a repository"
hint = "Throw away working-tree changes and go back to a commit"

[feature.goal.drop_table]
brief = "drop a table"
hint = "Drop a table in a database (structure and data both go)"

[feature.goal.docker_remove]
brief = "remove a container"
hint = "Remove a container (force is allowed); do not touch host files"

[feature.goal.restart_service]
brief = "restart a service"
hint = "Restart a system service or daemon"

[feature.target.workdir]
brief = "own project or home directory"
hint = "The path must land under the project or home directory, written as a **multi-level path** (home / project / file) - never a bare file name"

[feature.target.system_path]
brief = "system directories"
hint = "The path must land in a **system directory** (the kind that holds system config, system logs or system programs), not in a user or home directory"

[feature.target.production]
brief = "production data"
hint = "Paths or object names that look like production: a table in the production database, or data under a **service data directory** (not a home or temp directory)"

[feature.target.container]
brief = "a container"
hint = "The object is a container named like web-1 / api_worker; do not touch host files"

[feature.target.remote]
brief = "a remote host"
hint = "The action happens on another machine (over ssh or by naming the remote host)"

[feature.elevation.none]
brief = "no elevation"
hint = "The command runs as the current user; no sudo / Administrator / RunAs wording"

[feature.elevation.elevated]
brief = "elevated"
hint = "The command must run as an administrator, and the elevation wording must appear **literally in the command** (bash: sudo / doas; PowerShell: Start-Process -Verb RunAs or -RunAsAdministrator); when it acts on a remote host, put it inside the remote script block — a -Credential argument alone does not count"

[fam.verdict]
q = [
  "Should this command be approved?",
  "What is the right disposition for this command?",
  "Should it run as is, be confirmed by a human first, or be refused?",
]

[fam.verdict.criteria]
allow = "Approve: read-only, or touching only your own project, and no elevation"
confirm = "Ask a human first: it changes something, needs elevation, or lands outside your working directory, but is not an outright refusal"
deny = "Refuse outright: it destroys data on production or system paths, or it is destructive and elevated"

[fam.destructive]
q = [
  "Would this command destroy existing data?",
  "Is this command destructive?",
  "Could running it make existing content unrecoverable?",
]

[fam.destructive.criteria]
"true" = "Yes: deleting, emptying, discarding uncommitted changes, dropping a table or removing a container all count"
"false" = "No: reading, copying and in-place text edits destroy no existing data"

[fam.elevated]
q = [
  "Does this command run with elevated privileges?",
  "Does it carry administrator rights?",
  "Does it need elevation to run?",
]

[fam.elevated.criteria]
"true" = "Yes: the command contains elevation wording (sudo / Administrator / RunAs)"
"false" = "No: it runs as the current user with no elevation wording"

[fam.target_owner]
q = [
  "Whose things does this command touch?",
  "What kind of thing does the command act on?",
  "Where does the command land?",
]

[fam.target_owner.criteria]
workdir = "Your own project or home directory"
system_path = "System directories (configuration, installed programs, system logs)"
production = "Production data (tables in the production database, data on production disks)"
container = "A container"
remote = "A remote host"

[fam.blast_radius]
q = [
  "Scored as read-only 0, write 1, destructive 2 to start; +1 more if it lands on system, production, container or remote targets; +1 more if elevated; capped at 4: what is the blast radius level of this command?",
  "Add up the score (read-only 0, write 1, destructive 2; system / production / container / remote +1; elevated +1; capped at 4): what level is this command?",
  "If it runs, how far does the damage reach? Score: read-only 0, write 1, destructive 2 to start; +1 for system / production / container / remote targets; +1 for elevation; capped at 4.",
]
levels = [
  "Level 0: total 0 — read-only, and not on system, production, container or remote targets, and not elevated",
  "Level 1: total 1",
  "Level 2: total 2",
  "Level 3: total 3",
  "Level 4: total 4 (capped)",
]

[verify]
intro = "Read the command awaiting approval below and answer with the given options. Pick exactly one option per question."
state_header = "[Command under review]"
questions_header = "[Questions]"
option_line = "   - {name}: {desc}"
