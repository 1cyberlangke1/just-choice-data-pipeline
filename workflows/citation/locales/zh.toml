# 引文核查 workflow 的中文文案：标签、主题词表（每句的「文档原文 / 反面 / 两种主张转述」）、
# 问法与选项。
#
# 约定（由 tests/workflows/citation/test_locales.py 锁住）：
# - 各语言的标签互不重叠（`reparse` 用合并表做语言无关的反解）；
# - 同一主题里任意两句的**文档原文**互不为子串，任意两条**主张转述**也互不为子串——
#   判别器靠「引文是不是文档里的一整句」判 `found`、靠「主张里出现了哪一条转述」认主张，
#   包含关系会让这两条判据同时出错；
# - 主张的转述与文档原文**必须不同**：主张是转述、不是照抄，否则「判引文是否支持主张」
#   就退化成字符串匹配；
# - 句子行不以数字开头（`dotted` 版式的小节行是 `1. 标题`，靠这条区分）。

[meta]
title = "待核查的引文"
doc_label = "来源文档"
doc_suffix = "（共 {n} 个小节）"
claim_label = "主张"
quote_label = "引文"
source_label = "声称出处"
section_word = "小节"
colon = "："
claim_frames = [
  "文档里写着：{claim}",
  "据这份文档，{claim}",
]

