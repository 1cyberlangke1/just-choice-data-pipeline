[ask.found]
q = [
  "这条引文是否逐字出现在来源文档里？判据：引文要与文档里的某一整句完全一致；被截断、改过词、只对上半个句子，都算不在文档里。",
  "来源文档里有没有与这条引文一字不差的一整句？",
  "这条引文是照抄文档的吗？整句一致才算照抄。",
]
criteria = { "true" = "在，文档里有一整句与它逐字相同", "false" = "不在，文档里没有与它逐字相同的整句" }

[ask.located]
q = [
  "这条引文是否出现在它声称的那个小节里？",
  "它声称的那个小节里，有没有这句引文？",
  "引文的出处对得上吗——它真的在声称的那个小节里吗？",
]
criteria = { "true" = "在，就在它声称的那个小节里", "false" = "不在，声称的那个小节里没有这句引文" }

[ask.relation]
q = [
  "它声称的那个小节与这条主张是什么关系？判据：该小节里有句子说这件事、意思与主张相同 = 支持；该小节里有句子说的是这件事的反面 = 反驳；该小节里没有任何一句在说这件事 = 没提。",
  "只看它声称的那个小节：那里的话是支持这条主张、反驳这条主张，还是根本没提？",
  "它声称的那个小节对这条主张表了什么态？",
]

[ask.quote_source]
q = [
  "这条引文实际上出自哪里？判据：引文没有逐字出现在文档里 = 不在文档里；逐字出现了、就在它声称的那个小节里 = 声称的那个小节；逐字出现了、但在别的小节里 = 文档里的另一个小节。",
  "这条引文真正的位置是哪儿？",
  "按实际位置，这条引文属于哪一种？",
]

[ask.verdict]
q = [
  "这条引文该判成哪一档？判据：引文不在文档里 = 编造；引文在文档里、但不在它声称的小节里 = 证据不足；引文在声称的小节里——该小节支持主张 = 通过，反驳主张 = 反驳，没提 = 证据不足。",
  "综合「引文在不在文档里」「在不在声称的小节里」「该小节的态度」，这条引文属于哪一档？",
  "给这条引文一个核查结论。",
]

[ask.action]
q = [
  "这条引文该自动采信，还是交人复核？判据：判成「通过」或「反驳」的自动采信；判成「证据不足」的交人复核；判成「编造」的由字符串匹配直接定案，也自动采信。",
  "按处置规则，这条引文走自动还是走人工？",
  "这条引文下一步怎么处理？",
]

[ask.evidence_strength]
q = [
  "这条引文的证据强度是几级？量表：0 = 引文不在文档里；1 = 引文在文档里，但不在它声称的小节里；2 = 引文在它声称的小节里，但该小节没提到这条主张；3 = 引文在它声称的小节里，且该小节支持或反驳了这条主张。",
  "按量表给这条引文的证据强度定级。",
  "这条引文提供的证据有多强？",
]
levels = [
  "0 级：引文不在文档里（编造）",
  "1 级：引文在文档里，但不在它声称的小节里",
  "2 级：引文在它声称的小节里，但该小节没有提到这条主张",
  "3 级：引文在它声称的小节里，且该小节支持或反驳了这条主张",
]

[option.verdict]
verified = "通过——引文逐字在文档里，就在它声称的小节里，且该小节支持这条主张"
contradicted = "反驳——引文逐字在文档里，就在它声称的小节里，且该小节说的是这条主张的反面"
unsupported = "证据不足——引文在文档里，但要么不在它声称的小节里，要么声称的那个小节根本没提到这条主张"
fabricated = "编造——引文没有逐字出现在文档里"

[option.relation]
supports = "支持——该小节里有句子说的是这件事，意思与主张相同"
contradicts = "反驳——该小节里有句子说的是这件事的反面"
says_nothing = "没提——该小节里没有任何一句在说这件事"

[option.quote_source]
cited_section = "就在它声称的那个小节里"
other_section = "在文档里，但在别的小节里"
not_in_doc = "不在文档里"

[option.action]
auto_accept = "自动采信——判成通过、反驳或编造的，都不需要人再看"
human_review = "交人复核——只有判成证据不足的需要人工确认"
