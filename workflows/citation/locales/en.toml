# English strings for the citation workflow: labels, topic tables
# (each sentence: document wording / its opposite / two claim paraphrases),
# questions and options.
#
# 与中文文件同一批约定（见 zh.toml 顶部）：标签互不重叠、同一主题里句子原文与主张转述
# 各自互不为子串、主张转述必须与文档原文不同、句子行不以数字开头。

[meta]
title = "Citation to check"
doc_label = "Source document"
doc_suffix = " ({n} sections)"
claim_label = "Claim"
quote_label = "Quote"
source_label = "Cited section"
section_word = "section"
colon = ": "
claim_frames = [
  "The document says: {claim}",
  "According to this document, {claim}",
]

[topic.auth]
label = "Service authentication standard"
headings = ["Token lifecycle", "Key management", "Logging and audit", "Account security", "Password policy", "Admin console"]

[topic.auth.sentence.token_rotation]
doc = "Access tokens must be rotated on a schedule"
neg = "Access tokens need not be rotated on a schedule"
claim = "Access tokens should be replaced periodically"
claim_neg = "Access tokens need not be replaced periodically"

[topic.auth.sentence.session_scope]
doc = "Sessions must be limited to the least privilege scope"
neg = "Sessions need not be limited to the least privilege scope"
claim = "A session should carry the narrowest possible scope"
claim_neg = "A session need not carry the narrowest possible scope"

[topic.auth.sentence.key_storage]
doc = "Signing keys must be kept in a key management service"
neg = "Signing keys need not be kept in a key management service"
claim = "Signing keys should be hosted by a key management service"
claim_neg = "Signing keys need not be hosted by a key management service"

[topic.auth.sentence.auth_log]
doc = "Every failed authentication must be written to the audit log"
neg = "No failed authentication needs to be written to the audit log"
claim = "A failed sign-in should leave an audit record"
claim_neg = "A failed sign-in need not leave an audit record"

[topic.auth.sentence.mfa_admin]
doc = "Administrator accounts must enable a second factor"
neg = "Administrator accounts need not enable a second factor"
claim = "An administrator account should turn on a second factor"
claim_neg = "An administrator account need not turn on a second factor"

[topic.auth.sentence.ip_allow]
doc = "The admin console must restrict the source addresses it accepts"
neg = "The admin console need not restrict the source addresses it accepts"
claim = "The admin console should limit which origins may reach it"
claim_neg = "The admin console need not limit which origins may reach it"

[topic.billing]
