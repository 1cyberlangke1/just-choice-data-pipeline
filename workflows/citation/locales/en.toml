claim_neg = "An exported report need not hide personal data"

[topic.rollout]
label = "Release process standard"
headings = ["Canary and ramp", "Rollback plan", "Release window", "Database changes", "Feature flags", "Post-release checks"]

[topic.rollout.sentence.canary]
doc = "A new version must first canary five percent of the traffic"
neg = "A new version need not first canary five percent of the traffic"
claim = "A new version should first run on a small slice of traffic"
claim_neg = "A new version need not first run on a small slice of traffic"

[topic.rollout.sentence.rollback_plan]
doc = "A release must ship with a rollback plan"
neg = "A release need not ship with a rollback plan"
claim = "A release should come with a rollback plan"
claim_neg = "A release need not come with a rollback plan"

[topic.rollout.sentence.freeze_friday]
doc = "A production change must not ship on a Friday"
neg = "A production change may ship on a Friday"
claim = "A production change should not go out on a Friday"
claim_neg = "A production change may go out on a Friday"

[topic.rollout.sentence.migration_review]
doc = "A database change must pass review"
neg = "A database change need not pass review"
claim = "A schema change should be reviewed first"
claim_neg = "A schema change need not be reviewed first"

[topic.rollout.sentence.feature_flag]
doc = "A new feature must default to off"
neg = "A new feature need not default to off"
claim = "A new feature should ship disabled"
claim_neg = "A new feature need not ship disabled"

[topic.rollout.sentence.smoke_test]
doc = "A release must be followed by a smoke test"
neg = "A release need not be followed by a smoke test"
claim = "After shipping, a smoke check should be run"
claim_neg = "After shipping, a smoke check need not be run"

[ask.found]
q = [
  "Does this quote appear verbatim in the source document? Rule: the quote counts only if it matches one whole sentence of the document exactly; a truncated, reworded, or half-matching quote does not count as being in the document.",
  "Is there a whole sentence in the source document that matches this quote word for word?",
  "Is this quote copied from the document? Only a whole-sentence match counts as copied.",
]
criteria = { "true" = "Yes, one whole sentence matches it word for word", "false" = "No, no whole sentence matches it word for word" }

[ask.located]
q = [
  "Does this quote appear in the section it claims to come from?",
  "Is this quote present in the section it cites?",
  "Does the cited section really contain this quote?",
]
criteria = { "true" = "Yes, it sits in the section it cites", "false" = "No, the cited section does not contain it" }

[ask.relation]
q = [
  "How does the cited section relate to this claim? Rule: the section has a sentence about this matter with the same meaning as the claim = supports; the section has a sentence stating the opposite = contradicts; no sentence in the section is about this matter at all = says nothing.",
  "Looking only at the cited section: does it support the claim, contradict it, or not mention the matter?",
  "What stance does the cited section take on this claim?",
]

[ask.quote_source]
q = [
  "Where does this quote actually come from? Rule: not present word for word in the document = not in the document; present word for word inside the section it cites = the cited section; present word for word but in another section = another section of the document.",
  "Where does this quote really sit?",
  "By its actual position, which case applies to this quote?",
]

[ask.verdict]
q = [
  "Which verdict does this quote deserve? Rule: quote not in the document = fabricated; quote in the document but not in the section it cites = unsupported; quote inside the cited section - the section supports the claim = verified, states the opposite = contradicted, says nothing about it = unsupported.",
  "Combine whether the quote is in the document, whether it sits in the cited section, and that section's stance: which verdict applies?",
  "Give this quote a checking verdict.",
]

[ask.action]
q = [
  "Should this quote be accepted automatically or sent to a human? Rule: verified or contradicted are accepted automatically; unsupported goes to a human; fabricated is settled by the string match, so it is accepted automatically too.",
  "By the handling rule, does this quote go automatic or to a person?",
  "What happens to this quote next?",
]

[ask.evidence_strength]
q = [
  "What level of evidence does this quote provide? Scale: 0 = the quote is not in the document; 1 = the quote is in the document but not in the section it cites; 2 = the quote is in the cited section but that section never mentions the claim; 3 = the quote is in the cited section and that section supports or contradicts the claim.",
  "Grade this quote's evidence strength on the scale.",
  "How strong is the evidence this quote provides?",
]
levels = [
  "level 0: the quote is not in the document (fabricated)",
  "level 1: the quote is in the document but not in the section it cites",
  "level 2: the quote is in the cited section but that section never mentions the claim",
  "level 3: the quote is in the cited section and that section supports or contradicts the claim",
]

[option.verdict]
verified = "verified - the quote is word for word in the document, inside the section it cites, and that section supports the claim"
contradicted = "contradicted - the quote is word for word in the document, inside the section it cites, and that section states the opposite of the claim"
unsupported = "unsupported - the quote is in the document, but either it is not in the section it cites, or the cited section never mentions the claim"
fabricated = "fabricated - the quote does not appear word for word in the document"

[option.relation]
supports = "supports - the section has a sentence about this matter with the same meaning as the claim"
contradicts = "contradicts - the section has a sentence stating the opposite"
says_nothing = "says nothing - no sentence in the section is about this matter"

[option.quote_source]
cited_section = "inside the section it cites"
other_section = "in the document, but in another section"
not_in_doc = "not in the document"

[option.action]
auto_accept = "accept automatically - verified, contradicted and fabricated all need no human"
human_review = "send to a human - only unsupported needs a person to confirm"
