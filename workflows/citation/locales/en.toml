headings = ["Billing cycle", "Refunds and reversals", "Tax handling", "Plan changes", "Retry policy", "Credit notes"]

[topic.billing.sentence.invoice_monthly]
doc = "An invoice must be generated on the first of each month"
neg = "An invoice need not be generated on the first of each month"
claim = "A bill should be issued on the first of the month"
claim_neg = "A bill need not be issued on the first of the month"

[topic.billing.sentence.refund_window]
doc = "A refund request must be filed within seven days of payment"
neg = "A refund request need not be filed within seven days of payment"
