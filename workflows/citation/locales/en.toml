[topic.retention.sentence.log_90d]
doc = "Access logs must be kept for ninety days"
neg = "Access logs need not be kept for ninety days"
claim = "Access logs should stay available for a quarter"
claim_neg = "Access logs need not stay available for a quarter"

[topic.retention.sentence.backup_daily]
doc = "The database must be backed up once a day"
neg = "The database need not be backed up once a day"
claim = "The database should be backed up daily"
claim_neg = "The database need not be backed up daily"

[topic.retention.sentence.deletion_30d]
doc = "Data must be deleted within thirty days of account closure"
neg = "Data need not be deleted within thirty days of account closure"
