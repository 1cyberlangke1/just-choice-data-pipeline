claim_neg = "A refund need not be requested within seven days of payment"

[topic.billing.sentence.tax_included]
doc = "The list price must include tax"
neg = "The list price need not include tax"
claim = "A list price should already cover tax"
claim_neg = "A list price need not cover tax"

[topic.billing.sentence.proration]
doc = "A mid-cycle upgrade must prorate the charge by day"
neg = "A mid-cycle upgrade need not prorate the charge by day"
claim = "A mid-cycle upgrade should prorate the difference by day"
claim_neg = "A mid-cycle upgrade need not prorate the difference by day"

[topic.billing.sentence.dunning]
doc = "A failed charge must be retried three times"
neg = "A failed charge need not be retried three times"
claim = "A failed charge should go through three retries"
claim_neg = "A failed charge need not go through three retries"

[topic.billing.sentence.credit_note]
doc = "A reversal must issue a credit note"
neg = "A reversal need not issue a credit note"
claim = "A reversal should produce a credit note"
claim_neg = "A reversal need not produce a credit note"

[topic.retention]
