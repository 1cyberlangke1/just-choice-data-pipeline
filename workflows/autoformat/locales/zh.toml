# 结构恢复（autoformat）workflow 的中文文案。
#
# 输入：`workflows.autoformat.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为：
# - 句子模板里的 `{槽位}` 由 spec 用 `[slot]` 里的词填充；
# - 段落 / 引用 / 提示框的句子**必须带句末标点**（渲染侧靠「行末有没有标点」区分整段结束与硬换行）；
# - 标题与列表项**必须不带句末标点**且足够短（渲染侧靠「短行」认出它们）；
# - 提示框关键词按种类分组且**互不重叠**（判别器靠它反推种类）；
# - 除提示框以外的文本里**不许出现**提示框关键词（否则判别器会把普通段落认成提示框）。

[doc]
context = "下面是一份丢掉了 Markdown 标记的纯文本备忘：没有 #、没有列表符号、没有引用符号，正文被硬换行折断了，每一行都以 L 开头的行号起头。所谓「内容块」指：连续的若干行组成一块，块与块之间用空行隔开，列表里的每一项各算一块。"

[mark]
attribution = "——"
sentence_join = ""

[type]
heading = "标题"
paragraph = "正文段落"
list_item = "列表项"
quote = "引用"
code = "命令行"
callout = "提示框"

[type_desc]
heading = "简短的一行小标题，概括它后面的内容"
paragraph = "普通的叙述段落，可能被折成好几行"
list_item = "列表里的一项，通常是简短的名词短语或一句话"
quote = "转述别人的话，结尾带署名"
code = "可以直接照着敲的命令行"
callout = "提醒读者注意、给建议或发出警告的一段话"

[callout_kind]
note = "备注"
tip = "小技巧"
warning = "警告"

[callout_word]
note = ["备注", "说明"]
tip = ["提示", "建议", "小技巧"]
warning = ["警告", "注意", "务必", "切记"]

[seq_word]
step = ["先", "然后", "接着", "最后", "第一步", "第二步", "第三步"]

[slot]
service = ["构建流水线", "发布脚本", "监控面板", "数据导入任务", "通知服务"]
team = ["平台组", "前端组", "数据组", "运维组", "质量组"]
env = ["测试环境", "预发环境", "生产环境"]
count = ["两台", "三台", "四台", "五台"]
version = ["1.4.0", "2.0.1", "3.1.2"]
branch = ["main", "release/1.4", "hotfix/login"]
repo = ["platform/core", "web/client", "data/etl"]
hours = ["十分钟", "半小时", "一小时"]
name = ["老王", "小李", "阿陈", "小周"]

[head]
build = ["构建系统迁移", "新的构建入口", "构建缓存怎么清"]
release = ["本次发布安排", "回滚预案", "发布窗口"]
onboarding = ["新同学上手指南", "第一天要做的事", "权限怎么申请"]
incident = ["故障复盘", "影响范围", "后续改进"]
migration = ["数据迁移计划", "迁移步骤", "校验方式"]

[sent]
build = [
  "{service} 已经在新流程下跑了三周，结果稳定，可以正式切过来了。",
  "旧的 make 目标会保留到月底，这期间两条路都能走。",
  "新的入口是一条命令包办全部，连文档构建也一起做了。",
  "生成的产物不用再提交进仓库，流水线会自己上传。",
  "这次切换会影响 {count} 个服务，动手前先确认自己在不在名单里。",
]
release = [
  "本次发布安排在周四晚上十点，窗口只有 {hours}。",
  "回滚只需要把上一个版本重新部署一次，不用回滚数据库。",
  "如果 {env} 的冒烟测试不过，就按预案停在 {branch} 上。",
  "发布负责人是{team}的值班同学，出了问题先找他。",
  "灰度会先放百分之五的流量，观察半小时再全量。",
]
onboarding = [
  "欢迎加入{team}，这份备忘把第一周要做的事列一遍。",
  "开发机上的工具链用仓库里的脚本一键装好，省得手动折腾。",
  "代码评审至少需要一位同事通过，机器人也会跑一遍检查。",
  "遇到权限问题直接找你的导师，他会帮你开。",
  "第一周先把 {repo} 的目录结构看熟，再动第一行代码。",
]
incident = [
  "昨晚 {env} 的 {service} 出了大约 {hours} 的故障，现在已经恢复。",
  "根因是一个没有上限的重试，把下游服务打满了。",
  "影响范围是 {count} 个服务，用户侧表现为请求变慢。",
  "值班同学在半小时内定位到了问题，但恢复花了更久。",
  "后续要把重试上限写进公共库，免得再犯。",
]
migration = [
  "数据迁移会分三批做，每批之间留一天观察。",
  "迁移期间旧表只读，写入会先落到新表再回灌。",
  "校验方式是逐行比对行数和校验和，对不上就停下来。",
  "回滚窗口只有 {hours}，过了窗口就只能往前修。",
  "迁移脚本放在 {repo} 里，跑之前先在 {env} 演练一遍。",
]

[intro]
code = ["照着敲这几条就行：", "常用的命令就这几条："]
list = ["要改的东西有这么几项：", "名单如下：", "具体步骤是这样的："]
close = ["就这些，有疑问随时在群里问。", "先按这个来，后面再补细节。"]

[item]
step = [
  "先确认 {env} 的构建是绿的",
  "然后把版本号提到 {version}",
  "接着把 {branch} 合进主干",
  "最后跑一遍冒烟测试",
  "第一步先备份旧配置",
  "第二步在 {env} 上试跑一次",
]
plain = [
  "{team}",
  "{service}",
  "发布负责人",
  "{repo}",
  "监控面板",
  "回滚预案",
]

[code]
build = ["bun run build", "make -j4 release", "pnpm run build --filter web"]
vcs = ["git status --short", "git log --oneline -5", "git push origin main"]
container = ["docker compose up -d", "docker ps --format table", "docker compose logs api"]
package = ["npm ci --omit=dev", "pip install -r requirements.txt", "cargo build --release"]

[quote]
"0" = "「这次切换最大的风险不是新流程，而是没人记得旧流程怎么回滚。」——{name}"
"1" = "「宁可慢一天，也不要带着没验证的产物上线。」——{team}的{name}"
"2" = "「先把观测补齐，再谈自动化。」——{name}"
"3" = "「故障不可怕，可怕的是同一个故障来第二次。」——{name}"

[callout]
note = [
  "备注：这一节的命令在 {env} 上同样适用。",
  "说明：旧版本没有这个开关，升级之后才有。",
]
tip = [
  "小技巧：把常用的命令写成别名，能省下不少敲键盘的时间。",
  "建议先把 {repo} 拉到本地，再动手改配置。",
]
warning = [
  "注意：清理构建缓存会把增量产物一起删掉，第一次构建会明显变慢。",
  "警告：不要在 {env} 上直接跑迁移脚本，先拿一份快照。",
  "务必在动手前把当前分支推上去，否则回滚会很麻烦。",
]

[fam.join]
q = [
  "第 {a} 行与第 {b} 行相邻：第 {b} 行是不是接着第 {a} 行那句话往下写的？",
  "{a} 与 {b} 这两行：{b} 是 {a} 那句话的延续吗？",
]
[fam.join.criteria]
true = "{b} 接着 {a} 那句话往下写，两行属于同一个内容块"
false = "{b} 没有接着 {a}，它另起了一句或另起了一块"

[fam.block_type]
q = [
  "按从上到下数，第 {k} 个内容块属于哪一类？",
  "从上往下数第 {k} 个内容块，是什么类型的内容？",
]

[fam.callout_kind]
q = ["文档里那个提示框属于哪一类？", "文档里的提示框是备注、小技巧还是警告？"]

[fam.list_ordered]
q = ["文档里那个列表是有先后顺序的步骤列表吗？", "文档里那个列表，各项之间有先后顺序吗？"]
[fam.list_ordered.criteria]
true = "这个列表是按步骤排的，各项有先后顺序"
false = "这个列表只是并列的几项，没有先后顺序"

