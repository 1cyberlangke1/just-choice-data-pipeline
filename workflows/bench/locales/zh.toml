# 评测与基准 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的抬头字段名 / 参考格标签 / 候选
# 词表**跨语言互不重叠**（`reparse` 用的合并表按原文反查键）、格分隔符与格内分隔符
# （cell_sep / pair_sep）**必须一致**、判据原文里必须印出 4 个选项字母、6 档答对条数、
# 门槛的取值域与 2 档差距（漏印一项那一族就不可解）。冒号不要求一致（中文 `：`、英文 `: `）。

[meta]
title = "评测记录"
colon = "："
cell_sep = " · "
pair_sep = " "

[label]
request = "集"
bar = "门槛"

[cell]
ref = "参考"

[cand]
m0 = "甲"
m1 = "乙"
m2 = "丙"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、每份评测记录一屏，抬头两格是集、门槛；下面每题一行，第一格是参考答案，后面每个候选一格，格子里是候选名加上它给的答案字母；候选的列序每份记录不同，以每行写出来的名字为准，**第 1 个候选**就是每行里第一个候选那一列。二、一个候选在某题**答对**，当且仅当它给的答案字母与那一题的参考答案字母完全相同；字母只有 A、B、C、D 四个。三、一个候选的**答对条数** = 它答对的题数；一共五题，所以一共六档：答对 0 道、答对 1 道、答对 2 道、答对 3 道、答对 4 道、答对 5 道。四、第 1 个候选**达标**，当且仅当它的答对条数不低于门槛那一格；门槛是 2、3、4 里的一个。五、**最好的候选** = 答对条数最多的那一个；答对条数一样多时，取列序更靠前的那个。六、**差距**：最好的那个候选比第 1 个候选多答对几道；这个差只可能是差 2 道或者差 4 道；第 1 个候选自己就是最好的时候没有差距，这一族不出题。"

[fam.hit]
q = [
  "第 {n} 题，第 1 个候选答对了吗？",
  "按记录，第 {n} 题第 1 个候选答没答对？",
  "第 {n} 题里第 1 个候选给的答案对不对？",
]

[fam.hit.criteria]
true = "答对：它给的答案字母与那一题的参考答案字母完全相同"
false = "答错：它给的答案字母与那一题的参考答案字母不同"

[fam.count]
q = [
  "第 1 个候选答对了几道？",
  "按记录，第 1 个候选一共答对几道？",
  "第 1 个候选的答对条数是几道？",
]
levels = [
  "答对 0 道",
  "答对 1 道",
  "答对 2 道",
  "答对 3 道",
  "答对 4 道",
  "答对 5 道",
]

[fam.pass]
q = [
  "第 1 个候选达标了吗？",
  "按门槛，第 1 个候选算不算达标？",
  "第 1 个候选够不够门槛？",
]

[fam.pass.criteria]
true = "达标：第 1 个候选的答对条数不低于门槛"
false = "没达标：第 1 个候选的答对条数低于门槛"

[fam.best]
q = [
  "第几个候选答对最多？",
  "按记录，哪个候选答对的题数最多？",
  "这份记录里最好的候选是第几个？",
]

[fam.gap]
q = [
  "最好的那个候选比第 1 个候选多答对几道？",
  "按记录，最好的候选和第 1 个候选差几道？",
  "第 1 个候选落后最好的那个几道？",
]
levels = [
  "差 2 道",
  "差 4 道",
]

[option.cand]
element = "第 {n} 个候选：{name}"
