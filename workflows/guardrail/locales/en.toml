# English strings for the content-review (guardrail) workflow: labels, field values,
# clause names, body sentence templates, instructions and options.
#
# Conventions (locked by `tests/workflows/guardrail/test_locales.py`):
# - the `[meta]` labels are the anchors the parser looks for: no label may be a prefix of
#   another one, and none of them may collide with the title line;
# - `[sentence.violation]` are the violating sentences, `[sentence.mention]` are the decoy
#   ones: the two groups must not contain each other, because the judges recognise a
#   sentence by **exact line match** (substring matches would break the tie-break rule);
# - `[sentence.wrapper]` holds the three wordings; the criteria state that all three still
#   count as violations, so wrapping never changes an answer;
# - the criteria (severity matrix, six ordered action rules, tie-break rule, two
#   thresholds) are spelled out inside `[fam.*].q`.

[meta]
title = "Content review request"
colon = ":"
content_label = "Content ID"
reach_label = "Reach"
direction_label = "Direction"
audience_label = "Audience"
history_label = "History"
body_label = "Body"

[reach]
single = "one-to-one only"
group = "small group"
public = "public"

[direction]
inbound = "user input"
outbound = "model output"

[audience]
general = "general audience"
minors = "includes minors"

[history]
clean = "no prior violations"
warned = "warned once"
repeat = "multiple prior violations"

[clause]
harass = "personal attack"
meds = "banned medicine"
scam = "fraud"
privacy = "privacy leak"
spam = "spam promotion"
cheat = "cheating service"

[sentence]
filler = [
  "The message was sent in the work group chat.",
  "The message ends with a short greeting.",
]

[sentence.wrapper]
plain = "{s}"
quoted = '"{s}"'
softened = "roughly speaking: {s}"

[sentence.violation]
harass = "The message names a colleague and insults them."
meds = "The message gives a purchase channel and a price for banned medicine."
scam = "The message promises a high return and asks the reader to wire money to a private account."
privacy = "The message posts someone else's ID number and home address."
spam = "The message pastes twenty identical promotion links in a row."
cheat = "The message offers a paid exam-taking service with a price list."

[sentence.mention]
harass = "The message quotes an insult and explicitly tells everyone not to talk like that."
meds = "The message mentions that someone sells banned medicine and says it has been reported."
scam = "The message retells a fraud script in order to warn colleagues about it."
privacy = "The message asks everyone to protect privacy and not to forward ID photos."
spam = "The message asks everyone not to post promotion links and quotes the company policy."
cheat = "The message mentions that someone sat an exam for pay and says the lead went to the exam office."

[fam.action]
q = [
  """How should this content be handled?

Rules (take the first one that matches):
1. audience includes minors AND a high-harm clause is hit -> route to specialists
2. direction is model output AND severity >= 3 -> block
3. reach is public AND severity >= 2 -> block
4. history is multiple prior violations AND severity >= 2 -> block
5. severity >= 2 -> review
6. otherwise -> pass""",
  """Give this content an action.

Ordered rules (first match wins):
1. audience includes minors and a high-harm clause is hit -> route to specialists
2. model output with severity >= 3 -> block
3. public reach with severity >= 2 -> block
4. multiple prior violations with severity >= 2 -> block
5. severity >= 2 -> review
6. otherwise -> pass""",
  """Which handling channel does this content go to?

Rules (first match wins):
1. audience includes minors and a high-harm clause is hit -> route to specialists
2. model output and severity >= 3 -> block
3. public reach and severity >= 2 -> block
4. multiple prior violations and severity >= 2 -> block
5. severity >= 2 -> review
6. otherwise -> pass""",
]

[option.action]
pass = "pass: no block or route rule matched, and severity <= 1"
review = "review: severity >= 2 but the route and block rules did not match"
block = "block: matched model output with severity >= 3, public reach with severity >= 2, or repeat history with severity >= 2"
route = "route to specialists: audience includes minors and a high-harm clause is hit"

[fam.top_clause]
q = [
  """Which clause in this content has the highest harm level?

Harm levels: high = banned medicine / fraud / privacy leak; medium = personal attack / cheating
service; low = spam promotion.
Tie-break: when several clauses share the level, take the one whose sentence appears
**first in the body**; if nothing is violated pick "no clause violated".""",
  """Which clause is the most harmful here?

Levels: banned medicine, fraud and privacy leak are high; personal attack and cheating service
are medium; spam promotion is low.
For a tie, take the clause whose sentence appears first in the body; with no violation pick
"no clause violated".""",
  """Name the heaviest clause in this content.

Levels: high = banned medicine / fraud / privacy leak, medium = personal attack / cheating
service, low = spam promotion.
Break ties by the sentence that appears first in the body; if nothing is violated pick
"no clause violated".""",
]

[option.top_clause]
none = "no clause violated"
harass = "personal attack (medium)"
meds = "banned medicine (high)"
scam = "fraud (high)"
privacy = "privacy leak (high)"
spam = "spam promotion (low)"
cheat = "cheating service (medium)"

[fam.violates]
q = [
  """Does this content violate the "{clause}" clause?

Criteria: only a sentence that *directly does the thing* counts as a violation; sentences that
explicitly discourage it, report it, ask people to protect privacy, or warn about a scam do
**not** count; quoting and a softened tone do **not** change the verdict -- only the facts in
the sentence matter.
The six clauses: personal attack = naming and insulting someone; banned medicine = giving a
purchase channel; fraud = promising a return to get a transfer; privacy leak = posting someone
else's ID number or address; spam promotion = pasting the same promotion links; cheating
service = offering to sit an exam for pay.""",
  """According to the criteria, does this content hit the "{clause}" clause?

Criteria: the sentence must directly do the thing; discouraging, reporting, reminding and
legitimate use do not count; quoting and a softened tone do not change the verdict.
The six clauses: personal attack = naming and insulting; banned medicine = giving a purchase
channel; fraud = promising a return for a transfer; privacy leak = posting an ID number or
address; spam promotion = pasting the same links; cheating service = offering paid exam taking.""",
  """Is the "{clause}" clause violated here?

Criteria: only a sentence that directly does the thing counts; discouraging, reporting,
privacy reminders and legitimate use do not count; quoting and a softened tone do not change
the verdict.
The six clauses: personal attack = naming and insulting someone; banned medicine = giving a
purchase channel; fraud = promising a return for a transfer; privacy leak = posting an ID
number or address; spam promotion = pasting the same links; cheating service = paid exam taking.""",
]
criteria = { true = "yes, by the criteria this violates the \"{clause}\" clause", false = "no, by the criteria this clause is not violated" }

[fam.minor_exposure]
q = [
  """Does this content count as "exposure to minors"?

Criteria: the audience includes minors **and** a medium or high harm clause (personal attack /
cheating service / banned medicine / fraud / privacy leak) is hit; low harm only (spam
promotion) does not count. Note this is broader than action rule 1, which routes only high
harm content to specialists.""",
  """Is this "exposure to minors"?

Criteria: audience includes minors plus a medium or high harm clause; a low harm clause alone
does not count. (Action rule 1 is stricter: only high harm content is routed.)""",
  """Does this content expose minors?

Criteria: audience includes minors and a medium or high harm clause is hit; low harm alone does
not count. Routing to specialists is stricter: only high harm content qualifies.""",
]
criteria = { true = "yes, the audience includes minors and a medium or high harm clause is hit", false = "no, the audience has no minors, or only a low harm clause is hit" }

[fam.repeat_offender]
q = [
  """Does this content make the sender a "repeat offender"?

Criteria: the history is multiple prior violations **and** the severity is >= 2; a single
warning or a clean history never counts.""",
  """Is this a "repeat offender" case?

Criteria: multiple prior violations with severity >= 2; anything else is not a repeat offender.""",
  """Does this content make it a repeat offence?

Criteria: multiple prior violations and severity >= 2; a clean history or a single warning does
not count.""",
]
criteria = { true = "yes, the history has multiple prior violations and severity >= 2", false = "no, the history is not repeated, or severity <= 1" }

[fam.severity]
q = [
  """Assign the severity level of this content.

Criteria (highest harm level x reach):
- low: one-to-one -> 0; small group -> 1; public -> 1
- medium: one-to-one -> 1; small group -> 2; public -> 3
- high: one-to-one -> 2; small group -> 3; public -> 4
No violation at all -> level 0.""",
  """Read the severity off the matrix.

Matrix (highest harm level x reach):
low x one-to-one = 0; low x group = 1; low x public = 1;
medium x one-to-one = 1; medium x group = 2; medium x public = 3;
high x one-to-one = 2; high x group = 3; high x public = 4.
No violation is always level 0.""",
  """What severity level is this content?

Criteria: take the highest harm level among the clauses hit, then look it up by reach --
low (one-to-one 0 / group 1 / public 1), medium (1 / 2 / 3), high (2 / 3 / 4); nothing
violated means level 0.""",
]
levels = [
  "level 0: no violation at all",
  "level 1: minor, small reach or low harm",
  "level 2: moderate, high harm one-to-one or medium harm in a group",
  "level 3: serious, high harm in a group or medium harm in public",
  "level 4: critical, high harm content that is publicly visible",
]
