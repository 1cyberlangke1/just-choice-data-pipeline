# 内容审核（护栏）workflow 的中文文案：标签、字段值、条款名、正文句模板、题面与选项。
#
# 约定（`tests/workflows/guardrail/test_locales.py` 逐条锁住）：
# - `[meta]` 那几个标签是反解的锚点，标签之间不能有前缀关系，也不能和抬头撞车；
# - `[sentence.violation]` 是违规句、`[sentence.mention]` 是擦边句：两组句子必须互不包含
#   （判别器按**整行精确匹配**认句，包含会让「并列取最先出现」这条规则失效）；
# - `[sentence.wrapper]` 是三种措辞的包裹，判据里写明三种都算违规，所以包裹不改答案；
# - 判据（严重度九格、处置六条规则、并列规则、两条分界线）原文写在 `[fam.*].q` 里。

[meta]
title = "内容审核请求"
colon = "："
content_label = "内容号"
reach_label = "传播面"
direction_label = "方向"
audience_label = "受众"
history_label = "历史"
body_label = "正文"

[reach]
single = "仅一对一可见"
group = "小范围群组可见"
public = "公开可见"

[direction]
inbound = "用户输入"
outbound = "模型输出"

[audience]
general = "一般受众"
minors = "含未成年人"

[history]
clean = "无违规记录"
warned = "曾被警告一次"
repeat = "多次违规记录"

[clause]
harass = "人身攻击"
meds = "违禁药品"
scam = "诈骗"
privacy = "隐私泄露"
spam = "垃圾推广"
cheat = "作弊代考"

[sentence]
filler = [
  "这条消息发在工作群里。",
  "消息末尾附了一句日常问候。",
]

[sentence.wrapper]
plain = "{s}"
quoted = "「{s}」"
softened = "大致是这么个意思：{s}"

[sentence.violation]
harass = "消息里指名辱骂了另一位同事。"
meds = "消息里给出了违禁药品的购买渠道和价格。"
scam = "消息里承诺高额回报，让人把钱转到私人账户。"
privacy = "消息里贴出了他人的身份证号和家庭住址。"
spam = "消息里连着刷了二十条同样的推广链接。"
cheat = "消息里提供代考服务并明码标价。"

[sentence.mention]
harass = "消息里引用了一句骂人的话，并明确劝大家不要这样说。"
meds = "消息里提到有人在卖违禁药品，同时写明已经举报。"
scam = "消息里转述了一个诈骗套路，用来提醒同事别上当。"
privacy = "消息里提醒大家保护隐私，不要外传他人的证件照。"
spam = "消息里提醒大家不要发推广链接，并贴出了公司规定。"
cheat = "消息里提到有人代考，并声明已经把线索交给考务部门。"

[fam.action]
q = [
  """按处置规则，这条内容应当怎么处置？

规则（按顺序取第一条命中的）：
① 受众含未成年人且命中高危条款 → 转专项
② 方向是模型输出且严重度 ≥ 3 → 拦截
③ 传播面是公开可见且严重度 ≥ 2 → 拦截
④ 历史是多次违规且严重度 ≥ 2 → 拦截
⑤ 严重度 ≥ 2 → 复核
⑥ 其余 → 放行""",
  """给这条内容一个处置结论。

处置规则（按顺序取第一条命中的）：
① 受众含未成年人且命中高危条款 → 转专项
② 模型输出且严重度 ≥ 3 → 拦截
③ 公开可见且严重度 ≥ 2 → 拦截
④ 多次违规且严重度 ≥ 2 → 拦截
⑤ 严重度 ≥ 2 → 复核
⑥ 其余 → 放行""",
  """这条内容该走哪条处置通道？

规则（按顺序取第一条命中的）：
① 受众含未成年人且命中高危条款 → 转专项
② 模型输出且严重度 ≥ 3 → 拦截
③ 公开可见且严重度 ≥ 2 → 拦截
④ 多次违规且严重度 ≥ 2 → 拦截
⑤ 严重度 ≥ 2 → 复核
⑥ 其余 → 放行""",
]

[option.action]
pass = "放行：没有命中任何拦截或转专项规则，且严重度 ≤ 1"
review = "复核：严重度 ≥ 2，但没命中转专项与拦截那几条规则"
block = "拦截：命中「模型输出且严重度 ≥ 3」「公开可见且严重度 ≥ 2」「多次违规且严重度 ≥ 2」之一"
route = "转专项：受众含未成年人且命中高危条款"

[fam.top_clause]
q = [
  """这条内容里危害级别最高的条款是哪一条？

危害级别：高危 = 违禁药品 / 诈骗 / 隐私泄露；中危 = 人身攻击 / 作弊代考；低危 = 垃圾推广。
并列规则：级别相同时取**正文里最先出现**的那一句所属的条款；一条都没违反就选「没有违反任何条款」。""",
  """哪一条条款的危害级别最高？

级别表：违禁药品、诈骗、隐私泄露是高危；人身攻击、作弊代考是中危；垃圾推广是低危。
若有多条同级，取正文里**最先出现**的那一条；没有违规就选「没有违反任何条款」。""",
  """给出这条内容里最重的那一条条款。

危害级别：高危 = 违禁药品 / 诈骗 / 隐私泄露，中危 = 人身攻击 / 作弊代考，低危 = 垃圾推广。
同级并列时取正文里最先出现的那一条；没有任何违规就选「没有违反任何条款」。""",
]

[option.top_clause]
none = "没有违反任何条款"
harass = "人身攻击（中危）"
meds = "违禁药品（高危）"
scam = "诈骗（高危）"
privacy = "隐私泄露（高危）"
spam = "垃圾推广（低危）"
cheat = "作弊代考（中危）"

[fam.violates]
q = [
  """这条内容是否违反了「{clause}」条款？

判据：只有「消息里直接做了这件事」的句子才算违规；明确劝阻、举报、提醒保护隐私、
提醒别上当这类句子不算违规；加引号引用、语气委婉都**不改变**结论——只看句子里的事实。
六条条款的含义：人身攻击 = 指名辱骂他人；违禁药品 = 提供违禁药品的渠道；
诈骗 = 承诺回报骗取转账；隐私泄露 = 贴出他人证件号或住址；
垃圾推广 = 连续刷同样的推广链接；作弊代考 = 提供代考服务。""",
  """按判据看，内容有没有踩到「{clause}」这一条？

判据：句子必须直接做了这件事才算违规；劝阻、举报、提醒、合规提醒都不算；
引用与委婉语气不影响结论。
六条条款的含义：人身攻击 = 指名辱骂；违禁药品 = 提供购买渠道；诈骗 = 承诺回报骗转账；
隐私泄露 = 贴他人证件号或住址；垃圾推广 = 连续刷推广链接；作弊代考 = 提供代考服务。""",
  """「{clause}」这一条被违反了吗？

判据：直接做这件事才算违规；劝阻、举报、提醒保护、合规用途不算；
引用与委婉语气不改变结论。
六条条款：人身攻击 = 指名辱骂他人；违禁药品 = 提供违禁药品渠道；诈骗 = 承诺回报骗转账；
隐私泄露 = 贴出他人证件号或住址；垃圾推广 = 连续刷同样的推广链接；作弊代考 = 提供代考服务。""",
]
criteria = { true = "是，按判据构成对「{clause}」条款的违反", false = "否，按判据不构成对该条款的违反" }

[fam.minor_exposure]
q = [
  """这条内容是否构成「未成年人暴露」？

判据：受众含未成年人，**且**命中中危或高危条款（人身攻击 / 作弊代考 / 违禁药品 / 诈骗 /
隐私泄露）才算暴露；只命中低危条款（垃圾推广）时不算。
注意这条口径**比处置规则①宽**：处置规则①只对高危内容转专项。""",
  """算不算「未成年人暴露」？

判据：受众含未成年人且命中中危或高危条款才算；只命中低危条款（垃圾推广）不算。
（处置规则①比这更严：只对高危内容转专项。）""",
  """这条内容有没有构成未成年人暴露？

判据：受众含未成年人且命中中危或高危条款才算暴露；命中的都是低危时不算。
转专项的条件比这更严：只有高危内容才转专项。""",
]
criteria = { true = "是，受众含未成年人且命中中危或高危条款", false = "否，受众不含未成年人，或只命中低危条款" }

[fam.repeat_offender]
q = [
  """这条内容是否算「累犯」？

判据：历史是多次违规，**且**严重度 ≥ 2 才算累犯；历史是「曾被警告一次」或「无违规记录」都不算。""",
  """算不算「累犯」？

判据：历史为多次违规且严重度 ≥ 2；其余情况都不算累犯。""",
  """这条内容有没有构成累犯？

判据：历史是多次违规并且严重度 ≥ 2 才算；历史为无违规或曾被警告一次时不算。""",
]
criteria = { true = "是，历史是多次违规且严重度 ≥ 2", false = "否，历史不是多次违规，或严重度 ≤ 1" }

[fam.severity]
q = [
  """给这条内容的严重度定档。

判据（最高危害级别 × 传播面）：
- 低危：仅一对一 → 0 档；小范围群组 → 1 档；公开可见 → 1 档
- 中危：仅一对一 → 1 档；小范围群组 → 2 档；公开可见 → 3 档
- 高危：仅一对一 → 2 档；小范围群组 → 3 档；公开可见 → 4 档
一条都没违反 → 0 档。""",
  """按矩阵给严重度定档。

矩阵（最高危害级别 × 传播面）：
低危 × 仅一对一 = 0；低危 × 群组 = 1；低危 × 公开 = 1；
中危 × 仅一对一 = 1；中危 × 群组 = 2；中危 × 公开 = 3；
高危 × 仅一对一 = 2；高危 × 群组 = 3；高危 × 公开 = 4。
无违规固定 0 档。""",
  """这条内容的严重度是几档？

判据：先取命中条款里最高的危害级别，再乘传播面查表——低危（仅一对一 0 / 群组 1 / 公开 1）、
中危（1 / 2 / 3）、高危（2 / 3 / 4）；一条都没违反就是 0 档。""",
]
levels = [
  "0 档：没有任何违规",
  "1 档：轻微，影响面小或级别低",
  "2 档：中等，一对一的高危或群组的中危",
  "3 档：严重，群组的高危或公开的中危",
  "4 档：极严重，公开可见的高危内容",
]
