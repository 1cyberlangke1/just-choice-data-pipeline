# 多批次排名聚合（siftrank）的中文文案。
# 四个抬头标签两两不互为前缀（反解靠最长前缀认行），由 test_locales.py 锁住。

[meta]
request = "排序请求号"
prompt = "排序提示"
items = "条目清单"
batch = "批次"
sep = "："
list_sep = "、"
arrow = " > "

[flavor]
launch = "找出与「服务上线」最相关的条目"
incident = "找出与「故障排查」最相关的条目"
cost = "找出与「成本优化」最相关的条目"
audit = "找出与「合规审计」最相关的条目"

[item]
overview = "概览说明"
runbook = "操作手册"
changelog = "变更记录"
metrics = "监控指标"
alerts = "告警配置"
postmortem = "复盘报告"

[rules]
lines = [
  "判据（先看条目清单里的先后，再看每个批次里的排名；批次之间没有权重，每个批次一样重要）：",
  "一、每个批次把 4 个条目按相关性从高到低排成一列，最左边的排第 1 名。设一个批次里排了 k 个条目，则第 p 名（p 从 1 起）得 k − p 分。",
  "二、某个条目的总分 = 它在所有批次里得分的总和；没有出现在某个批次里就记 0 分。",
  "三、把条目按总分从高到低排成一列；总分相同时按条目清单里的先后排列（清单顺序只决定「怎么写出来」，不决定「谁更相关」）。",
  "四、问「谁更相关」时：两个条目的总分谁高谁在前；总分相同就是并列（不按清单顺序分先后）。问「排在最前的是哪一个」时：并列按清单顺序取靠前的那个。",
  "五、肘部：把条目按第三条排好后，看相邻两名之间的总分差；差最大的那一处（并列最大取最靠前的一处）就是肘部。肘部左侧（含左侧那个）的条目算「相关」，其余算「不相关」；若所有总分都相同（没有落差），则全部算相关。",
  "  · 相关 1 个：最大落差在第 1 名与第 2 名之间；",
  "  · 相关 2 个：最大落差在第 2 名与第 3 名之间；",
  "  · 相关 3 个：最大落差在第 3 名与第 4 名之间。",
  "六、批次之间「一致」：对每一对同时出现在两个批次里的条目，先后顺序都相同。只要存在一对条目在两个批次里的先后相反，就是「不一致」。",
]

[fam.agg_top]
q = [
  "聚合顺序里排在最前的是哪一个条目？",
  "按判据把这些批次聚合成一条顺序，谁在最前面？",
  "这几个批次聚合之后，哪个条目排第 1？",
]

[fam.pair_order]
q = [
  "条目「{a}」与条目「{b}」，聚合之后谁更相关？",
  "把批次聚合起来看，「{a}」与「{b}」哪个更相关？",
  "「{a}」和「{b}」这两条，聚合顺序里谁在前？",
]
[fam.pair_order.criteria]
a_first = "「{a}」更相关——它的总分比对方高"
b_first = "「{b}」更相关——它的总分比对方高"
tie = "并列——两个条目的总分一样高，不分先后"

[fam.cut_size]
q = [
  "按肘部判据，相关条目有几个？",
  "相关条目数是多少？",
  "肘部把条目分成相关与不相关两段，相关的那一段有几个？",
]
levels = [
  "相关 1 个——最大落差在第 1 名与第 2 名之间",
  "相关 2 个——最大落差在第 2 名与第 3 名之间",
  "相关 3 个——最大落差在第 3 名与第 4 名之间",
]

[fam.stable]
q = [
  "这些批次之间，有没有任何一对条目的先后顺序是相反的？",
  "把四个批次两两对照，出现过互相矛盾的一对吗？",
  "这些批次彼此一致吗——有没有哪一对条目的先后被两个批次写反了？",
]
[fam.stable.criteria]
true = "没有——每一对条目在各批次里的先后都一致"
false = "有——至少有一对条目在两个批次里的先后相反"
