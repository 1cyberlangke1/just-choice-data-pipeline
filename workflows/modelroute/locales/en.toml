lang = "en"
language_name = "English"

[meta]
request_label = "Request"
catalog_label = "Candidate models"
needs_label = "Filter thresholds"
header = "[{title}]"
row_prefix = "- "
none_mark = "none"
paren = " ({text})"
colon = ": "
catalog_columns = "name | provider | window | ability | price | latency"
needs_columns = "window | ability | latency | price | providers down"

[dims]
task_kind = "task kind"
size = "material size"
latency = "latency requirement"
budget = "budget band"
health = "provider health"

[prompt]
intro = "Below is the **feature list of a model-routing request**. Write one realistic user request that matches the list."
bullet = "- {dim}: {brief} ({hint})"
rules = [
  "The request must be **one single line**; no multi-line text, no Markdown fences, no comments",
  "The request must **never name any model or provider** (atlas, borealis, cinder and the like) - which one to use is decided by the candidate table below, not by the request",
  "Do not prefix the request with labels such as \"task kind:\" and do not copy the wording of this list; write the way a real person would",
  "The request must match the task kind, judged by **what the user wants done** (write code / summarize / extract fields / chat / arithmetic / look at an image), not by how big the material is - the material can be long, but wanting to chat is still chatting",
  "The material size shown in the request must fit the size feature: small is a few lines to a paragraph, medium is a few pages, huge is hundreds of pages or a whole repository",
  "Never use real companies, products or dataset names: invent a concrete brand-like or code name of your own — never write placeholder wording such as \"fictional company\"",
  "Write everything in {language}; keep model names, provider names and identifiers in ASCII",
]

[feature.task_kind.code_gen]
brief = "write or change code"
hint = "The request must contain a concrete code snippet or a concrete change to make"

[feature.task_kind.long_summary]
brief = "compress long material into a summary"
hint = "The request must contain a long document or record and ask for **a few sentences summarizing it** (produce wording that is not in the original, rather than picking fields)"

[feature.task_kind.extraction]
brief = "extract fields from material"
hint = "The request must include a piece of material and ask for a few named fields **that are already written in it** (copy values from the original, rather than reorganizing them into a summary)"

[feature.task_kind.chat]
brief = "multi-turn chit-chat or Q&A"
hint = "The request is everyday Q&A or chit-chat: the user wants a few lines of conversation or a specific question - not code work, not field extraction, not compressing material into a summary (the material itself may be long)"

[feature.task_kind.math_reason]
brief = "multi-step math reasoning"
hint = "The request must contain a problem that takes several steps to solve"

[feature.task_kind.vision]
brief = "look at an image"
hint = "The request must mention an image (screenshot / photo / chart) and ask about it"

[feature.size.small]
brief = "tiny, a few lines to a paragraph"
hint = "The material is only a few lines or one short paragraph"

[feature.size.medium]
brief = "medium, a few pages"
hint = "The material runs a few pages to a dozen pages"

[feature.size.huge]
brief = "huge, hundreds of pages or a whole repository"
hint = "The material is hundreds of pages, or an entire codebase or full history"

[feature.latency.interactive]
brief = "must answer right away"
hint = "A user is waiting in an interactive UI; slow is not acceptable"

[feature.latency.batch]
brief = "offline batch job, no rush"
hint = "It runs overnight; slow is fine"

[feature.budget.tight]
brief = "tight budget"
hint = "Prefer cheap; anything pricey is out of the question"

[feature.budget.normal]
brief = "normal budget"
hint = "Price is not the main constraint; a pricier model is acceptable"

[feature.health.all_ok]
brief = "all providers are up"
hint = "Every provider in the table is reachable right now"

[feature.health.atlas_down]
brief = "the atlas provider is down"
hint = "Every model under atlas is currently unreachable"

[feature.health.borealis_down]
brief = "the borealis provider is down"
hint = "Every model under borealis is currently unreachable"

[fam.kind]
q = [
  "What kind of task is this request?",
  "By task kind, which one is this request?",
  "What is this sentence asking to do?",
]

[fam.kind.criteria]
code_gen = "Write or change code"
long_summary = "Compress long material into a summary: produce wording that is not in the original"
extraction = "Extract fields from material: copy out values that are already written in the original"
chat = "Multi-turn chit-chat or Q&A"
math_reason = "Multi-step math reasoning"
vision = "Look at an image"

[fam.route]
q = [
  "Run the request through the candidate table and thresholds: which model should it route to?",
  "After all four thresholds, which candidate should actually run it?",
  "Which candidate wins in the end (none if nothing qualifies)?",
]

[fam.route.criteria]
"atlas-xl" = "Window 200k, ability 3, price 3, latency 3: strongest, priciest and slowest"
"atlas-lite" = "Window 32k, ability 1, price 1, latency 1: cheapest and fastest, lowest ability and window"
"borealis-pro" = "Window 128k, ability 2, price 2, latency 2: mid on all three"
"cinder-mini" = "Window 64k, ability 2, price 1, latency 3: cheap but slowest"
none = "No candidate passes all four thresholds"

[fam.blocked]
q = [
  "Why can the first row of the candidate table (atlas-xl) not be used this time?",
  "atlas-xl was not picked this time; which threshold stopped it?",
  "Which gate does the first candidate fail (usable if it passes all four)?",
]

[fam.blocked.criteria]
usable = "Usable: it passes all four thresholds and its provider is up"
provider_down = "Its provider is down"
latency = "Its latency exceeds the requirement for this request"
budget = "Its price exceeds the budget band for this request"

[fam.cost]
q = [
  "Which price band does the chosen model sit in?",
  "By price band, what does this run cost?",
  "How expensive is the chosen model?",
]
levels = [
  "Band 0: no candidate qualifies, so nothing is spent",
  "Band 1: the chosen model is in the cheapest band",
  "Band 2: the chosen model is in the mid price band",
  "Band 3: the chosen model is in the most expensive band",
]

[fam.slack]
q = [
  "Does the chosen model have at least twice the window this request needs?",
  "Relative to the material size, is the chosen model's window at least double?",
  "By window, does the chosen model have plenty of room (at least twice)?",
]

[fam.slack.criteria]
"true" = "Yes: the window is at least twice the requirement"
"false" = "No: the window is less than twice the requirement, or no model was chosen at all"

[verify]
intro = "Read the routing request below and answer with the given options. Pick exactly one option per question."
state_header = "[Full request]"
questions_header = "[Questions]"
option_line = "   - {name}: {desc}"
