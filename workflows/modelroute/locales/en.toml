# English copy for the model-routing workflow: labels, vocabularies, body templates,
# the policy text and the option descriptions. Shape mirrors zh.toml exactly
# (locked by tests/workflows/modelroute/test_locales.py).

[meta]
title = "Model Routing Desk"
colon = ": "
request_label = "Request"
complexity_label = "Complexity"
latency_label = "Latency budget"
cost_label = "Cost sensitivity"
retry_label = "Attempt record"
data_label = "Data class"
body_label = "Body"

[complexity]
low = "low"
mid = "mid"
high = "high"

[latency]
relaxed = "relaxed"
normal = "normal"
strict = "strict"

[cost]
normal = "not sensitive"
tight = "sensitive"

[retry]
first = "no failure recorded yet"
retry = "already failed once"

[data]
public = "public"
private = "private"

[body]
classify = "Please categorize this operations log into one of the existing labels."
extract = "Please extract the sender, date and amount from this email into a form."
codefix = "This test is red, so find the defect in the code and fix it."
reason = "Work through this multi-step reasoning problem and give the final answer."

[task_phrase]
classify = "categorize"
extract = "extract"
codefix = "defect"
reason = "multi-step reasoning"

[policy]
text = "Tier table (cost/power/speed/window, all scored 1~4, higher speed means faster): nano 1/1/3/1; mini 2/2/4/2; core 3/3/2/3; max 4/4/1/3. Power required by task: categorize 1, extract 2, defect 3, multi-step reasoning 4. Preferred tier = the lowest tier matching the required power: categorize -> nano, extract -> mini, defect -> core, multi-step reasoning -> max. Escalation chain = one tier up in power (nano -> mini -> core -> max); nothing sits above max, so there is no escalation chain. Only a request that already failed once may escalate; a first request never escalates. Reasoning depth follows the complexity level (low/mid/high): shift one step up when the latency budget is relaxed, one step down when it is strict, and stop at the ends. When cost sensitivity is on, dropping one power level is allowed. A request whose data class is private is never cached."

[fam.tier]
q = [
  "Which tier is the preferred tier for this request?",
  "Given the required power, which tier should this request pick?",
  "Which tier should this request try first?",
]

[fam.next]
q = [
  "One stop up the escalation chain from the preferred tier, which tier comes next?",
  "If the preferred tier fails, which tier do we escalate to?",
  "Which tier is the next stop on this request escalation chain?",
]

[fam.effort]
q = [
  "Which reasoning depth should this request use?",
  "Given complexity and latency budget, which reasoning depth applies?",
  "How deep should the reasoning be for this request?",
]

[fam.is_first]
q = [
  "Is this a first attempt for this request?",
  "Does this request have any failure recorded before it?",
  "Does this request count as a first try?",
]

[fam.is_first.criteria]
true = "Yes: no failure recorded yet"
false = "No: it already failed once"

[fam.degrade]
q = [
  "May this request drop one power level?",
  "When cost matters, may this request drop one power level?",
  "Should this request trade one power level for cost?",
]

[fam.degrade.criteria]
true = "Allowed: cost sensitivity is on, one power level may be dropped"
false = "Not allowed: cost sensitivity is off, no need to drop power"

[fam.cache]
q = [
  "May this request be cached?",
  "Is this request suitable for the cache?",
  "Can the result of this request be cached?",
]

[fam.cache.criteria]
true = "Yes: the data class is public"
false = "No: the data class is private"

[option.tier]
nano = "nano (cost 1 / power 1 / speed 3 / window 1)"
mini = "mini (cost 2 / power 2 / speed 4 / window 2)"
core = "core (cost 3 / power 3 / speed 2 / window 3)"
max = "max (cost 4 / power 4 / speed 1 / window 3)"

[option.next]
mini = "mini (cost 2 / power 2 / speed 4 / window 2)"
core = "core (cost 3 / power 3 / speed 2 / window 3)"
max = "max (cost 4 / power 4 / speed 1 / window 3)"

[option.effort]
low = "low: shallow reasoning"
mid = "mid: regular reasoning"
high = "high: deep reasoning"
