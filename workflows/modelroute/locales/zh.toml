lang = "zh"
language_name = "简体中文"

[meta]
request_label = "请求"
catalog_label = "候选模型"
needs_label = "筛选门槛"
header = "【{title}】"
row_prefix = "- "
none_mark = "无"
paren = "（{text}）"
colon = "："
catalog_columns = "名字 | 提供方 | 窗口 | 能力 | 价格 | 时延"
needs_columns = "窗口 | 能力 | 时延 | 价格 | 挂掉的提供方"

[dims]
task_kind = "任务类型"
size = "材料规模"
latency = "时延要求"
budget = "预算档"
health = "提供方健康"

[prompt]
intro = "下面是一条**模型路由请求的特征清单**。请按清单写出一句真实的用户请求。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "「请求」必须是**一句话、单行**；不要写多行，不要用 Markdown 围栏，也不要写注释",
  "请求里**不许出现任何模型名或提供方名**（atlas、borealis、cinder 这类）——该选哪个由后面的候选表决定，不是请求说了算",
  "请求里不要写「任务类型：」这种字段名前缀，也不要照抄清单的措辞；要用真人会说的话",
  "请求必须与「任务类型」一致，判断依据是**用户想让你做什么**（写代码 / 压摘要 / 抽字段 / 闲聊 / 算术 / 看图），不是材料有多大——材料可以很长，想要的是闲聊就还得是闲聊",
  "请求里体现的材料规模要与「材料规模」相称：小档只有几行到一段，中档几页，大档上百页或整个代码库",
  "不要写真实存在的公司、产品或数据集名字：自己造一个品牌名或代号来指代（像自造专有名词那样），别把「虚构 / 虚拟」当成名字本身写进去",
  "全部用{language}写；模型名、提供方名与标识符保持 ASCII",
]

[feature.task_kind.code_gen]
brief = "写或改代码"
hint = "请求里要出现具体的代码片段或明确的改动要求"

[feature.task_kind.long_summary]
brief = "把长材料压成摘要"
hint = "请求里要出现一份很长的文档或记录，并要求**用几句话概括它**（写出一段原文里没有的概括文字，不是挑字段）"

[feature.task_kind.extraction]
brief = "从材料里抽字段"
hint = "请求里要给出一段材料，并要求抽出**其中已经写着的**几个字段（照抄原文里的值，不是重新组织成摘要）"

[feature.task_kind.chat]
brief = "多轮闲聊问答"
hint = "请求是日常问答或闲聊：用户想要的是聊几句或问个具体问题，不是写代码、不是抽字段、也不是把材料压成摘要（材料本身可以很长）"

[feature.task_kind.math_reason]
brief = "多步数学推理"
hint = "请求里要有一道得算好几步才能得出答案的题"

[feature.task_kind.vision]
brief = "看图"
hint = "请求里要出现一张图片（截图 / 照片 / 图表），并要求根据图片回答"

[feature.size.small]
brief = "很小，几行到一段"
hint = "材料只有几行字或一小段"

[feature.size.medium]
brief = "中等，几页"
hint = "材料有几页到十几页"

[feature.size.huge]
brief = "很大，上百页或整库"
hint = "材料有上百页，或者是一整个代码库、全部历史记录"

[feature.latency.interactive]
brief = "要马上出结果"
hint = "用户在交互界面里等着，慢一点就不行"

[feature.latency.batch]
brief = "离线批处理，不着急"
hint = "夜里跑批，慢一点没关系"

[feature.budget.tight]
brief = "预算很紧"
hint = "尽量用便宜的，价格偏高的模型一律不考虑"

[feature.budget.normal]
brief = "预算正常"
hint = "价格不是主要限制，能接受偏贵的模型"

[feature.health.all_ok]
brief = "提供方都正常"
hint = "目录里的提供方现在都调得通"

[feature.health.atlas_down]
brief = "atlas 这个提供方挂了"
hint = "atlas 名下的模型现在全都调不通"

[feature.health.borealis_down]
brief = "borealis 这个提供方挂了"
hint = "borealis 名下的模型现在全都调不通"

[fam.kind]
q = [
  "这句请求属于哪一类任务？",
  "按任务类型分，这句请求是哪一种？",
  "这句话要做的是一件什么事？",
]

[fam.kind.criteria]
code_gen = "写或改代码"
long_summary = "把长材料压成摘要：产出一段**原文里没有的**概括文字"
extraction = "从材料里抽字段：把**原文里已经写着**的几个值照抄出来"
chat = "多轮闲聊问答"
math_reason = "多步数学推理"
vision = "看图"

[fam.route]
q = [
  "按候选表与门槛筛一遍，这条请求该路由到哪个模型？",
  "四道门槛过完，最终应该用哪个候选来跑？",
  "最后选中哪个候选（一个都不满足就是 none）？",
]

[fam.route.criteria]
"atlas-xl" = "窗口 200k、能力 3 档、价格 3 档、时延 3 档：最强也最贵最慢"
"atlas-lite" = "窗口 32k、能力 1 档、价格 1 档、时延 1 档：最便宜也最快，能力与窗口最低"
"borealis-pro" = "窗口 128k、能力 2 档、价格 2 档、时延 2 档：三档都居中"
"cinder-mini" = "窗口 64k、能力 2 档、价格 1 档、时延 3 档：便宜但最慢"
none = "没有任何候选同时过得了全部四道门槛"

[fam.blocked]
q = [
  "候选表第一行（atlas-xl）这次为什么不能用？",
  "atlas-xl 这次没被选上，是卡在哪一关？",
  "第一行候选过不了哪道门槛（四道都过就是 usable）？",
]

[fam.blocked.criteria]
usable = "能用：四道门槛都过，提供方也没挂"
provider_down = "它的提供方挂了"
latency = "它的时延超过了这次的时延要求"
budget = "它的价格超过了这次的预算档"

[fam.cost]
q = [
  "选中模型的价格是第几档？",
  "按价格档算，这次要花的是哪一档？",
  "选中模型的贵贱属于哪一档？",
]
levels = [
  "0 档：没有可用候选，也就没有花费",
  "1 档：选中的模型是最便宜的一档",
  "2 档：选中的模型是中等价格的一档",
  "3 档：选中的模型是最贵的一档",
]

[fam.slack]
q = [
  "选中的模型，窗口有没有至少两倍于本次需求的富余？",
  "相对这次的材料规模，选中模型的窗口富余够不够两倍？",
  "按窗口算，选中的模型是不是绰绰有余（至少两倍）？",
]

[fam.slack.criteria]
"true" = "有：窗口至少是需求的两倍"
"false" = "没有：窗口不到需求的两倍，或者压根没选中模型"

[verify]
intro = "读下面这条路由请求，按给定的选项判断。每道题只选一个。"
state_header = "【请求全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"
