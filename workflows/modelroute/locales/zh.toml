# 模型路由与降级 workflow 的中文文案：标签、词表、正文模板、判据原文与选项描述。
#
# 约定（由 tests/workflows/modelroute/test_locales.py 锁住）：
# - 画像每一格都有自己的标签，反解按标签认行；
# - 各语言的标签互不重叠（`reparse` 用合并表做语言无关的反解）；
# - 判据（档位表 / 首选档表 / 升级链 / 挪档表 / 成本与缓存规则）整段写进每道题的题面，
#   只读 state 与题面的读者必须能自己把答案算出来。

[meta]
title = "模型路由台"
colon = "："
request_label = "请求号"
complexity_label = "复杂度"
latency_label = "延迟预算"
cost_label = "成本敏感"
retry_label = "尝试记录"
data_label = "数据分级"
body_label = "正文"

[complexity]
low = "低"
mid = "中"
high = "高"

[latency]
relaxed = "宽松"
normal = "常规"
strict = "紧"

[cost]
normal = "不敏感"
tight = "敏感"

[retry]
first = "还没有失败记录"
retry = "已经失败过一次"

[data]
public = "公开"
private = "私有"

# 正文模板：任务类型只活在这里（画像没有「任务类型」那一栏），
# 每个模板里都埋着 `[task_phrase]` 的那个短语，判别器靠它把任务认回来。
[body]
classify = "把这段运维日志归类到一个标签上。"
extract = "把这封邮件里的寄件人、日期和金额抽取出来填表。"
codefix = "这段测试红了，找出代码里的缺陷并改掉。"
reason = "把这套多步推理题一步步解出来，给出最终结论。"

[task_phrase]
classify = "归类"
extract = "抽取"
codefix = "缺陷"
reason = "多步推理"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "档位表（成本/能力/速度/窗口，均 1~4 分，速度越大越快）：nano 1/1/3/1；mini 2/2/4/2；core 3/3/2/3；max 4/4/1/3。任务能力需求：归类 1、抽取 2、缺陷 3、多步推理 4。首选档位 = 能力需求对应的最低档：归类 → nano、抽取 → mini、缺陷 → core、多步推理 → max。升级链 = 首选档之上按能力加一档（nano → mini → core → max）；max 之上没有档，所以没有升级链。只有已经失败过一次的请求才允许升级，首次请求不升级。推理深度按复杂度档取（低/中/高）：延迟宽松时上挪一档、延迟紧时下挪一档，到顶或触底不再挪。成本敏感时允许降一档能力。数据分级为私有的请求不进缓存。"

[fam.tier]
q = [
  "这条请求的首选档位是哪个？",
  "按能力需求，这条请求该选哪个档位？",
  "这条请求应当先用哪一档？",
]

[fam.next]
q = [
  "升级链上，首选档之后的一站是哪个档？",
  "首选档失败后，接着升到哪个档？",
  "这条请求的升级链下一站是哪个档？",
]

[fam.effort]
q = [
  "这条请求的推理深度该定在哪一档？",
  "按复杂度与延迟预算，推理深度取哪一档？",
  "这条请求该用多深的推理？",
]

[fam.is_first]
q = [
  "这条请求是首次请求吗？",
  "这条请求之前有没有失败记录？",
  "这条请求算不算首次尝试？",
]

[fam.is_first.criteria]
true = "是：之前没有任何失败记录"
false = "不是：已经失败过一次"

[fam.degrade]
q = [
  "这条请求是否允许降一档能力？",
  "成本敏感的话，这条请求允许降一档能力吗？",
  "这条请求要不要为了省钱降一档能力？",
]

[fam.degrade.criteria]
true = "允许：成本敏感，可以降一档能力换成本"
false = "不允许：成本不敏感，不必降能力"

[fam.cache]
q = [
  "这条请求可以进缓存吗？",
  "这条请求适合走缓存吗？",
  "这条请求的结果能不能缓存起来？",
]

[fam.cache.criteria]
true = "可以：数据分级是公开"
false = "不可以：数据分级是私有"

[option.tier]
nano = "nano（成本 1 / 能力 1 / 速度 3 / 窗口 1）"
mini = "mini（成本 2 / 能力 2 / 速度 4 / 窗口 2）"
core = "core（成本 3 / 能力 3 / 速度 2 / 窗口 3）"
max = "max（成本 4 / 能力 4 / 速度 1 / 窗口 3）"

[option.next]
mini = "mini（成本 2 / 能力 2 / 速度 4 / 窗口 2）"
core = "core（成本 3 / 能力 3 / 速度 2 / 窗口 3）"
max = "max（成本 4 / 能力 4 / 速度 1 / 窗口 3）"

[option.effort]
low = "低：浅推理"
mid = "中：常规推理"
high = "高：深推理"
