lang = "zh"
language_name = "简体中文"

# 查询里不许出现的话术：候选表与选源口径归代码渲染，那句查询再谈一遍这张表就是两边抢同一件事。
# 只收**高精度**短语——宁可漏检也不误判，误判会在渲染期白拒一条本来能用的数据。
# 特意**不收**「官方 / 最新 / 最全」这类词：它们正是「首要要求」在自然语言里的正常说法，
# 收进来等于把这道题唯一要读的那句话堵死。
# 收「虚构 / 虚拟 + 项目/公司/产品/指标/名称/平台/技术」这一串**组合词**：真机 `batch-sourceselect-zh`
# 10 条里有 4 条把提示词那句「一律用虚构的名字」读成了字面占位名（`虚构指标Y` / `虚构项目Alpha` /
# `虚拟技术`）——那是数据损坏，不是措辞问题。只收组合词不收单字：`虚拟化技术` 这种正常说法不撞。
# 2026-10-03 补一组**元话术**：`sourceselect-4x-zh` 21 条合格样本里逐条读过，有 3 条正文压根不是
# 查询——模型在写「我要输出什么」（`我需要输出一个查询字符串…` / `根据以上要求，我会写出…`），
# 还夹着没填的占位名（`品牌名称` / `某某公司`）。判据本来就要求「反解回注入的首要要求」，
# 这种元话术照样能反解成功，所以必须在渲染期按字面拦下。
banned_intent_phrases = [
  "候选来源",
  "来源表",
  "序号",
  "|",
  "虚构项目",
  "虚构公司",
  "虚构产品",
  "虚构指标",
  "虚构名称",
  "虚构平台",
  "虚构技术",
  "虚拟项目",
  "虚拟公司",
  "虚拟产品",
  "虚拟指标",
  "虚拟名称",
  "虚拟平台",
  "虚拟技术",
  "我需要输出",
  "我会写出",
  "根据以上要求",
  "根据上述要求",
  "请参考示例",
  "示例格式",
  "你现在扮演",
  "用户助手",
  "品牌名称",
  "某某公司",
]

[meta]
query_label = "查询"
sources_label = "候选来源"
rules_label = "选源口径"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
sources_columns = "序号 | 类型 | 时效 | 覆盖度"
row_ref = "第 {n} 行"

[rules.filter]
text = "先看查询的首要要求落在哪一项：要权威就只留「类型 = official」的行、要最新就只留「时效 = fresh」的行、要覆盖最全就只留「覆盖度 = full」的行。"

[rules.rank]
text = "幸存的行不止一条时，依次比 类型（official > community > unknown）→ 时效（fresh > recent > stale）→ 覆盖度（full > partial > none）→ 表里序号靠前的，取第一个。"

[rules.abstain]
text = "一条幸存的行都没有时，答案是「都不合适」，不许将就。"

[dims]
need = "首要要求"

[prompt]
intro = "下面是一次找资料的场景。请写出**一句查询**（一行），说清在找什么、以及对来源的要求。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "只写**一句**查询，一行；不要换行，不要用 Markdown 围栏，也不要复述这段说明（别写「请写一句查询」这类指令词）",
  "不要谈候选来源表：不要写「候选来源 / 来源表 / 序号」这类词，也不要出现竖线",
  "对来源的要求要一眼看得出来，而且**只写这一项**：不要在同一句里把另外两项也写进去（比如「权威、最新、最全」一起要）——同时提到就分不出首要要求，这条样本就作废了",
  "「要权威」那一档：写成在找**一手口径**（官方文档、标准原文、原始公告）",
  "「要最新」那一档：写成在找**最近的**东西（最新版本、最近的进展）",
  "「要覆盖最全」那一档：写成在找**把这件事讲全的汇总**（完整清单、全量对照）",
  "不要写真实存在的公司、产品或代码库名字：自己造一个品牌名或代号来指代它（像自造专有名词那样），别把「虚构 / 虚拟」当成名字写进查询",
  "全部用{language}写",
]

[feature.need.authority]
brief = "这次想找的是**一手口径**"
hint = "写成像是在找官方文档、标准原文或原始公告"

[feature.need.freshness]
brief = "这次想找的是**最近的**东西"
hint = "写成像是在找最新版本或最近的进展"

[feature.need.coverage]
brief = "这次想找的是**把这件事讲全的汇总**"
hint = "写成像是在找完整清单或全量对照"

[verify]
intro = "下面是一道「来源选择」题。请只按字面反解：这句查询对来源的首要要求是哪一项。"
state_header = "【题面全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"

[fam.need]
q = [
  "这句查询对来源的首要要求是哪一项？",
  "按查询的措辞，它最看重来源的哪一项？",
  "这句话把要求压在哪一项上？",
]
[fam.need.criteria]
authority = "要权威：想要一手、官方的口径"
freshness = "要最新：想要最近的进展或版本"
coverage = "要覆盖最全：想要把这件事讲全的汇总"

[fam.pick]
q = [
  "按选源口径，该用哪一个来源？",
  "这份候选表里，该挑哪一行？",
  "应该把哪一行作为这次要用的来源？",
]
[fam.pick.opt]
none = "都不合适：一条符合首要要求的都没有"

[fam.enough]
q = [
  "表里有没有一条符合首要要求的来源？",
  "这张候选表里，存在达标的那一行吗？",
  "按首要要求筛一遍，筛得出东西吗？",
]
[fam.enough.criteria]
true = "有：至少有一条在首要要求那一项上达标"
false = "没有：一条达标的都没有"

[fam.cover]
q = [
  "选中的那一条来源，覆盖度是第几档？",
  "该用的那一行，覆盖度落在哪一档？",
  "按选源口径选中后，它的覆盖档是几？",
]
levels = [
  "0 档：几乎没有覆盖（none）",
  "1 档：只覆盖一部分（partial）",
  "2 档：覆盖完整（full）",
]

[fam.near_miss]
q = [
  "表里有没有一条「只差首要要求那一项、其余两项都最好」的来源？",
  "这张表里，有没有一条只要首要要求满足就能用的来源？",
  "除首要要求那一项外，其余两项都取到最高档的行存在吗？",
]
[fam.near_miss.criteria]
true = "有：有一条只差首要要求那一项"
false = "没有：除首要要求那一项外，还至少差一项"
