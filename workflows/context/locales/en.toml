# English strings for the session context compaction workflow.
# Invariants locked by tests/workflows/context/test_locales.py: the same key set as zh,
# per-language labels that never overlap across languages, and a **shared** block separator
# (the merged table used by `reparse` splits the header with a single separator).

[meta]
title = "Context Compaction Desk"
colon = ": "
session_label = "Session"
budget_label = "Budget"
task_label = "Current task"
token_unit = "tokens"
block_sep = " · "
content_indent = "    "
task_text = "add failure retries to the payment module"

[kind]
ask = "user question"
read = "file read"
run = "command output"
err = "error"

[size]
small = "small"
big = "big"

[age]
recent = "last turn"
old = "seven turns ago"

[topic]
same = "same topic"
other = "another topic"

# Body templates keyed by "kind_size_age_topic". The four-tuple is unique within a session,
# so no two body lines in one screen can be identical. Same-topic blocks talk about retries,
# other-topic blocks talk about the export script or the report.
[content]
ask_small_recent_same = "The user asks: should the retry live in the caller or the callee?"
ask_small_recent_other = "The user asks: is the export script's encoding issue still around?"
ask_small_old_same = "The user asks: should the retry count be a config option?"
ask_small_old_other = "The user asks: was the report's definition updated?"
ask_big_recent_same = "The user pastes a payment callback timeout log and asks how the retry should be designed."
ask_big_recent_other = "The user pastes a long error write-up about the export script and asks how to unify encodings."
ask_big_old_same = "The user pastes a long background note on retry strategy and asks which backoff to pick."
ask_big_old_other = "The user pastes a long report requirement and asks how to define it."
read_small_recent_same = "Read the top of src/pay.py; only the retry function came back."
read_small_recent_other = "Read the top of tools/export.py; only the encoding lines came back."
read_small_old_same = "Read config/retry.yaml; just 12 lines of config."
read_small_old_other = "Read the top of docs/report.md."
read_big_recent_same = "Read all of src/pay.py, 412 lines; the retry logic is in there."
read_big_recent_other = "Read all of tools/export.py, 380 lines."
read_big_old_same = "Read all of src/retry.py, 260 lines; the backoff strategy is in there."
read_big_old_other = "Read all of docs/report_spec.md, 300 lines."
run_small_recent_same = "Ran the retry unit tests; 12 lines of output."
run_small_recent_other = "Ran a smoke test of the export script; 9 lines of output."
run_small_old_same = "Ran the backoff comparison script; 15 lines of output."
run_small_old_other = "Ran a report sampling job; 7 lines of output."
run_big_recent_same = "Ran the full test suite; 900-odd lines, the retry ones are at the top."
run_big_recent_other = "Ran the whole export pipeline; 800-odd lines of output."
run_big_old_same = "Ran a load test; 1200 lines, every retry count is in there."
run_big_old_other = "Ran a full report generation; 1100 lines of output."
err_small_recent_same = "The command failed; the trace is only 3 lines."
err_small_recent_other = "The export script failed; the trace is only 4 lines."
err_small_old_same = "The retry script failed; the trace is only 2 lines."
err_small_old_other = "The report script failed; the trace is only 5 lines."
err_big_recent_same = "The command failed; the trace carries 80 lines of context."
err_big_recent_other = "The export script failed; the trace carries 90 lines of context."
err_big_old_same = "The retry script failed; the trace carries 70 lines of context."
err_big_old_other = "The report script failed; the trace carries 60 lines of context."

[policy]
# The criteria text: appended to every question (paradigm §9.8).
text = "Compaction table (three rules, judged in order): 1) an error block is always kept as is, whatever its age, size or topic; 2) a block on another topic (a topic different from the current task) is always dropped; 3) every other block on the same topic goes by age and size - from the last turn, small is kept as is and big is truncated; from seven turns ago, small is digested and big is dropped. Sizes: small = 180 tokens, big = 1600 tokens. Cost of each handling: kept as is costs its own size (180 / 1600), truncation costs 800 tokens, digest costs 60 tokens, drop costs 0. Adding up the five blocks' costs gives the total after compaction; if the total is strictly above the budget the session needs more compaction, if it is exactly the budget it does not."

[fam.action]
q = [
  "How should block {n} be handled?",
  "Under the compaction table, which handling does block {n} get?",
  "What should happen to block {n}?",
]

[fam.compact]
q = [
  "After applying the compaction table, does this session need more compaction?",
  "Does the total after compaction exceed the budget?",
  "Should this session be compacted further?",
]

[fam.compact.criteria]
true = "Yes: the total after compaction is strictly above the budget"
false = "No: the total after compaction does not exceed the budget"

[fam.spot]
q = [
  "Which block is the one that gets dropped?",
  "Which block does the compaction table drop?",
  "Which block will be dropped?",
]

[fam.top]
q = [
  "After compaction, which block takes up the most tokens?",
  "Which block ends up taking the most room?",
  "Which block holds the most tokens after compaction?",
]

[option.action]
keep = "keep as is (costs its own size, 180 / 1600)"
trim = "truncate to 800 tokens"
digest = "digest into a summary (costs 60 tokens)"
drop = "drop (costs 0)"

[option.position]
block = "block {n}: {kind} · {size} · {age} · {topic}"
