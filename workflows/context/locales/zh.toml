[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "处置表（三条规则按顺序判）：一、报错块一律原样保留，不管它的年龄、大小、主题；二、与当前任务不同主题（另一个主题）的块一律丢弃；三、与当前任务同一主题的其余块按年龄与大小——最近一轮的小块原样保留、最近一轮的大块截断、七轮之前的小块压成摘要、七轮之前的大块丢弃。尺寸：小 = 180 token，大 = 1600 token。处置开销：原样保留按原大小计（小 180 / 大 1600），截断记 800 token，压成摘要记 60 token，丢弃记 0。把五个块的开销加起来就是处置后的总账；总账严格超过预算就要再压缩，刚好等于预算则不必。"

[fam.action]
q = [
  "第 {n} 块该怎么处置？",
  "按处置表，第 {n} 块该走哪一档？",
  "第 {n} 块应当被怎么处理？",
]

[fam.compact]
q = [
  "按处置表算完，这次会话还需要再压缩吗？",
  "处置之后的总账超过预算了吗？",
  "这次会话要不要继续压缩？",
]

[fam.compact.criteria]
true = "需要：处置后的总账严格超过预算"
false = "不需要：处置后的总账没有超过预算"

[fam.spot]
q = [
  "被丢弃的那一块是第几块？",
  "处置表里会被丢掉的是第几块？",
  "哪一块会被丢弃？",
]

[fam.top]
q = [
  "处置之后占用 token 最多的是第几块？",
  "处置后最占地方的是哪一块？",
  "哪一块处置后占的 token 最多？",
]

[option.action]
keep = "原样保留（按原大小计，小 180 / 大 1600）"
trim = "截断到 800 token"
digest = "压成摘要（记 60 token）"
drop = "丢弃（记 0）"

[option.position]
block = "第 {n} 块：{kind} · {size} · {age} · {topic}"
