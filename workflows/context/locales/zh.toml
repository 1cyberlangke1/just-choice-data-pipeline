# 会话上下文压缩 workflow 的中文文案：标签、词表、正文模板、判据原文与选项描述。
#
# 约定（由 tests/workflows/context/test_locales.py 锁住）：
# - 抬头行四格各有自己的词表，反解按分隔符切格后查表；
# - 各语言的标签互不重叠，分隔符则**必须一致**（`reparse` 用合并表做语言无关的反解）；
# - 判据（处置表 / 尺寸 / 开销 / 预算比较）整段写进每道题的题面，只读 state 与题面的
#   读者必须能自己把答案算出来。

[meta]
title = "会话压缩台"
colon = "："
session_label = "会话号"
budget_label = "预算"
task_label = "当前任务"
token_unit = "token"
block_sep = " · "
content_indent = "    "
task_text = "给支付模块补上失败重试"

[kind]
ask = "用户提问"
read = "读文件结果"
run = "命令输出"
err = "报错"

[size]
small = "小"
big = "大"

[age]
recent = "最近一轮"
old = "七轮之前"

[topic]
same = "同一主题"
other = "另一个主题"

# 正文模板：键是「类型_大小_年龄_主题」。四元组在一段会话里两两不同，所以同一屏里
# 不会出现两行一模一样的正文。同一主题的块讲重试，另一个主题的块讲导出脚本或报表。
