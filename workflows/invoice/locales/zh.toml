# 单据 workflow 的中文文案：字段标签（正名 + 别名）、明细表列、问法、选项、词表。
#
# 约定（由 tests/workflows/invoice/test_locales.py 锁住）：
# - 每个字段至少两个标签（正名 + 别名），别名与正名不能相同；
# - 各语言的标签互不重叠（`reparse` 用合并表做语言无关的反解）；
# - 三种日期格式必须**年在前**（反解按「四位年 + 月 + 日」的顺序读）；
# - 词表长度不小于 spec.WORD_POOL，否则 spec 里的下标取不到。

[meta]
title = "费用结算单据"
intro = "兹有以下单据信息"
items_title = "明细"
note_label = "备注"
note_value = "请于到期日前完成付款"
# 标点由语言文件给：英文单据不该出现「：」「；」这类中文标点。
colon = "："
sep = "；"

[money]
tpl = "{symbol}{amount}"

[rate]
tpl = "{rate}%"

[date.dashed]
tpl = "{y:04d}-{m:02d}-{d:02d}"

[date.slashed]
tpl = "{y:04d}/{m:02d}/{d:02d}"

[date.dotted]
tpl = "{y:04d}.{m:02d}.{d:02d}"

[currency.cny]
symbol = "¥"

[currency.usd]
symbol = "$"

[currency.eur]
symbol = "€"

[field.doc]
labels = ["单据号", "票号"]

[field.po]
labels = ["采购单号", "订单编号"]

[field.contract]
labels = ["合同号", "合同编号"]

[field.issue]
labels = ["开票日期", "出票日期"]

[field.due]
labels = ["到期日", "最后付款日"]

[field.received]
labels = ["收件日期", "签收日期"]

[field.issuer]
labels = ["开票方", "销售方"]

[field.payer]
labels = ["付款方", "购买方"]

[field.ship_to]
labels = ["收货方", "送达方"]

[field.handler]
labels = ["经办人", "跟单人"]

[field.subtotal]
labels = ["小计", "未税合计"]

[field.shipping]
labels = ["运费", "物流费"]

[field.tax_rate]
labels = ["税率", "税点"]

[field.tax]
labels = ["税额", "税金"]

[field.total]
labels = ["总计", "价税合计"]

[column.name]
labels = ["品名", "项目"]

[column.qty]
labels = ["数量", "件数"]

[column.unit]
labels = ["单价", "单位价格"]

[column.amount]
labels = ["金额", "行金额"]

[ask.doc]
q = ["单据号是哪一项？", "这份单据的单据号是哪一个？", "哪一项写的是单据号？"]

[ask.po]
q = ["采购单号是哪一项？", "单据上的采购单号是哪一个？", "哪一项写的是采购单号？"]

[ask.contract]
q = ["合同号是哪一项？", "单据上的合同号是哪一个？", "哪一项写的是合同号？"]

[ask.issue]
q = ["开票日期是哪一项？", "单据上写的开票日期是哪一个？", "哪一项是开票日期？"]

[ask.due]
q = ["到期日是哪一项？", "单据上写的到期日是哪一个？", "哪一项是到期日？"]

[ask.received]
q = ["收件日期是哪一项？", "单据上写的收件日期是哪一个？", "哪一项是收件日期？"]

[ask.issuer]
q = ["开票方是哪一家？", "单据上的开票方是哪一个？", "哪一项是开票方？"]

[ask.payer]
q = ["付款方是哪一家？", "单据上的付款方是哪一个？", "哪一项是付款方？"]

[ask.ship_to]
q = ["收货方是哪一家？", "单据上的收货方是哪一个？", "哪一项是收货方？"]

[ask.subtotal]
q = ["小计是多少？", "单据上的小计是哪一个金额？", "哪一项是小计金额？"]

[ask.shipping]
q = ["运费是多少？", "单据上的运费是哪一个金额？", "哪一项是运费？"]

[ask.tax]
q = ["税额是多少？", "单据上的税额是哪一个金额？", "哪一项是税额？"]

[ask.total]
q = ["总计是多少？", "单据上的总计是哪一个金额？", "哪一项是总计金额？"]

[ask.line_unit]
q = ["第 {n} 行的单价是多少？", "第 {n} 行的单位价格是哪一个？", "明细里第 {n} 行每件多少钱？"]

[fam.subtotal_consistent]
q = ["明细各行金额之和是否等于小计？", "小计与明细金额之和一致吗？", "把明细金额加起来，和小计相等吗？"]
criteria = { "true" = "相等", "false" = "不相等" }

[fam.tax_consistent]
q = ["税额是否等于小计乘以税率？", "税额与「小计 × 税率」的结果一致吗？", "按小计和税率算出来的税额，与单据上的税额相等吗？"]
criteria = { "true" = "相等", "false" = "不相等" }

[fam.bad_lines]
q = ["有几行的「数量 × 单价」与金额对不上？", "明细里有多少行的金额与数量乘单价的乘积不一致？", "按数量乘单价来算，几行的金额是错的？"]
levels = ["0 行", "1 行", "2 行", "3 行及以上"]

