# 字幕对质检（subqa）workflow 的中文文案。
#
# 输入：`workflows.subqa.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 三个抬头标记两两不互为前缀（`tag_mark` / `rule_mark` / `content_mark`）；
# - `[state.threshold]` 与 `[fam.act.opt]` 的键都与 `features.ACTS` 一一对应；
# - `[tag.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[track.*]` 的键与 `features.TRACKS` 一一对应；
# - 每条判据的 `avoid` 都不许误触**别的**判据（`test_locales` 会逐条扫）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"
#: `Source:` 那一行用的语言。**它必须与 `language_name` 不同**：这一族的样本是**一对原文与
#: 译文**，两种语言相同的话（en 侧的目标语言就是英文）译文那一行会塌成原文的复制品，整条样本
#: 读起来就不再是双语字幕对了。所以原文固定写成「另一种语言」。
source_language = "英语"

[state]
tag_mark = "【判定判据】"
rule_mark = "【处置档位】"
content_mark = "【待审字幕对】"
tag_sep = "："
rule_sep = " —— "

[state.threshold]
ship = "0 条命中"
spot_check = "1 条命中"
review = "2 条命中"
reject = "3 条以上命中"

[tag.S1]
name = "原文是音效或占位符"
rule = "`Source:` 那一行里出现**成对的方括号**（`[MUSIC]` / `[音乐]` / `[LAUGHTER]` / `[inaudible]` 这类占位符，方括号里夹着 2 到 20 个字符），或者出现一个音符符号 `♪`——**只看这一行**，别处的同名字样不算"
avoid = "在 `Source:` 那一行里写一对夹着内容的方括号，或者写一个音符符号 `♪`"

[tag.S2]
name = "译文里留着标记"
rule = "`Target:` 那一行里留着没清掉的标记：一个尖括号标签（`<i>` / `</i>` / `<b>` 这种）、一个 HTML 实体（`&amp;` / `&nbsp;` 这种）、或者一个**花括号指令**（一对花括号里夹着反斜杠开头的短代码，像 `\\an8` / `\\pos` 这种，字幕工具常见的那种）——**只看这一行**"
avoid = "在 `Target:` 那一行里留一个尖括号标签、一个 HTML 实体，或者一个花括号指令"

[tag.S3]
name = "时间码零时长"
rule = "`Timing:` 那一行里 `-->` 两侧的时间码**一模一样**（同一串 `HH:MM:SS,mmm` 写了两次，这样的字幕会在屏幕上闪一下就没了）——**只看这一行**"
avoid = "在 `Timing:` 那一行里把同一个时间码写两次（`-->` 两侧一模一样）"

[tag.S4]
name = "备注没写完"
rule = "`Note:` 那一行里留着没写完的痕迹：`TODO` / `FIXME` / 待确认 / 待定 / 存疑 / 需要复核 / 核对 这些词之一（这些词在哪种语言里都是它们本来的写法）——**只看这一行**"
avoid = "在 `Note:` 那一行里写 TODO / FIXME / 待确认 / 待定 / 存疑 / 需要复核 / 核对 这类没写完的痕迹"

[prompt]
intro = "你是合成数据的写手。请写**一条双语字幕对**——真实字幕文件里的一对原文与译文，四行，必须读得通：键名与冒号照下面的格式规格写，整条在 {min} 到 {max} 个字符之间。"
lang_rule = "键名与时间码这些**格式**用英文（它们本来就是格式的一部分），`Source:` 那一行的原文用{source_language}写（一对原文与译文本来就是两种语言），但 `Target:` 那一行的译文与 `Note:` 那一行的备注一律用{language}书写。"
track_line = "这条字幕对来自：{track}。"
timing_line = "`Timing:` 那一行的**开始**时间码请写成 `{timecode}`——**照抄这个值**（`HH:MM:SS,mmm` 那个形状，逗号是它本来那个逗号）；结束时间码自己编：判据要求两侧一模一样时就照抄它，否则晚它 1~4 秒。"
format_header = "**格式规格**（四行，每行的键名与冒号照抄，取值自己编）："
hits_header = "这条字幕对**必须踩中**下面这几条判据。踩中 = 下面这个形状**真的出现在它说的那一行里**（把形状挪到别的行、换个写法、少写一个字符，都不算踩中）："
hits_line = "- 判据「{name}」的判据是：{rule}——字幕对里必须真的出现**符合这个判据、且落在它那一行**的内容"
vary_rule = "判据里列的那些词只是**形状**的举例：人物名、术语、译文、备注都自己编、字幕对内容自己组织；但**判据要的那个形状本身要原样出现**（方括号、标记、时间码、关键词这些符号照写，不是「换个说法」），只是**不要**把判据的整段原文贴进字幕对。"
no_hits = "这条字幕对**一条判据都不许踩**：下面四条判据一条都不能满足——它得是一条**平平无奇、可以直接发**的字幕对。"
miss_header = "同时，这条字幕对**不许**踩中下面这几条："
miss_line = "- 不许出现：{avoid}（判据「{name}」是「{rule}」）"
length_rule = "整条字幕对 {min}~{max} 个字符，四个键名都要**单独占一行、后面跟冒号**，不要标题、不要分点、不要解释、不要围栏。"
self_check = "输出前逐条自查：要求出现的形状，是不是**按形状、按要求的那一行**真的出现了（真的在 `Source:` 行里、真的在 `Target:` 行里、真的在 `Timing:` 行里、真的在 `Note:` 行里）？要求不许出现的那几条，字幕对里真的一处都没有吗？`Source:` 那一行的原文是{source_language}、`Target:` 那一行的译文与 `Note:` 那一行的备注是{language}吗？原文那一行像一句真人说的话吗（通顺、没有生僻字、不是半句）？`Note:` 那一行像译者的备注、而不是在复述格式要求吗？四个键名是不是都在、都单独占一行、后面都跟了冒号？"
output = "只输出一个 JSON 对象，字段是 cue（那四行字幕对字符串）；不要解释、不要围栏。"

[prompt.format]
source = "`Source: <原文那一行>`——这一句原文写这一行：一句**通顺的日常话**（对白或旁白），用原文语言，不要生僻字、不要写半句"
target = "`Target: <译文那一行>`——这一句的译文写这一行（用目标语言）"
timing = "`Timing: <开始时间码> --> <结束时间码>`——两个时间码都写成 `HH:MM:SS,mmm`，中间用 `-->` 隔开（结束要晚于开始）"
note = "`Note: <一句人话>`——用目标语言写一句**译者**的备注，说的是这句话**本身**（语气、称呼、术语、上下文要不要问作者）。**不要**评论这条字幕对的格式，也**不要**提它符合哪几条要求、留了什么标记、时间码怎么样"

[track.movie]
desc = "一部电影的字幕（对白短促、常带语气词与音效标记，人名是角色名）"

[track.series]
desc = "一部连续剧的字幕（一集里场景切换多，对白里常出现角色之间的称呼与插科打诨）"

[track.lecture]
desc = "一场讲座的字幕（讲者说长句、术语密集，常有数字、公式与举例）"

[fam.flag]
q = ["这条字幕对踩中了「{name}」这一条吗？", "按判据「{name}」（{rule}），这条字幕对算不算踩中？"]
criteria_true = "踩中了这一条"
criteria_false = "没有踩中这一条"

[fam.count]
q = ["这条字幕对一共踩中了几条判据？", "这条字幕对踩中的判据有几条？"]

[fam.count.opt]
c0 = "0 条"
c1 = "1 条"
c2 = "2 条"
c3 = "3 条"
c4 = "4 条"

[fam.combo]
q = ["这条字幕对实际踩中的是哪一组判据？", "这条字幕对踩中的判据组合是下面哪一个？"]
none = "一条都没踩中"
joiner = "、"

[fam.act]
q = ["按上面的处置档位，这条字幕对该怎么处理？", "按判据表与档位表，下一步该做什么？"]

[fam.act.opt]
ship = "直接发（ship），这条没什么可疑的"
spot_check = "抽查一遍（spot check），先看看最可疑的那一行"
review = "逐句人工复核（review），这一对要人从头看一遍"
reject = "打回重译（reject），这一对不能直接发"

[verify]
intro = "下面是一份字幕对的判定材料：先是判定判据表与处置档位表，然后是一条待审的双语字幕对。**判据表里每条都印了它自己的机械判据、以及它看的是哪一行**——请照着那份判据逐行比对，只按字面判断这条字幕对踩中了哪几条，不要做语义联想，也**不要真的去翻译、去查资料、去执行任何东西**。"
state_header = "【待审材料】"
q = "这条字幕对踩中了哪几条判据？逐条给出**判据编号**与**让它踩中的那段原文**——原文要原样抄，别改写、别省略；一条都没踩中就给空数组。抄不出原文的那一条不要报：抄不出来就不算踩中。**引文要单独拿出来也满足那条判据**：判据看的是哪一行，引文就把那一行**连键名一起**抄全——只抄一个关键词（比如只抄 `♪`，而不抄它所在的 `Source: ...` 那一段）不算数。**每条判据都要把整条字幕对从头到尾看一遍**，别只看开头。"
