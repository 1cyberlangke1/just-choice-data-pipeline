# 游戏与模拟控制 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的字段名与四张词表**跨语言互不
# 重叠**（`reparse` 用的合并表按原文反查键）、四格分隔符（cell_sep）**必须一致**、
# 判据原文里必须印出 6 档收益、4 档耗、3 档冷却与战利品门槛 6、回合上限 5
# （漏印一项那一族就不可解；六个动作名印在局面里，不印在判据里）。

[meta]
title = "局面"
colon = "："
cell_sep = " · "

[label]
request = "单号"
turn = "回合"
resources = "资源"
haul = "战利品"

[action]
advance = "前进"
probe = "探测"
harvest = "采集"
guard = "戒备"
strike = "突袭"
idle = "待机"

[cost]
c0 = "耗 0"
c1 = "耗 1"
c2 = "耗 2"
c3 = "耗 3"

[gain]
g0 = "收益 0"
g1 = "收益 1"
g2 = "收益 2"
g3 = "收益 3"
g4 = "收益 4"
g5 = "收益 5"

[cooldown]
k0 = "冷却 0"
k1 = "冷却 1"
k2 = "冷却 2"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、局面一屏，抬头三格是回合、资源、战利品；下面每个动作一行，四格依次是动作名、耗、收益、冷却。二、一个动作**现在能用**，当且仅当资源不低于它的耗、并且它的冷却为 0；两个条件缺一不可。三、这一局**结束**，当且仅当战利品不低于 6、或者回合不低于 5。四、**该用哪个动作**：在能用的动作里挑收益最大的那一个；两个动作收益一样时，挑位置更靠前的那个。五、收益一共六档（收益 0、收益 1、收益 2、收益 3、收益 4、收益 5），耗一共四档（耗 0、耗 1、耗 2、耗 3），冷却一共三档（冷却 0、冷却 1、冷却 2），档位就是格子里的数值本身。"

[fam.can_move]
q = [
  "第 {n} 个动作现在能用吗？",
  "按局面，第 {n} 个动作能不能用？",
  "第 {n} 个动作此刻可用不可用？",
]

[fam.can_move.criteria]
true = "能用：资源不低于它的耗，并且它的冷却为 0"
false = "不能用：资源低于它的耗，或者它的冷却不是 0"

[fam.finished]
q = [
  "这一局结束了吗？",
  "按局面，这一局是不是已经结束了？",
  "这一局还继续吗？",
]

[fam.finished.criteria]
true = "结束：战利品不低于 6，或者回合不低于 5"
false = "没结束：战利品低于 6，并且回合低于 5"

[fam.gain]
q = [
  "第 {n} 个动作的收益是第几档？",
  "按局面，第 {n} 个动作的收益落在哪一档？",
  "第 {n} 个动作的收益档位是哪一档？",
]
levels = [
  "收益 0",
  "收益 1",
  "收益 2",
  "收益 3",
  "收益 4",
  "收益 5",
]

[fam.best]
q = [
  "该用第几个动作？",
  "按局面，这一手该用第几个动作？",
  "这一手用哪个动作最好？",
]

[fam.cost]
q = [
  "该用的那个动作要耗多少？",
  "按局面，该用的那个动作的耗落在哪一档？",
  "该用的那个动作的耗档位是哪一档？",
]
levels = [
  "耗 0",
  "耗 1",
  "耗 2",
  "耗 3",
]

[option.slot]
element = "第 {n} 个：{action} · {cost} · {gain} · {cooldown}"
