# 打分与评分 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的字段名与四张词表**跨语言互不
# 重叠**（`reparse` 用的合并表按原文反查键）、四格分隔符（cell_sep）**必须一致**、
# 判据原文里必须印出全部 6 条判据、3 档权重、3 档要求、5 档观测、3 个档位、3 个处置
# （漏印一项那一档就不可解）。

[meta]
title = "评分单"
request_label = "单号"
colon = "："
cell_sep = " · "

[criterion]
example = "例子"
source = "出处"
original = "原创"
sections = "分节"
typos = "错字"
length = "篇幅"

[weight]
w1 = "权重 1"
w2 = "权重 2"
w3 = "权重 3"

[need]
need1 = "要求 1"
need2 = "要求 2"
need3 = "要求 3"

[count]
n0 = "观测 0"
n1 = "观测 1"
n2 = "观测 2"
n3 = "观测 3"
n4 = "观测 4"

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、评分单每条判据一行，四格依次是判据名、权重、要求、观测。六条判据是例子、出处、原创、分节、错字、篇幅；权重有三档（权重 1、权重 2、权重 3），六条判据的权重分别是 3、3、2、2、1、1；要求有三档（要求 1、要求 2、要求 3）；观测那一格是 0 到 4 的整数（观测 0、观测 1、观测 2、观测 3、观测 4）。二、**观测不低于要求**才算这一条达标。三、总分 = 达标那几条的权重之和。四、档位按总分切：总分不低于 7 是高档，总分正好是 6 是中档，其余是低档。五、红线只有一条：原创那条**没达标**就是踩了红线。六、处置按档位与红线查表：高档不踩红线通过、中档不踩红线通过、高档踩红线返修、低档不踩红线返修、中档踩红线退回、低档踩红线退回。七、最严重的一条 = 没达标的判据里权重最大的那条；并列时就没有唯一答案。"

[fam.met]
q = [
  "第 {n} 条判据达标了吗？",
  "按判据，第 {n} 条判据算不算达标？",
  "第 {n} 条判据的观测够不够要求？",
]

[fam.met.criteria]
true = "达标：这一条的观测不低于要求"
false = "没达标：这一条的观测低于要求"

[fam.band]
q = [
  "这份评分单的总分落在哪一档？",
  "按总分，这份评分单是哪一档？",
  "这份评分单的档位是哪一档？",
]
levels = [
  "低档：总分不高于 5",
  "中档：总分正好是 6",
  "高档：总分不低于 7",
]

[fam.gate]
q = [
  "这份评分单该怎么处置？",
  "按档位与红线，这份评分单该怎么处置？",
  "这份评分单的处置是什么？",
]

[fam.top]
q = [
  "最严重的是第几条判据？",
  "没达标的判据里最严重的是第几条？",
  "最该先修的是第几条判据？",
]

[option.gate]
pass = "通过：可以收下"
fix = "返修：改完再来"
reject = "退回：不能收"

[option.slot]
element = "第 {n} 条：{criterion} · {weight} · {need} · {count}"

