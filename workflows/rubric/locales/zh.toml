lang = "zh"
language_name = "简体中文"

# 材料里不许出现的话术：只收**表名**。这份清单刻意短——材料是自然语言，「篇幅」「形式」
# 这类词在正常叙述里会出现，收进来会大面积误伤；而表名在材料里几乎不可能自然出现，
# 命中就是模型把段落结构抄进去了。只收高精度短语，宁可漏检也不误判。
banned_intent_phrases = [
  "待评材料",
  "材料清单",
  "评分单",
  "档位表",
  "处置表",
]

[meta]
body_label = "待评材料"
manifest_label = "材料清单"
score_label = "评分单"
band_label = "档位表"
gate_label = "处置表"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
# 评分单里「观测」那一格印这个标记 = 这一条的观测**只能从材料里数出来**。
count_mark = "按材料数"
manifest_columns = "篇幅 | 形式 | 数据"
score_columns = "判据 | 权重 | 要求 | 观测；观测写「按材料数」的那两条要自己去材料里数：材料里有一处留空占位（TODO / 待补 / 待填 / 待定 / FIXME）就是 0、一处都没有就是 4；有一处出处标记（[1] 这种方括号编号）就是 4、一处都没有就是 1"
band_columns = "档位 | 下界 | 上界；总分 = 达标那几条判据的权重之和，达标 = 观测不低于要求"
gate_columns = "档位 | 不踩红线 | 踩红线；红线只有一条：有据那条判据没达标"

[dims]
placeholders = "材料里有没有留空占位"
citations = "材料里有没有出处标记"
length = "材料篇幅"
form = "材料形式"
data = "材料里有没有量化数据"

[prompt]
intro = "下面是一份**待评材料**的特征清单。请按清单写出这份材料的正文——就是被拿去打分的那几行文字。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "材料要像一份真实提交里的那几段话：{language}自然行文，只写材料本身，不要解释自己、不要写小标题",
  "句数必须落在「材料篇幅」说的区间里：短 3~6 句、中 6~12 句、长 10~18 句。数句的口径是「句号 / 问号 / 感叹号 / 分号收尾算一句」，分条形式里每一行也算一句——下限是硬指标，写完先自己数一遍，不够就接着往下写：行文形式可以分成两三个自然段，分条形式就多写几条（每句都要有实质内容，别把一个短句拆成几个来凑数）",
  "「材料形式」是「分条」就至少有一行以 `- ` 开头；是「行文」就一行 `- ` 开头的都不要写",
  "「有没有量化数据」只看阿拉伯数字：有数据就至少写一个数字；无数据就一个阿拉伯数字都别写（出处标记 `[1]` 里的那个数字不算）",
  "「留空占位」那一档要一眼看得出来：有就写一处 `TODO` / `待补` / `待填` / `待定` / `FIXME`（像「TODO：补上压测数据」）；没有就一处都别写",
  "「出处标记」那一档也要一眼看得出来：有就写一处 `[1]` 这种方括号编号（像「……比上版快了一倍[1]」）；没有就一处都别写",
  "不要写 Markdown 围栏、不要写行号，也不要写「待评材料 / 材料清单 / 评分单 / 档位表 / 处置表」这些表名",
  "不要写真实存在的公司、产品或代码库名字，一律用虚构的名字",
]

[feature.placeholders.no]
brief = "没有留空占位"
hint = "一处 `TODO` / `待补` / `待填` / `待定` / `FIXME` 都别写，材料要看起来是写完了的"

[feature.placeholders.yes]
brief = "有留空占位"
hint = "写一处没写完的痕迹，例如「TODO：补上压测数据」「这一节的出处待补」"

[feature.citations.no]
brief = "没有出处标记"
hint = "一处 `[1]` 这种方括号编号都别写"

[feature.citations.yes]
brief = "有出处标记"
hint = "写一处方括号编号，例如「……比上版快了一倍[1]」"

[feature.length.short]
brief = "短材料"
hint = "3~6 句"

[feature.length.medium]
brief = "中等篇幅"
hint = "6~12 句"

[feature.length.long]
brief = "长材料"
hint = "10~18 句，写不满 10 句会直接作废"

[feature.form.prose]
brief = "整段行文"
hint = "一行 `- ` 开头的都不要写，用连续的句子写"

[feature.form.bulleted]
brief = "分条列出"
hint = "至少有一行以 `- ` 开头，其余行也可以是分条"

[feature.data.none]
brief = "没有量化数据"
hint = "一个阿拉伯数字都别写（中文数字如「三条」不算阿拉伯数字）"

[feature.data.numbers]
brief = "有量化数据"
hint = "至少写一个阿拉伯数字，例如「延迟从 120ms 降到 80ms」"

[criterion]
complete = "完整"
grounded = "有据"
concise = "简洁"
formatted = "格式"
quantified = "量化"

[verify]
intro = "下面是一份待评材料。请**只读材料正文**，按给定的选项反解它的两个特征。"
state_header = "【全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"

[trace.placeholders]
q = "材料里有没有留空占位（`TODO` / `待补` / `待填` / `待定` / `FIXME` 这类没写完的痕迹）？"
[trace.placeholders.criteria]
yes = "有：至少出现一处 `TODO` / `待补` / `待填` / `待定` / `FIXME`"
no = "没有：一处这种痕迹都没有"

[trace.citations]
q = "材料里有没有出处标记（`[1]` 这种方括号编号）？"
[trace.citations.criteria]
yes = "有：至少出现一处形如 `[1]` 的方括号编号"
no = "没有：一处这种标记都没有"

[fam.met]
q = [
  "评分单第 {n} 条判据（{criterion}）达标了吗？",
  "按评分单，第 {n} 条判据（{criterion}）算不算达标？",
  "第 {n} 条判据（{criterion}）的观测够不够要求？",
]
[fam.met.criteria]
true = "达标：这一条的观测不低于要求"
false = "没达标：这一条的观测低于要求"

[fam.band]
q = [
  "这份评分单的总分落在哪一档？",
  "按总分，这份评分单是哪一档？",
  "这份评分单的档位是哪一档？",
]
levels = [
  "低档：总分不高于 5",
  "中档：总分是 6 或 7",
  "高档：总分不低于 8",
]

[fam.gate]
q = [
  "这份评分单该怎么处置？",
  "按档位与红线，这份评分单该怎么处置？",
  "这份评分单的处置是什么？",
]
[fam.gate.criteria]
accept = "通过：可以收下"
revise = "返修：改完再来"
reject = "退回：不能收"

[fam.top]
q = [
  "没达标的判据里，权重最大的是哪一条？",
  "最该先补的是哪一条判据？",
  "没达标的判据里，最严重的是哪一条？",
]
[fam.top.criteria]
complete = "完整（第 1 条判据，权重 3）"
grounded = "有据（第 2 条判据，权重 3）"
concise = "简洁（第 3 条判据，权重 2）"
formatted = "格式（第 4 条判据，权重 2）"
quantified = "量化（第 5 条判据，权重 1）"
