# 依赖与许可证风险门控（depcheck）workflow 的中文文案。
#
# 输入：`workflows.depcheck.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 四个抬头标记两两不互为前缀（fact_mark / rule_mark / act_mark / content_mark）；
# - `[level.*]` 的键与 `features.LEVELS` 一一对应、`[act.*]` 的键与 `features.ACTS` 一一对应；
# - `[fact.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[eco.*]` 的键与 `features.ECOSYSTEMS` 一一对应；
# - 每条标记的 `avoid` 都不许误触**别的**标记（`test_locales` 会逐条扫）；
# - 判据原文与反面文案里一个花括号都不许有（它们会被拼进提示词，花括号是填槽标记）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"

[state]
fact_mark = "【风险标记】"
rule_mark = "【定级规则】"
act_mark = "【处置档位】"
content_mark = "【待审依赖】"
tag_sep = "："
rule_sep = " —— "
rule_formula = "等级 = 1 + 命中标记的权重和，封顶 {max} 级（哪个标记算命中，按上面每条自己的判据算）"

[fact.D1]
name = "传染性许可证"
rule = "`license:` 那一行里写着 `AGPL` / `GPL` / `SSPL` 里的一个（整词；`LGPL` 不算）——**只看这一行**，别处的同名字样不算"
avoid = "在 `license:` 那一行里写一个传染性许可证的标识（`AGPL` / `GPL` / `SSPL` 那种）"

[fact.D2]
name = "仓库已归档"
rule = "`status:` 那一行里写着 `archived`（上游已经归档、不再维护）——**只看这一行**"
avoid = "在 `status:` 那一行里写 `archived`"

[fact.D3]
name = "有已知漏洞"
rule = "`advisories:` 那一行里 `count=` 后面跟着**非零**的十进制整数（至少一条已知漏洞）——**只看这一行**"
avoid = "在 `advisories:` 那一行里把 `count=` 写成非零的数"

[fact.D4]
name = "还没到 1.0"
rule = "`version:` 那一行的版本号**以 `0.` 开头**（还没发布正式版）——**只看这一行**"
avoid = "在 `version:` 那一行里把版本号写成 `0.` 开头"

[level.L1]
name = "1 级（放行）"

[level.L2]
name = "2 级（观察）"

[level.L3]
name = "3 级（复核）"

[level.L4]
name = "4 级（替换）"

[level.L5]
name = "5 级（替换）"

[act.approve]
name = "直接进依赖树"

[act.watch]
name = "先进依赖树，登记半年后复查"

[act.review]
name = "引入前找负责人复核一次"

[act.replace]
name = "换成别的依赖再引入"

[eco.npm]
desc = "npm（Node.js 生态）：包名是小写字母、数字与连字符那种，版本号是点分数字"

[eco.pypi]
desc = "PyPI（Python 生态）：包名是小写字母与下划线那种，版本号是点分数字"

[eco.cargo]
desc = "crates.io（Rust 生态）：包名是小写字母与连字符那种，版本号是三个数字段"

[prompt]
intro = "你是合成数据的写手。请写**一屏依赖记录**——把某个包加进依赖树之前，审查清单里留下的那几行材料，六行，必须读得通：键名与冒号照下面的格式规格写，整屏在 {min} 到 {max} 个字符之间。"
lang_rule = "键名与 `count=` 这些**取值**用英文原样写（它们本来就是机器格式），但 `note:` 那一行的备注一律用{language}书写。"
text_only = "这一屏**只写文本**：不要真的去装这个包、连任何注册表、查任何漏洞库（判据认的只是字面，查不查都不改变标签）。"
eco_line = "这个包来自：{ecosystem}。"
category_line = "它的用途方向是：{category}。包名与备注都要落在它上面，不要写成放到哪个包上都合适的套话。"
format_header = "**格式规格**（六行，每行的键名与冒号照抄，取值自己编）："
hits_header = "这屏记录**必须命中**下面这几条风险标记。命中 = 下面这个形状**真的出现在它说的那一行里**（把形状挪到别的行、换个写法、少写一个字符，都不算命中）："
hits_line = "- 标记「{name}」的判据是：{rule}——记录里必须真的出现**符合这个判据、且落在它那一行**的内容"
vary_rule = "判据里列的那些词只是**形状**的举例：包名、版本号、许可证标识、备注都自己编、记录内容自己组织；但**判据要的那个形状本身要原样出现**（标识、数字位数这些照写，不是「换个说法」），只是**不要**把判据的整段原文贴进记录。"
no_hits = "这屏记录**一个标记都不许命中**：下面四条判据一条都不能满足——它得是一个**平平无奇、可以直接放进依赖树**的包。"
miss_header = "同时，这屏记录**不许**命中下面这几条："
miss_line = "- 不许出现：{avoid}（标记「{name}」是「{rule}」）"
length_rule = "整屏记录 {min}~{max} 个字符，六个键名都要**单独占一行、后面跟冒号**，不要标题、不要分点、不要解释、不要围栏。"
self_check = "输出前逐条自查：要求出现的形状，是不是**按形状、按要求的那一行**真的出现了（真的在 `license:` 行里、真的在 `status:` 行里、真的在 `advisories:` 行里、真的在 `version:` 行里）？要求不许出现的那几条，记录里真的一处都没有吗？`note:` 那一行是{language}吗？它写的是**这个包本身**（干什么用的、会用在什么场景、谁在维护、为什么现在要引入），而不是在复述判据、也没有**下风险结论**（没提「有没有已知漏洞」「是不是已归档」「许可证是不是传染性的」「版本成不成熟」）、没有提到判据名？它有没有真的落在上面指定的**用途方向**上（而不是随便一句放到哪个包上都一样的套话）？`version:` 那一行有没有按上面指定的**尾段数字**写（而且逐条换一个）？六个键名都写全了吗（一行都不许少）？"
output = "只输出一个 JSON 对象，字段是 packet（那六行记录字符串）；不要解释、不要围栏。"
version_line = "`version:` 那一行请写成 `{version}` 这个**形状**：最后一个数字段就是上面那个值，前两段自己编（点分数字，不要加 `v` 前缀）；版本号要**逐条换一个**，别反复用同一个数字。"
license_line = "`license:` 那一行请写 `{license}` 这个 SPDX 标识符——**照抄这个值**（大小写与连字符都别改），不要换成别的许可证、也不要往这一行加别的话。"

# 依赖类别词表：spec 里存的是**下标**，所以这份表要与别的语言等长（test_locales.py 锁住）。
# 每一条都是**跨生态通用**的用途（哪个生态都有这种包），所以它不会与 `ecosystem` 打架。
categories = [
  "日志与追踪：把结构化日志写到文件或收集端",
  "HTTP 客户端：发请求、重试、超时",
  "数据校验：把外部来的数据按模式检查一遍",
  "数据库驱动：连某个数据库、跑查询",
  "序列化：把对象在内存与字节流之间来回转",
  "命令行解析：把命令行参数变成结构化配置",
  "日期与时间：解析、格式化与时区换算",
  "图像处理：缩放、裁剪与格式转换",
  "模板渲染：把数据填进文本模板",
  "任务队列：把耗时任务丢给后台 worker",
]

[prompt.format]
package = "`package: <包名>` —— 写一个包名（自己编，按上面那个生态的命名习惯写）"
version = "`version: <版本号>` —— 直接写点分数字版本号（**不要**加 `v` 前缀，也别写别的修饰）"
license = "`license: <SPDX 标识符>` —— 写一个 SPDX 那种「名字-版本」样子的许可证标识（自己编一个真实存在的）"
status = "`status: <active 或 archived>` —— 仓库还在维护就写 `active`，上游已经归档、不再维护就写 `archived`"
advisories = "`advisories: count=<已知漏洞条数>` —— `count=` 后面跟条数（十进制整数，一条都没有就写 0）"
note = "`note: <一句备注>` —— 用目标语言写一句**做审查的人**看得懂的话，只讲**这个包本身**：它解决什么问题、会用在什么场景、谁在维护它（**只说维护者是谁，不要评价维护得好不好**）、为什么现在要把它加进依赖树。**不要**在这一行里下风险结论：不提它「有没有已知漏洞」「是不是已归档」「许可证是不是传染性的」「版本成不成熟」，也不提标记名或这一屏的格式要求。这一行只是材料，判据认的只有上面那几行结构键。"

[fam.flag]
q = ["这个依赖命中「{name}」这个标记了吗？", "按「{name}」这条判据（{rule}），这个依赖算不算命中它？"]
criteria_true = "命中了这个标记"
criteria_false = "没有命中这个标记"

[fam.grade]
q = ["按上面的定级规则，这个依赖定几级？", "把命中的标记代进权重公式，这个依赖的风险等级是几级？"]

[fam.combo]
q = ["这个依赖实际命中了哪几个风险标记？", "命中风险标记的是哪几个？"]
none = "一个都没命中"
joiner = " + "

[fam.act]
q = ["按上面的处置档位表，这个依赖该走哪一档？", "按等级查处置档位表，这个依赖下一步该怎么处理？"]

[verify]
intro = "下面是一屏依赖记录：先是风险标记表、定级规则与处置档位表，然后是这条记录本身。**每一条标记都印着它自己的机械判据和它看的那一行**——照着那条判据逐行比，只按字面判哪几个标记命中了，再按权重公式算一遍等级。不要做语义联想，**也不要真的去装包、连注册表或查漏洞库**。"
state_header = "[待判材料]"
q = "这个依赖命中了哪几个风险标记？逐个给出**标记编号**与**让它命中的那段原文**——原样抄，不要改写、不要缩写；一个都没命中就给空数组。抄不出来的那条不要报：抄不出来就不算。**引文自己要满足那条判据**：判据看哪一行，就把**那一行连键名一起**抄全（只抄一个取值、不带它所在的那一行，不算）。**每一条判据都要把整屏记录从头读到尾**，不要只看开头。最后再答一次风险等级（1~5 的整数，按权重公式算出来的那个）。"

[hygiene]
# 不许写进 `note:` 那一行的**风险结论词**（大小写不敏感的子串匹配）。词表按语言给，因为每种
# 语言里「下结论」的写法不同；`render.check_draft` 与 `judges.HygieneJudge` 共用这一份。
# 只收「结论」词，不收「谁在维护」这种**要求写**的内容——所以「维护」不在表里、「不再维护」在。
verdict_words = ["漏洞", "归档", "传染", "不再维护", "停止维护", "停止更新", "不再更新"]
