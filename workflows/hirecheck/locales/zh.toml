# 招聘初筛门禁（hirecheck）workflow 的中文文案。
#
# 输入：`workflows.hirecheck.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 四个抬头标记两两不互为前缀（fact_mark / rule_mark / act_mark / content_mark）；
# - `[level.*]` 的键与 `features.LEVELS` 一一对应、`[act.*]` 的键与 `features.ACTS` 一一对应；
# - `[fact.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid / require；
# - `[channel.*]` 的键与 `features.CHANNELS` 一一对应；
# - 每条判据的 `avoid` 都不许误触**别的**判据（`test_locales` 会逐条扫）；
# - 判据原文与反面文案里一个花括号都不许有（它们会被拼进提示词，花括号是填槽标记）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"

[state]
fact_mark = "【初筛判据】"
rule_mark = "【定级规则】"
act_mark = "【处置档位】"
content_mark = "【待审候选人】"
tag_sep = "："
rule_sep = " —— "
rule_formula = "等级 = 1 + 命中判据的权重和，封顶 {max} 级（哪条判据算命中，按上面每条自己的判据算）"

[fact.H1]
name = "年限不足"
rule = "`years:` 那一行里的数字**小于 3**（写成 0 / 1 / 2 这种一位数）——**只看这一行**，别处的数字不算"
avoid = "在 `years:` 那一行里把年限写成不足三年（`years: 0` / `years: 1` / `years: 2` 那种写法）"
require = "在 `years:` 那一行里写 3 或更大的数（这个人够年限）"

[fact.H2]
name = "缺硬性技能"
rule = "`skills:` 那一行里**没有** `kubernetes` 这个词（技能表里缺了这个岗位的硬性技能）——**只看这一行**，别处的同名字样不算"
avoid = "技能表里缺了那个硬性技能名（`skills:` 那一行里没有它）"
require = "在 `skills:` 那一行里把 `kubernetes` 列进去（技能表里有这个岗位的硬性技能）"

[fact.H3]
name = "没有工作许可"
rule = "`permit:` 那一行写着 `none`（这个人没有当地工作许可、要雇主出面解决）——**只看这一行**"
avoid = "在 `permit:` 那一行里写 `none`"
require = "在 `permit:` 那一行里写 `citizen` / `pr` / `visa` 这种已经有许可的状态"

[fact.H4]
name = "学历不符"
rule = "`degree:` 那一行**不是** `bs` / `ms` / `phd` 之一（学历代号对不上岗位要求）——**只看这一行**"
avoid = "学历代号对不上岗位要求（`degree:` 那一行里写的不是那三个代号）"
require = "在 `degree:` 那一行里写 `bs` / `ms` / `phd` 里的一个"

[level.L1]
name = "1 级（直接排面试）"

[level.L2]
name = "2 级（电话初筛）"

[level.L3]
name = "3 级（人工复核）"

[level.L4]
name = "4 级（淘汰）"

[level.L5]
name = "5 级（淘汰）"

[act.interview]
name = "直接排进面试轮次"

[act.screen]
name = "先做一轮电话初筛再定"

[act.hold]
name = "转给用人团队人工复核"

[act.reject]
name = "这一轮不推进"

[channel.referral]
desc = "内部推荐：材料是团队里的同事递进来的，备注里会提一句是谁推荐的、为什么推荐"

[channel.board]
desc = "招聘网站：材料是候选人自己投的，备注里会提一句他在什么状态下看机会"

[channel.campus]
desc = "校园招聘：材料是校招批次里收上来的，备注里会提一句他的毕业时间与在校经历"

[prompt]
intro = "你是合成数据的写手。请写**一屏候选人材料**——招聘系统里一份简历进入初筛时留下的那几行摘要，六行，必须读得通：键名与冒号照下面的格式规格写，整屏在 {min} 到 {max} 个字符之间。"
lang_rule = "键名与 `none` / `bs` 这些**取值**用英文原样写（它们本来就是机器格式），但 `note:` 那一行的备注一律用{language}书写。"
text_only = "这一屏**只写文本**：不要真的去查这个人的背景、连任何招聘系统或背调服务（判据认的只是字面，查不查都不改变标签）。"
channel_line = "这份材料是从这条渠道进来的：{channel}。"
role_line = "他投的是这个方向的岗位：{role}。`skills:` 那一行与 `note:` 都要落在它上面，不要写成放到哪个岗位上都合适的套话。"
name_line = "`candidate:` 那一行请写 **{name}** 这个姓名——**照抄这个值**（姓名按目标语言的习惯写），不要换成别的名字、也不要用占位符。"
years_line = "`years:` 那一行请写 **{years}**（十进制整数，就是这个人相关岗位的工作年限；不要写「年」字、不要写区间、不要写「+」）。"
format_header = "**格式规格**（六行，每行的键名与冒号照抄，取值自己编）："
hits_header = "这屏材料**必须命中**下面这几条初筛判据。命中 = 下面这个形状**真的出现在它说的那一行里**（把形状挪到别的行、换个写法、少写一个字符，都不算命中）："
hits_line = "- 判据「{name}」的判据是：{rule}——材料里必须真的出现**符合这个判据、且落在它那一行**的内容"
vary_rule = "判据里列的那些词只是**形状**的举例：技能组合、许可状态、学历代号、备注都自己编、材料内容自己组织；但**判据要的那个形状本身要原样出现**（代号、写法这些照写，不是「换个说法」），只是**不要**把判据的整段原文贴进材料。"
no_hits = "这屏材料**一条判据都不许命中**：下面四条判据一条都不能满足——它得是一个**平平无奇、可以直接排面试**的候选人。"
miss_header = "同时，这屏材料**不许**命中下面这几条："
miss_line = "- 不许出现：{avoid}（判据「{name}」是「{rule}」）——反过来要写成：{require}"
length_rule = "整屏材料 {min}~{max} 个字符，六个键名都要**单独占一行、后面跟冒号**，不要标题、不要分点、不要解释、不要围栏。"
self_check = "输出前逐条自查：要求出现的形状，是不是**按形状、按要求的那一行**真的出现了（真的在 `years:` 行里、真的在 `skills:` 行里、真的在 `permit:` 行里、真的在 `degree:` 行里）？要求不许出现的那几条，材料里真的一处都没有吗（「反过来要写成」那一句里的东西**必须原样出现**，不是「换个说法」）？`note:` 那一行是{language}吗？它写的是**这个人本身**（现在在做什么、擅长什么、为什么来投这个岗位、材料从哪条渠道来），而不是在复述判据、也没有**替他下初筛结论**（没提「年限够不够」「有没有这个岗位的硬性技能」「有没有工作许可」「学历符不符合」）、没有提到判据名？它有没有真的落在上面指定的**岗位方向**上（而不是随便一句放到哪个岗位上都一样的套话）？`candidate:` 那一行有没有按上面指定的**姓名**写？`years:` 那一行有没有按上面指定的**数字**写？六个键名都写全了吗（一行都不许少）？"
output = "只输出一个 JSON 对象，字段是 packet（那六行材料字符串）；不要解释、不要围栏。"

# 岗位方向词表：spec 里存的是**下标**，所以这份表要与别的语言等长（test_locales.py 锁住）。
# 每一条都是**跨渠道通用**的方向（哪个渠道都可能投这些岗），所以它不会与 `channel` 打架。
roles = [
  "后端服务：写 HTTP 服务、任务队列与数据库访问",
  "数据工程：搭数据管线、写批处理与调度",
  "客户端：写移动端或桌面端的界面与本地存储",
  "基础设施：维护容器编排、CI 与可观测性",
  "算法：训练与部署模型、做离线评测",
  "安全：做漏洞响应、访问控制与审计",
]

# 姓名池：spec 里存的是**下标**，所以这份表要与别的语言等长（test_locales.py 锁住）。
# 全部取真名、姓氏与名字都不重复，避免同一批样本里撞名。
names = [
  "李思远",
  "王雪梅",
  "陈子昂",
  "刘慧敏",
  "赵启航",
  "孙文博",
  "周雅琴",
  "吴浩然",
  "郑晓岚",
  "徐立成",
  "何若楠",
  "马晨曦",
]

[prompt.format]
candidate = "`candidate: <姓名>` —— 这个人的姓名（按上面指定的那个写，不要用占位符）"
years = "`years: <工作年限>` —— 直接写十进制整数（**不要**写「年」字、不要写区间、不要写「+」）"
skills = "`skills: <技能列表>` —— 逗号分隔的技术技能（小写、用英文原样写，例如语言、框架、数据库的名字），至少四项"
permit = "`permit: <工作许可>` —— 这个人在当地的工作许可状态，写 `none`（没有许可、要雇主出面解决）、`citizen`（本地公民）、`pr`（永久居民）、`visa`（已有可转职的工作签证）之一"
degree = "`degree: <最高学历>` —— 学历**代号**，写 `bs`（本科）、`ms`（硕士）、`phd`（博士）、`associate`（大专）、`bootcamp`（培训营）之一"
note = "`note: <一句备注>` —— 用目标语言写一句**做初筛的人**看得懂的话，只讲**这个候选人本身**：他现在在做什么、擅长什么、为什么来投这个岗位、材料是从哪条渠道来的。**不要**在这一行里下初筛结论：不提他「年限够不够」「会不会这个岗位的硬性技能」「有没有工作许可」「学历符不符合」，也不提判据名或这一屏的格式要求。这一行只是材料，判据认的只有上面那几行结构键。"

[fam.flag]
q = ["这份材料命中「{name}」这条判据了吗？", "按「{name}」这条判据（{rule}），这份材料算不算命中它？"]
criteria_true = "命中了这条判据"
criteria_false = "没有命中这条判据"

[fam.grade]
q = ["按上面的定级规则，这份材料定几级？", "把命中的判据代进权重公式，这份材料的初筛等级是几级？"]

[fam.combo]
q = ["这份材料实际命中了哪几条初筛判据？", "命中初筛判据的是哪几条？"]
none = "一条都没命中"
joiner = " + "

[fam.act]
q = ["按上面的处置档位表，这份材料该走哪一档？", "按等级查处置档位表，这个候选人下一步该怎么处理？"]

[verify]
intro = "下面是一屏候选人材料：先是初筛判据表、定级规则与处置档位表，然后是这份材料本身。**每一条判据都印着它自己的机械判据和它看的那一行**——照着那条判据逐行比，只按字面判哪几条判据命中了，再按权重公式算一遍等级。不要做语义联想，**也不要真的去查这个人的背景、连招聘系统或背调服务**。"
state_header = "[待判材料]"
q = "这份材料命中了哪几条初筛判据？逐个给出**判据编号**与**让它命中的那段原文**——原样抄，不要改写、不要缩写；一条都没命中就给空数组。抄不出来的那条不要报：抄不出来就不算。**引文自己要满足那条判据**：判据看哪一行，就把**那一行连键名一起**抄全（只抄一个取值、不带它所在的那一行，不算）。**每一条判据都要把整屏材料从头读到尾**，不要只看开头。最后再答一次初筛等级（1~5 的整数，按权重公式算出来的那个）。"

[hygiene]
# 不许写进 `note:` 那一行的**初筛结论词**（大小写不敏感的子串匹配）。词表按语言给，因为每种语言
# 里「下结论」的写法不同；`render.check_draft` 与 `judges.HygieneJudge` 共用这一份。
# 只收「结论」词，不收「要求写」的内容——所以「擅长」「维护」不在表里，「不满足要求」在。
verdict_words = ["年限不足", "年限不够", "经验不足", "经验不够", "技能不符", "技能不匹配", "不满足", "不符合", "不达标", "未达标", "达标", "满足要求", "符合要求", "不合格", "合格", "通过初筛", "不予推进", "直接淘汰", "淘汰"]
