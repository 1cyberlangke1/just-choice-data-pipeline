# 数据库变更评审（sqlreview）workflow 的英文文案。
#
# 输入：`workflows.sqlreview.locales.load("en")` 读取本文件。
# 输出：字典。
# 预期行为：与 `zh.toml` 一一对应（同一组键、同一组占位符、同一组抬头分隔符语义）。
# - 三个抬头标记两两不互为前缀（`tag_mark` / `rule_mark` / `content_mark`）；
# - `[state.threshold]` 与 `[fam.act.opt]` 的键都与 `features.ACTS` 一一对应；
# - `[tag.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[workload.*]` 的键与 `features.WORKLOADS` 一一对应；
# - 每条判据的 `avoid` 都不许误触**别的**判据（`test_locales` 会逐条扫）；
# - 判据原文与反面文案里一个花括号都不许有（它们会被拼进提示词，花括号是填槽标记）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "en"
language_name = "English"

[state]
tag_mark = "[Judging criteria]"
rule_mark = "[Dispositions]"
content_mark = "[Change record under review]"
tag_sep = ": "
rule_sep = " — "

[state.threshold]
apply = "0 hits"
explain_first = "1 hit"
dba_review = "2 hits"
reject = "3 or more hits"

[tag.Q1]
name = "an unconditional write over the whole table"
rule = "**the `statement:` line** holds an `UPDATE` or `DELETE` statement, and **no `WHERE` appears anywhere on that line** (without a `WHERE` the statement touches every row of the table) — **look at that line only**, the same wording elsewhere does not count"
avoid = "writing an `UPDATE` or `DELETE` that carries no `WHERE` into the `statement:` line"

[tag.Q2]
name = "a full scan of a large table"
rule = "**the `plan:` line** carries both of these: the full-scan node name `Seq Scan`, and an estimated row count of **at least seven digits** (`rows=` followed by seven or more digits, i.e. a million rows or more) — **look at that line only**"
avoid = "writing the full-scan node `Seq Scan` into the `plan:` line and pushing its estimated row count `rows=` into seven digits"

[tag.Q3]
name = "a schema change that cannot be re-run"
rule = "**the `ddl:` line** holds an `ALTER` or `DROP` statement, and **neither `IF EXISTS` nor `IF NOT EXISTS` appears anywhere on that line** (running it a second time would fail) — **look at that line only**"
avoid = "writing an `ALTER` or `DROP` that carries neither `IF EXISTS` nor `IF NOT EXISTS` into the `ddl:` line"

[tag.Q4]
name = "the note was never finished"
rule = "**the `note:` line** still carries half-finished wording: one of `TODO` / `FIXME` / 待确认 / 待定 / 存疑 / 需要复核 / 核对 (these words keep their own spelling in every language) — **look at that line only**"
avoid = "writing TODO / FIXME / 待确认 / 待定 / 存疑 / 需要复核 / 核对 style half-finished wording into the `note:` line"

[prompt]
intro = "You write synthetic data. Write **one screen of a database change review record** — the few lines of material a real change request carries, four lines, and it has to read like the real thing: the keys and their colons go exactly as the format spec below says, and the whole record stays between {min} and {max} characters."
lang_rule = "Keys, SQL keywords, the execution plan and the schema change are English (that is what the format is), but **the `note:` remark** must be written in {language} only."
workload_line = "This change happens on: {workload}."
format_header = "**Format spec** (four lines; copy each key and its colon, invent the values yourself):"
hits_header = "This record **must trip** the following criteria. Trip = the shape below **really shows up in the place the criterion names** (moving the shape to another line, writing it a different way, or dropping a single character all fail to count):"
hits_line = "- The criterion \"{name}\" reads: {rule} — the record must really contain **something that matches this criterion and sits on that very line**"
vary_rule = "The words inside the criteria are **examples of a shape**: invent your own database, tables, columns, statement, plan and remark and compose the record yourself; but **the shape the criterion asks for must appear as it is** (keywords, digit counts and symbols are written literally, not paraphrased) — just do **not** paste the whole criterion text into the record."
no_hits = "This record **must not trip a single criterion**: none of the four criteria below may be satisfied — it has to be an **unremarkable change that could run as is**."
miss_header = "At the same time, this record **must not trip** the following:"
miss_line = "- Must not contain: {avoid} (the criterion \"{name}\" reads \"{rule}\")"
length_rule = "The whole record is {min}~{max} characters and all four keys must **sit on their own line followed by a colon**: no title, no bullets, no explanation, no fences."
self_check = "Before answering, check each item: does every required shape **really appear as a shape and on the required line** (really on the `statement:` line, really on the `plan:` line, really on the `ddl:` line, really on the `note:` line)? And is every forbidden shape really absent from the record? Is the `note:` remark in {language}? Is it about **how to run** the change rather than a restatement of what the statement, the plan or the schema change is like? Are the statement, the plan and the schema change **written as text only and never actually executed** (this family wants text: do not connect to any database and do not run any command)? And are all four keys present, each on its own line, each followed by a colon?"
output = "Output only one JSON object with the field packet (that four-line record string); no explanation, no fences."

[prompt.format]
statement = "`statement: <the SQL statement to run>` — one complete SQL statement goes here (invent the tables, columns and values)"
plan = "`plan: <the execution-plan summary for that statement>` — one line of execution plan goes here (invent the scan node name, the `on <table>` part and the `rows=<estimate>` field)"
ddl = "`ddl: <the schema change in this request>` — one schema-change statement goes here (the `ALTER` / `CREATE` / `DROP` kind — invent the tables and columns)"
note = "`note: <one review remark>` — one **reviewer's** remark in the target language, about **how to run this change** (which time window, whether to batch it, how to roll back, whom to confirm with before it ships). Do **not** describe what the statement, the plan or the schema change **is like** (\"no WHERE\", \"a full scan\", \"no re-entry guard\"), and do **not** comment on the record's formatting or mention which requirements it satisfies or what the numbers are"

[workload.oltp]
desc = "a transactional database (high-frequency small transactions such as orders and payments, small tables, statements that go through a primary key or a narrow index)"

[workload.analytics]
desc = "an analytics database (reports and wide tables, statements that read large stretches of data)"

[workload.migration]
desc = "a migration project (an old system moving onto a new schema, with historical data to backfill)"

[fam.flag]
q = ["Does this record trip the \"{name}\" criterion?", "By the criterion \"{name}\" ({rule}), does this record count as tripping it?"]
criteria_true = "it trips this one"
criteria_false = "it does not trip this one"

[fam.count]
q = ["How many criteria does this record trip in total?", "How many of the criteria does this record trip?"]

[fam.count.opt]
c0 = "0"
c1 = "1"
c2 = "2"
c3 = "3"
c4 = "4"

[fam.combo]
q = ["Which set of criteria does this record actually trip?", "Which combination of criteria does this record trip?"]
none = "none of them"
joiner = " + "

[fam.act]
q = ["According to the dispositions above, what should be done with this record?", "By the criteria and disposition table, what is the next step?"]

[fam.act.opt]
apply = "run it as is (apply) — nothing about this change looks off"
explain_first = "look at the execution plan first (explain first) and check the most suspicious line"
dba_review = "hand it to a DBA for review — a human should read the whole change"
reject = "reject it and rewrite the change before it goes anywhere"

[verify]
intro = "Below is a piece of database change-review material: first the criteria table and the disposition table, then one change record under review. **Every criterion line also prints its own mechanical rule and the line it looks at** — compare against that rule line by line and judge purely literally which criteria this record trips. Do not reason semantically, and **do not actually execute anything, connect to any database, or look anything up**."
state_header = "[Material under review]"
q = "Which criteria does this record trip? For each one give the **criterion id** and **the exact original text that tripped it** — copy it verbatim, do not rewrite or abbreviate; if it trips none, return an empty array. Do not report a criterion whose text you cannot copy: if you cannot copy it, it does not count. **The quote must satisfy that criterion on its own**: wherever the criterion looks, copy that spot **together with its key name** — a bare keyword (copying `Seq Scan` without the `plan: ...` stretch it sits in) does not count. **Read the whole record from start to finish for every criterion**, do not just look at the beginning."
