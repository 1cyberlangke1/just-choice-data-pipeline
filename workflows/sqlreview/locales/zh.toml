# 数据库变更评审（sqlreview）workflow 的中文文案。
#
# 输入：`workflows.sqlreview.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 三个抬头标记两两不互为前缀（`tag_mark` / `rule_mark` / `content_mark`）；
# - `[state.threshold]` 与 `[fam.act.opt]` 的键都与 `features.ACTS` 一一对应；
# - `[tag.*]` 的键与 `features.TAG_IDS` 一一对应，每条都有 name / rule / avoid；
# - `[workload.*]` 的键与 `features.WORKLOADS` 一一对应；
# - 每条判据的 `avoid` 都不许误触**别的**判据（`test_locales` 会逐条扫）；
# - 判据原文与反面文案里一个花括号都不许有（它们会被拼进提示词，花括号是填槽标记）；
# - 提示词与题面模板里的占位符都被填过（渲染要经过严格填槽，漏填会当场报错）。

lang = "zh"
language_name = "简体中文"

[state]
tag_mark = "【判定判据】"
rule_mark = "【处置档位】"
content_mark = "【待审变更记录】"
tag_sep = "："
rule_sep = " —— "

[state.threshold]
apply = "0 条命中"
explain_first = "1 条命中"
dba_review = "2 条命中"
reject = "3 条以上命中"

[tag.Q1]
name = "无条件改整张表"
rule = "`statement:` 那一行里是一条 `UPDATE` 或 `DELETE` 语句，而且**整行都找不到 `WHERE`**（没有 `WHERE` 就会改到表里每一行）——**只看这一行**，别处的同名字样不算"
avoid = "在 `statement:` 那一行里写一条**没有 `WHERE`** 的 `UPDATE` 或 `DELETE`"

[tag.Q2]
name = "大表全表扫描"
rule = "`plan:` 那一行里同时出现两样东西：全表扫描的节点名 `Seq Scan`，以及一个**至少七位数**的估算行数（`rows=` 后面跟着至少七位数字，也就是估算出百万行以上）——**只看这一行**"
avoid = "在 `plan:` 那一行里写全表扫描节点 `Seq Scan`，并且把估算行数 `rows=` 顶到七位数以上"

[tag.Q3]
name = "结构变更不可重入"
rule = "`ddl:` 那一行里是一条 `ALTER` 或 `DROP` 语句，而且**整行都找不到 `IF EXISTS` / `IF NOT EXISTS`**（重跑一次就会报错）——**只看这一行**"
avoid = "在 `ddl:` 那一行里写一条**不带 `IF EXISTS` / `IF NOT EXISTS`** 的 `ALTER` 或 `DROP`"

[tag.Q4]
name = "备注没写完"
rule = "`note:` 那一行里留着没写完的痕迹：`TODO` / `FIXME` / 待确认 / 待定 / 存疑 / 需要复核 / 核对 这些词之一（这些词在哪种语言里都是它们本来的写法）——**只看这一行**"
avoid = "在 `note:` 那一行里写 TODO / FIXME / 待确认 / 待定 / 存疑 / 需要复核 / 核对 这类没写完的痕迹"

[prompt]
intro = "你是合成数据的写手。请写**一屏数据库变更评审记录**——一次真实变更申请里那几行材料，四行，必须读得通：键名与冒号照下面的格式规格写，整屏在 {min} 到 {max} 个字符之间。"
lang_rule = "键名、SQL 关键字、执行计划与结构变更这些**格式**用英文原样写（它们本来就是格式的一部分），但 `note:` 那一行的评审备注一律用{language}书写。"
workload_line = "这次变更发生在：{workload}。"
format_header = "**格式规格**（四行，每行的键名与冒号照抄，取值自己编）："
hits_header = "这屏记录**必须踩中**下面这几条判据。踩中 = 下面这个形状**真的出现在它说的那一行里**（把形状挪到别的行、换个写法、少写一个字符，都不算踩中）："
hits_line = "- 判据「{name}」的判据是：{rule}——记录里必须真的出现**符合这个判据、且落在它那一行**的内容"
vary_rule = "判据里列的那些词只是**形状**的举例：库名、表名、字段名、语句、执行计划、备注都自己编、记录内容自己组织；但**判据要的那个形状本身要原样出现**（关键字、数字位数、符号这些照写，不是「换个说法」），只是**不要**把判据的整段原文贴进记录。"
no_hits = "这屏记录**一条判据都不许踩**：下面四条判据一条都不能满足——它得是一次**平平无奇、可以直接执行**的变更。"
miss_header = "同时，这屏记录**不许**踩中下面这几条："
miss_line = "- 不许出现：{avoid}（判据「{name}」是「{rule}」）"
length_rule = "整屏记录 {min}~{max} 个字符，四个键名都要**单独占一行、后面跟冒号**，不要标题、不要分点、不要解释、不要围栏。"
self_check = "输出前逐条自查：要求出现的形状，是不是**按形状、按要求的那一行**真的出现了（真的在 `statement:` 行里、真的在 `plan:` 行里、真的在 `ddl:` 行里、真的在 `note:` 行里）？要求不许出现的那几条，记录里真的一处都没有吗？`note:` 那一行的备注是{language}吗？它说的是**怎么执行**，而不是在复述这条语句 / 这份计划 / 这条结构变更有什么性质吗？语句、执行计划与结构变更是不是**只写在文本里、没有被真的执行**（这一族只要文本：不许连数据库、不许跑任何命令）？四个键名是不是都在、都单独占一行、后面都跟了冒号？"
output = "只输出一个 JSON 对象，字段是 packet（那四行记录字符串）；不要解释、不要围栏。"

[prompt.format]
statement = "`statement: <一条待执行的 SQL 语句>`——这一行放**一条**完整的 SQL 语句（表名、字段名与取值自己编）"
plan = "`plan: <这一条语句的执行计划摘要>`——这一行放**一行**执行计划（扫描节点名、`on <表名>`、`rows=<估算行数>` 这些字段自己编）"
ddl = "`ddl: <这条变更里的结构变更语句>`——这一行放**一条**结构变更语句（`ALTER` / `CREATE` / `DROP` 这类，表名与字段名自己编）"
note = "`note: <一句评审备注>`——用{language}写一句**评审人**的备注，说的是这次变更**怎么执行**（挑什么时间窗口、要不要分批、回滚怎么走、上线前找谁确认）。**不要**描述语句 / 执行计划 / 结构变更**本身有什么性质**（比如「没有 WHERE」「全表扫描」「没有防重入」），也**不要**评论这屏记录的格式、提它符合哪几条要求、数字是多少"

[workload.oltp]
desc = "一套事务型库（订单、支付这类高频小事务，表不大、语句都走主键或窄索引）"

[workload.analytics]
desc = "一套分析型库（报表与宽表，语句常扫大段数据）"

[workload.migration]
desc = "一次迁移项目（老系统切到新表结构，要回填历史数据）"

[fam.flag]
q = ["这屏记录踩中了「{name}」这一条吗？", "按判据「{name}」（{rule}），这屏记录算不算踩中？"]
criteria_true = "踩中了这一条"
criteria_false = "没有踩中这一条"

[fam.count]
q = ["这屏记录一共踩中了几条判据？", "这屏记录踩中的判据有几条？"]

[fam.count.opt]
c0 = "0 条"
c1 = "1 条"
c2 = "2 条"
c3 = "3 条"
c4 = "4 条"

[fam.combo]
q = ["这屏记录实际踩中的是哪一组判据？", "这屏记录踩中的判据组合是下面哪一个？"]
none = "一条都没踩中"
joiner = "、"

[fam.act]
q = ["按上面的处置档位，这屏记录该怎么处理？", "按判据表与档位表，下一步该做什么？"]

[fam.act.opt]
apply = "直接执行（apply），这次变更没什么可疑的"
explain_first = "先看一遍执行计划（explain first），把最可疑的那一行核一下"
dba_review = "交 DBA 人工复核（review），这次变更要人从头看一遍"
reject = "打回重写（reject），这次变更不能这么提交"

[verify]
intro = "下面是一份数据库变更评审材料：先是判据表与处置档位表，然后是一屏待审的变更记录。**判据表的每一行都印着它自己的机械口径与它看的那一行**——照着那份口径逐行比对，按字面判断这屏记录踩了哪几条判据。不要做语义推理，**也不要真的去执行、去连库、去查任何东西**。"
state_header = "【待审材料】"
q = "这屏记录踩了哪几条判据？每条都给出**判据编号**与**让它命中的那段原文**——原样抄，不要改写、不要缩写；一条都没踩就返回空数组。抄不出原文的判据不要报：抄不出来就不算。**引文要自己就能满足那条判据**：判据看哪一行，就把**那一行连同它的键名**一起抄下来——只抄一个裸关键字（比如只抄 `Seq Scan`、而不带上它所在的 `plan: ...` 那一段）不算。**每一条判据都要把这屏记录从头读到尾**，不要只看开头。"
