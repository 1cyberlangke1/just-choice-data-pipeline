[fam.tool]
q = ["这句请求要调用下面哪个函数？", "这段请求对应的是哪个工具调用？"]

[fam.arg]
q = ["请求里把{arg}设成了哪个取值？", "这句请求给{arg}指定的取值是下面哪一个？"]

[fam.stated]
q = ["这句请求里提到{arg}了吗？", "请求中有没有明确指定{arg}？"]
[fam.stated.criteria]
true = "请求里明确给出了{arg}的取值"
false = "请求里一个词都没提{arg}，函数会用它的默认值"

[fam.member]
q = ["请求点名要了{value}吗？", "这句请求里包含{value}吗？"]
[fam.member.criteria]
true = "请求里点名提到了它"
false = "请求里没有提到它"
