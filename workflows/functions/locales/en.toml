[val.symbol.ticker]
NVDA = "NVDA"
AMD = "AMD"
AAPL = "AAPL"
MSFT = "MSFT"
TSLA = "TSLA"

[val.symbol.name]
NVDA = "Nvidia"
AMD = "Advanced Micro Devices"
AAPL = "Apple"
MSFT = "Microsoft"
TSLA = "Tesla"

[val.benchmark.ticker]
SPY = "SPY"
QQQ = "QQQ"

[val.benchmark.name]
SPY = "the S&P 500 fund"
QQQ = "the Nasdaq 100 fund"

[flag]
include_volume = "include the volume"
normalize = "normalise the values"
smoothing = "smooth the curve"
include_etfs = "include ETFs"

[opt.symbol]
NVDA = "Nvidia (NVDA)"
AMD = "Advanced Micro Devices (AMD)"
AAPL = "Apple (AAPL)"
MSFT = "Microsoft (MSFT)"
TSLA = "Tesla (TSLA)"

[opt.benchmark]
SPY = "the S&P 500 index fund (SPY)"
QQQ = "the Nasdaq 100 index fund (QQQ)"

[opt.window]
"1d" = "the last session"
"1w" = "the last week"
"1mo" = "the last month"
"3mo" = "the last quarter"

[opt.resolution]
"1m" = "one data point per minute"
"5m" = "one data point every five minutes"
"15m" = "one data point every fifteen minutes"
"1h" = "one data point per hour"
"1d" = "one data point per day"

[opt.style]
line = "a line chart"
candles = "a candlestick chart"

[opt.direction]
up = "gainers only"
down = "losers only"
both = "both directions"

[tool_desc]
plot_price = "draw a price chart for one symbol"
compare_returns = "compare the returns of several symbols"
rolling_correlation = "measure the rolling correlation between a symbol and a benchmark"
top_movers = "list the symbols that moved the most over a period"

[arg_desc]
symbol = "the symbol"
symbols = "the set of symbols"
benchmark = "the benchmark"
window = "the time window"
resolution = "the data resolution"
style = "the chart style"
direction = "the ranking direction"
include_volume = "the volume switch"
normalize = "the normalisation switch"
smoothing = "the smoothing switch"
include_etfs = "the ETF switch"

[fam.tool]
q = ["Which function should this request call?", "Which tool call does this request correspond to?"]

[fam.arg]
q = ["Which value does the request give for {arg}?", "Which of these values does the request pick for {arg}?"]

[fam.stated]
q = ["Does this request mention {arg}?", "Does the request explicitly specify {arg}?"]
[fam.stated.criteria]
true = "the request gives an explicit value for {arg}"
false = "the request says nothing about {arg}, so the function falls back to its default"

[fam.member]
q = ["Does the request ask for {value}?", "Is {value} included in this request?"]
[fam.member.criteria]
true = "the request names it explicitly"
false = "the request never mentions it"
