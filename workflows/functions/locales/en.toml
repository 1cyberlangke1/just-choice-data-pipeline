# English copy for the function-calling (functions) workflow.
#
# Read by `workflows.functions.locales.load("en")`.
# Expected behaviour:
# - intent phrases never contain one another, so a request matches exactly one tool;
# - every value phrase in `[val]` is globally unique across the whole locale;
# - the `ticker` / `name` spellings of one argument point at the same value;
# - a `[flag]` phrase appears in no `[val]` phrase and in no template;
# - `[req.<tool>].lead` carries the subject in its `{subject}` slot, and every other
#   mentioned argument has its own segment template;
# - an optional argument that is not mentioned never shows up in the text.

[mark]
close = "."
list_sep = ", "
list_last = " and "

[intent]
plot_price = "plot the price action"
compare_returns = "compare the returns"
rolling_correlation = "work out the rolling correlation"
top_movers = "show the biggest movers"

[req.plot_price]
lead = ["Please plot the price action for {subject}", "{subject}, plot the price action"]
window = ", over {window}"
style = ", drawn as {style}"
resolution = ", at {resolution}"
include_volume = ", {include_volume}"

[req.compare_returns]
lead = ["Please compare the returns of {subject}", "{subject}, compare the returns"]
window = ", over {window}"
normalize = ", {normalize}"
resolution = ", at {resolution}"

[req.rolling_correlation]
lead = ["Please work out the rolling correlation for {subject}", "{subject}, work out the rolling correlation"]
window = ", over {window}"
resolution = ", at {resolution}"
smoothing = ", {smoothing}"

[req.top_movers]
lead = ["Please show the biggest movers", "Alright, show the biggest movers"]
window = ", over {window}"
direction = ", {direction}"
include_etfs = ", {include_etfs}"

[val.window]
"1d" = "the last session"
"1w" = "the last week"
"1mo" = "the last month"
"3mo" = "the last quarter"

[val.resolution]
"1m" = "one-minute bars"
"5m" = "five-minute bars"
"15m" = "fifteen-minute bars"
"1h" = "hourly bars"
"1d" = "daily bars"

[val.style]
line = "a line chart"
candles = "a candlestick chart"

[val.direction]
up = "only the gainers"
down = "only the losers"
