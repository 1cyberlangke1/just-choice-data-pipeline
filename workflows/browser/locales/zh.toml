lang = "zh"
language_name = "简体中文"

# 那句话里不许出现的话术：界面元素的状态（置灰 / 看不见 / 已是当前）与三张表的名字都归
# state 里那几段管，那句话里再写一遍就可能与它们打架。只收高精度短语——宁可漏检也不误判，
# 误判会在渲染期白拒一条本来能用的数据。
# `disabled` / `hidden` 是状态列的**取值词元本身**，照抄等于泄底；`ready` / `current` 在
# 自然语言里太常见（「ready to go」「current plan」），收了会大面积误伤，所以只收它们跟
# 界面连用的那几种说法。
banned_intent_phrases = [
  "用户请求",
  "界面元素",
  "门控表",
  "意图表",
  "行号",
  "敏感清单",
  "置灰",
  "不可见",
  "已是当前",
  "已经是当前",
  "disabled",
  "hidden",
]

[meta]
request_label = "用户请求"
elements_label = "界面元素"
gates_label = "门控表"
criteria_label = "意图表"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
elements_columns = "行号 | 角色 | 元素名 | 状态"
gates_columns = "判据 | 说明"
criteria_columns = "意图 | 角色 | 动作 | 不敏感时风险 | 敏感时风险"

# 敏感词表由代码填进 {words}：抄一遍就会漂移，而「什么算敏感」正是 `confirm` 那一族的判据。
[gates]
sensitive = "元素名里出现「{words}」中任何一个词，就算敏感操作"
done = "目标元素已经是当前所在的那一屏"
blocked = "目标元素置灰或者不可见"
confirm = "目标元素可用，而且是敏感操作"

[dims]
intent = "用户这一轮想干什么"

[prompt]
intro = "下面是一屏**界面快照**的特征清单。请按清单写出用户这一轮说的那一句话。"
bullet = "- {dim}：{brief}（{hint}）"
target_bullet = "- 用户指的是哪个元素：{label}（那句话里必须原样写出这个名字，一字不改）"
rules = [
  "那句话必须是**单行**（一行就够，不要换行）；不要用 Markdown 围栏，不要写注释",
  "那句话要像用户真的敲进来的：写「帮我把收件地址填一下」可以，写「意图：fill」这种字段名不行",
  "那句话里必须**原样**出现上面那个元素名（一字不改），而且整句话只指这一个元素——别的元素一个都别提",
  "**不要**写界面上的状态（能点 / 置灰 / 看不见 / 已经是当前那一屏），也不要写元素在表里的行号——那些归「界面元素」那张表管，写进那句话就会跟它打架",
  "只写用户这一轮想干的那一件事，不要顺手把别的操作也安排上",
  "不要写真实存在的公司、产品或代码库名字，一律用虚构的名字",
  "全部用{language}写；界面元素名保持原样照抄",
]

[feature.intent.fill]
brief = "用户想往一个输入框里填东西"
hint = "写成像「帮我把收件地址填一下」那样"

[feature.intent.open]
brief = "用户想打开一个链接 / 进入一个页面"
hint = "写成像「我想看看帮助中心」那样"

[feature.intent.switch]
brief = "用户想切换到另一个标签页 / 另一个视图"
hint = "写成像「切到明细那一页去」那样"

[feature.intent.submit]
brief = "用户想点按一个按钮（提交 / 确认）"
hint = "写成像「确认没问题了，点提交订单」那样"

[verify]
intro = "下面是一屏界面快照。请按给定的选项与问题反解它的特征。"
state_header = "【快照全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"
q_intent = "用户这一轮想干什么？"
q_row = "用户指的是「界面元素」表里的第几行？（从 1 数起，照那一列的「行号」填）"
q_label = "用户指的是哪个元素？（原样抄那个元素名）"

[role]
field = "输入框"
link = "链接"
tab = "标签页"
button = "按钮"

[state]
ready = "可用"
current = "已是当前"
disabled = "置灰"
hidden = "不可见"

[fam.intent]
q = [
  "用户这一轮想干什么？",
  "按「用户想干什么」选一项。",
  "用户这一句话的意图是哪一档？",
]
[fam.intent.criteria]
fill = "往输入框里填东西"
open = "打开一个链接 / 进入一个页面"
switch = "切换到另一个标签页 / 视图"
submit = "点按一个按钮"

[fam.target]
q = [
  "下一步该操作哪个元素？",
  "按这一屏的状态，该动哪一个元素？",
  "该点的 / 该填的是哪一个元素？",
]
row_option = "第 {index} 行"
none = "没有可操作的元素"

[fam.action]
q = [
  "下一步该做什么动作？",
  "按意图表，这一轮该执行哪个动作？",
  "该动的是哪一档动作？",
]
[fam.action.criteria]
type = "往输入框里填东西"
open = "打开链接 / 进入页面"
switch = "切换过去"
click = "点按按钮"
none = "不操作"

[fam.done]
q = [
  "目标元素已经是当前所在的那一屏了吗？",
  "这一轮要不要因为「它已经是当前」而不动手？",
  "按门控表，目标元素是不是已经完成了？",
]
[fam.done.criteria]
true = "是：目标元素已经是当前所在的那一屏"
false = "否：目标元素还不是当前那一屏"

[fam.blocked]
q = [
  "目标元素现在动不了吗？",
  "这一轮要不要因为「它动不了」而拦下来？",
  "按门控表，目标元素是不是被拦住了？",
]
[fam.blocked.criteria]
true = "是：目标元素置灰或者不可见，动不了"
false = "否：目标元素可以动"

[fam.confirm]
q = [
  "这一步要不要先让人确认一下？",
  "按门控表，这一轮该不该先确认再动手？",
  "目标元素是敏感操作吗（可用的情况下）？",
]
[fam.confirm.criteria]
true = "要：目标元素可用，而且是敏感操作（动钱 / 删东西 / 发布 / 退订）"
false = "不要：目标元素不敏感，或者它现在动不了"

[fam.risk]
q = [
  "这一轮操作的风险是第几档？",
  "按意图表给这一轮操作定一档风险。",
  "这一轮操作该排在第几档风险？",
]
levels = [
  "0 档：没有风险",
  "1 档：低风险",
  "2 档：中风险",
  "3 档：高风险",
]