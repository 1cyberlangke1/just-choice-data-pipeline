# 界面操作 workflow 的中文文案。
# test_locales.py 锁住的不变量：与 en 的键集合一致、各语言的标签与三张词表互不重叠、
# 三格的分隔符（cell_sep）**必须一致**（`reparse` 用的合并表只按一个分隔符切行）、
# 且敏感对象的标签里真的含敏感清单里的词、其余对象的标签里一个都不含。

[meta]
title = "界面元素表"
colon = "："
screen_label = "窗口"
task_label = "任务"
cell_sep = " · "

[role]
field = "输入框"
link = "链接"
tab = "页签"
button = "按钮"

[state]
ready = "可用"
current = "已是当前"
disabled = "置灰不可点"
hidden = "不可见"

[intent]
fill = "填写"
open = "打开"
switch = "切换到"
submit = "点按"

[object]
note = "备注"
pay_password = "支付密码"
monthly_report = "月度报表"
unsubscribe = "退订页面"
export_view = "导出视图"
pay_history = "支付记录"
draft = "草稿"
order = "提交订单"
phone = "手机号"
help = "帮助中心"
overview = "概览视图"
cancel = "取消"
address = "收件地址"
manual = "使用说明"
history = "历史记录"
refresh = "刷新"

[sensitive]
# 敏感清单：题面里原样印出来；标签里出现其中任一个词就算命中。
words = ["提交订单", "删除", "支付", "发布", "退订"]

[policy]
# 判据原文：整段拼在每道题的问句后面（范式 §9.8）。
text = "判据：一、任务意图表——『填写』要操作输入框、动作是输入；『打开』要操作链接、动作是打开；『切换到』要操作页签、动作是切换；『点按』要操作按钮、动作是点击。二、可用判据——只有状态是『可用』的元素能操作；状态是『已是当前』『置灰不可点』『不可见』的元素都不能操作。三、完成判据——任务要操作的那个对象，如果表里已经有一行状态是『已是当前』、而且它的角色也符合任务意图表，说明任务已经完成，不需要再操作。四、敏感判据——要操作的那个对象的标签里出现敏感清单（提交订单、删除、支付、发布、退订）中任一个词时，这一步要先人工确认。"

[fam.done]
q = [
  "按完成判据，这个任务已经完成了吗？",
  "这一屏里，任务是不是已经达成了？",
  "任务还需要再操作一次吗？",
]

[fam.done.criteria]
true = "已完成：要操作的那个对象已经是当前状态，不需要再操作"
false = "未完成：还要对那个对象操作一次"

[fam.target]
q = [
  "下一步该操作第几个元素？",
  "按判据，这一步该动的是第几个元素？",
  "应当操作哪一个元素？",
]

[fam.action]
q = [
  "这一步该做什么动作？",
  "对那个元素应当执行哪个动作？",
  "按任务意图表，这一步是什么动作？",
]

[fam.risk]
q = [
  "这一步要不要先人工确认？",
  "这个操作属于敏感操作、需要人工确认吗？",
  "按敏感判据，这一步要拦下来确认吗？",
]

[fam.risk.criteria]
true = "要：要操作的那个对象的标签命中了敏感清单"
false = "不要：要操作的那个对象的标签没有命中敏感清单"

[option.action]
type = "输入"
open = "打开"
switch = "切换"
click = "点击"

[option.position]
element = "第 {n} 个：{role} · {label} · {state}"
