# English strings for the browser / GUI-action workflow: prompt, question phrasings, option texts,
# role / state words and the verification prompt. See `zh.toml` for the reasoning behind each rule.
#
# Element names (收件地址 / 删除 / 概览 …) are NOT here: they come from the fixed vocabulary in
# `features.LABELS` and are shared by every language, because they are the UI's own labels copied
# verbatim from the screen snapshot and `wanted_label` must be language-independent.
lang = "en"
language_name = "English"

# Phrases banned from the user's sentence: the element's state (greyed out / not visible / already
# current) and the names of the three tables all belong to the sections of `state`, and repeating
# them here makes the sentence fight those tables. Kept to high-precision phrases only — a false
# positive rejects an otherwise usable sample at render time.
# `disabled` / `hidden` are the state column's own value tokens, so echoing them leaks the answer;
# plain `ready` / `current` are far too common in ordinary text ("ready to go", "current plan").
banned_intent_phrases = [
  "user request",
  "screen elements",
  "element table",
  "gate table",
  "intent table",
  "row number",
  "sensitive list",
  "greyed out",
  "grayed out",
  "disabled",
  "hidden",
]

[meta]
request_label = "User request"
elements_label = "Screen elements"
gates_label = "Gates"
criteria_label = "Intent table"
header = "[{title}]"
row_prefix = "- "
paren = " ({text})"
colon = ": "
elements_columns = "row | role | element | state"
gates_columns = "gate | meaning"
criteria_columns = "intent | role | action | risk when not sensitive | risk when sensitive"

# The sensitive word list is filled into {words} by code: copying it here would drift, and
# "what counts as sensitive" is exactly the criterion behind the `confirm` family.
[gates]
sensitive = "the element name contains any of \"{words}\", so it is a sensitive action"
done = "the target element is already the current screen"
blocked = "the target element is greyed out or not visible"
confirm = "the target element is available and the action is sensitive"

[dims]
intent = "what the user wants this turn"

[prompt]
intro = "Below is a **feature list for one screen snapshot**. Write the sentence the user says this turn."
bullet = "- {dim}: {brief} ({hint})"
target_bullet = "- the element the user refers to: {label} (the sentence must quote this name verbatim, character for character)"
rules = [
  "The sentence must be **single line** (one line is enough, no line breaks); no Markdown fences, no comments",
  "It must read like something a user actually types: \"please fill in the shipping address\" is fine, a field name like \"intent: fill\" is not",
  "The sentence must quote the element name above **verbatim** (character for character), and it must refer to that one element only — do not mention any other element",
  "Do **not** describe the element's state (clickable / greyed out / not visible / already the current screen), and do not mention its row number in the table — those belong to the \"screen elements\" table, and writing them here makes the sentence fight it",
  "Write only the one thing the user wants this turn; do not line up other operations as well",
  "Do not name real companies, products, or code repositories; use invented names",
  "Write everything in {language}; keep the element name copied verbatim",
]

[feature.intent.fill]
brief = "the user wants to type something into an input field"
hint = "write it like \"please fill in the shipping address for me\""

[feature.intent.open]
brief = "the user wants to open a link / go to a page"
hint = "write it like \"I'd like to look at the help center\""

[feature.intent.switch]
brief = "the user wants to switch to another tab / another view"
hint = "write it like \"switch me over to the details\""

[feature.intent.submit]
brief = "the user wants to press a button (submit / confirm)"
hint = "write it like \"looks good, go ahead and place the order\""

[verify]
intro = "Below is one screen snapshot. Infer its features using the given options and questions."
state_header = "[Full snapshot]"
questions_header = "[Questions]"
option_line = "   - {name}: {desc}"
q_intent = "What does the user want this turn?"
q_row = "Which row of the \"screen elements\" table does the user refer to? (1-based; copy the \"row\" column)"
q_label = "Which element does the user refer to? (copy that element name verbatim)"

[role]
field = "input field"
link = "link"
tab = "tab"
button = "button"

[state]
ready = "available"
current = "already current"
disabled = "greyed out"
hidden = "not visible"

[fam.intent]
q = [
  "What does the user want this turn?",
  "Pick one for what the user wants.",
  "Which intent does this sentence carry?",
]
[fam.intent.criteria]
fill = "type something into an input field"
open = "open a link / go to a page"
switch = "switch to another tab / view"
submit = "press a button"

[fam.target]
q = [
  "Which element should be acted on next?",
  "Given this screen's state, which element should be touched?",
  "Which element is the one to click / fill?",
]
row_option = "row {index}"
none = "no element can be acted on"

[fam.action]
q = [
  "What action should be taken next?",
  "Per the intent table, which action does this turn call for?",
  "Which action applies here?",
]
[fam.action.criteria]
type = "type into the input field"
open = "open the link / page"
switch = "switch over"
click = "press the button"
none = "do nothing"

[fam.done]
q = [
  "Is the target element already the current screen?",
  "Should this turn be skipped because it is already the current screen?",
  "Per the gates, is the target element already done?",
]
[fam.done.criteria]
true = "yes: the target element is already the current screen"
false = "no: the target element is not the current screen yet"

[fam.blocked]
q = [
  "Is the target element unusable right now?",
  "Should this turn be stopped because the element cannot be used?",
  "Per the gates, is the target element blocked?",
]
[fam.blocked.criteria]
true = "yes: the target element is greyed out or not visible, so it cannot be used"
false = "no: the target element can be used"

[fam.confirm]
q = [
  "Should a human confirm before this step?",
  "Per the gates, should this turn be confirmed first?",
  "Is the target element a sensitive action (when it is available)?",
]
[fam.confirm.criteria]
true = "yes: the target element is available and the action is sensitive (money / deletion / publishing / unsubscribing)"
false = "no: the target element is not sensitive, or it cannot be used right now"

[fam.risk]
q = [
  "Which risk level does this turn carry?",
  "Score this turn's risk per the intent table.",
  "Where does this turn rank on risk?",
]
levels = [
  "level 0: no risk",
  "level 1: low risk",
  "level 2: medium risk",
  "level 3: high risk",
]