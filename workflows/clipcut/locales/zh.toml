# 片段筛选与去冗余（clipcut）workflow 的中文文案。
#
# 输入：`workflows.clipcut.locales.load("zh")` 读取本文件。
# 输出：字典。
# 预期行为（每一条都有测试钉住）：
# - 抬头 / 区块抬头两两不互为前缀，且不与英文撞车（反解靠最长前缀认标签）；
# - `[topic.*]` 的键与 `features.TOPIC_IDS` + `OOD_TOPIC_ID` 一一对应，名字互不相同；
# - `[flag.*]` 只有 yes / no 两个词，且都不是主题名的一部分；
# - 四个题族的问法模板互不相同（`locate` 会静默取第一个命中）；
# - `[fam.keep_count].levels` 五档、`[fam.first_kept].criteria` 五个选项键（s1~s4 + none）、
#   两个 noul 族的 criteria 只有 true / false。

lang = "zh"
language_name = "简体中文"

[meta]
request = "片段筛选请求号"
segments = "片段表"
paren_open = "（"
paren_close = "）"

[topic]
T1 = "开场白"
T2 = "产品演示"
T3 = "用户提问"
T4 = "收尾总结"
T5 = "数据核对"

[flag]
yes = "高亮"
no = "无高亮"

[rules]
lines = [
  "保留规则：一段片段被保留，当且仅当它含高亮点、且它是它那个主题第一次出现的位置。",
  "主题重复出现时，只有第一次出现的那一处有资格被保留；后面即使含高亮点也不保留。",
  "「主题重复」只看主题名、与高亮无关；「被挡下」只算那些含高亮点、却因主题不是首现而被丢掉的片段。",
]

[fam.keep_count]
q = [
  "这屏材料一共该保留几段片段？",
  "按保留规则数一数：该留下的片段共有几段？",
]
levels = [
  "一段都不保留",
  "保留 1 段",
  "保留 2 段",
  "保留 3 段",
  "保留 4 段",
]

[fam.first_kept]
q = [
  "该保留的片段里，最早的一段是第几段？",
  "按保留规则，第一个被留下的片段是第几段？",
]
criteria = { s1 = "第 1 段", s2 = "第 2 段", s3 = "第 3 段", s4 = "第 4 段", none = "一段都没有保留" }

[fam.blocked_any]
q = [
  "有没有片段含高亮点、却因为它的主题在前面出现过而被去冗余挡下？",
  "这屏材料里，存在「本来够格（含高亮点）但被去冗余丢掉」的片段吗？",
]
criteria = { true = "有", false = "没有" }

[fam.dup_any]
q = [
  "这屏材料里有没有主题重复出现的片段？",
  "有没有哪一段的主题，在它前面的片段里已经出现过？",
]
criteria = { true = "有", false = "没有" }
