lang = "en"
language_name = "English"

# Phrases banned from the body: the tier / compliance / area value words and the three table
# names all belong to the attribute row and those tables; repeating them in the body can
# contradict them. High-precision only — a false hit wastes a usable sample at render time.
# `enterprise` / `gdpr` are the attribute row's own value tokens, so echoing them leaks the
# label; `free` / `pro` are far too common in ordinary prose to ban.
banned_intent_phrases = [
  "ticket attributes",
  "dispatch table",
  "priority table",
  "extra rules",
  "critical area",
  "critical areas",
  "free plan",
  "pro plan",
  "enterprise plan",
  "data deletion request",
  "security report",
  "gdpr",
  "enterprise",
]

[meta]
body_label = "Ticket body"
attrs_label = "Ticket attributes"
queue_label = "Dispatch table"
priority_label = "Priority table"
flags_label = "Extra rules"
header = "【{title}】"
row_prefix = "- "
paren = " ({text})"
colon = ": "
list_sep = ", "
attrs_columns = "area | tier | compliance"
queue_columns = "rule | condition | queue"
priority_columns = "urgency | free | pro | enterprise"
flags_columns = "name | note"

# The critical-area list is filled in by code through {areas}: copying it into the locale would
# let it drift, and it is exactly the list the `needs_human` rule needs.
[flags]
critical_areas = "there are only two critical areas: {areas}"
needs_human = "the queue is incident response / security incident / privacy compliance, or the area is a critical area and the tier is enterprise — either one means a human must take it"

[dims]
issue = "what the ticket is about"
urgency = "how urgent it is"

[prompt]
intro = "Below is the feature list of a **support ticket**. Write the ticket body (the message the user actually submitted) from this list."
bullet = "- {dim}: {brief} ({hint})"
rules = [
  "The body must be a **single line** (one paragraph, no line breaks); do not use Markdown fences, do not write comments",
  "Do **not** write the tier, compliance flag, or product area in the body, and do not write the names \"ticket attributes / dispatch table / priority table / extra rules\" — those belong to the ticket system's fields and tables, and writing them in the body makes the two fight",
  "Concretely: do not use the words \"free plan / pro plan / enterprise plan / data deletion request / security report / critical area\", and do not write the words gdpr or enterprise",
  "It must read like a message the user really submitted: \"our data pipeline has been unable to upload anything since this morning\" is fine; \"issue type: outage\" is not",
  "\"what the ticket is about\" must be obvious at a glance: outage / data loss / bug / how-to / feature request, exactly one of the five",
  "\"how urgent it is\" must be obvious at a glance: can wait / blocked / deadline, exactly one of the three",
  "Do not name any real company, product, or codebase; use invented names only",
  "Write everything in {language}; keep the product-area codes in ASCII",
]

[feature.issue.outage]
brief = "outage: one line is entirely unavailable"
hint = "write it like \"this line is completely unusable right now\""

[feature.issue.data_loss]
brief = "data loss: records went missing / do not add up"
hint = "write it like \"we found a batch of records missing\""

[feature.issue.bug]
brief = "bug: the behaviour does not match the documentation"
hint = "write it like \"it does something different from what the docs say\""

[feature.issue.howto]
brief = "how-to: asking how to use it correctly"
hint = "write it like \"I want to confirm how this should be used\""

[feature.issue.feature]
brief = "feature request: wanting a new way of doing something"
hint = "write it like \"I hope you can support ...\""

[feature.urgency.can_wait]
brief = "can wait"
hint = "write it like \"no rush, whenever you get a chance\""

[feature.urgency.blocked]
brief = "blocked"
hint = "write it like \"this line is completely stuck and the work has stopped\""

[feature.urgency.deadline]
brief = "has a deadline"
hint = "write it like \"I need an answer before the end of the day\""

[area]
payments = "payments"
storage = "storage"
analytics = "analytics"
identity = "identity"

[tier]
free = "free"
pro = "pro"
enterprise = "enterprise"

[compliance]
none = "none"
gdpr = "data deletion request"
security = "security report"

[rules.security_report]
condition = "the compliance flag is \"security report\", and the issue is outage, data loss, or bug"

[rules.privacy_request]
condition = "the compliance flag is \"data deletion request\", and the issue is data loss or feature request"

[rules.outage_response]
condition = "the issue is outage"

[rules.loss_response]
condition = "the issue is data loss"

[rules.defect]
condition = "the issue is bug"

[rules.howto]
condition = "the issue is how-to"

[rules.feature_request]
condition = "none of the above match"

[verify]
intro = "Below is a support ticket. Read its features back from the given options."
state_header = "【Full ticket】"
questions_header = "【Questions】"
option_line = "   - {name}: {desc}"

[fam.issue]
q = [
  "What is this ticket about?",
  "Pick one under \"what the ticket is about\".",
  "Which kind of problem is this ticket?",
]
[fam.issue.criteria]
outage = "outage: one line is entirely unavailable"
data_loss = "data loss: records went missing / do not add up"
bug = "bug: the behaviour does not match the documentation"
howto = "how-to: asking how to use it correctly"
feature = "feature request: wanting a new way of doing something"

[fam.urgency]
q = [
  "How urgent is this ticket?",
  "Pick one under \"how urgent it is\".",
  "Which urgency level is this ticket?",
]
[fam.urgency.criteria]
can_wait = "can wait"
blocked = "blocked"
deadline = "has a deadline"

[fam.rule]
q = [
  "Which rule of the dispatch table does this ticket hit?",
  "Reading the dispatch table top to bottom, which is the first rule that matches?",
  "Pick the matching rule from the dispatch table.",
]
[fam.rule.criteria]
security_report = "the compliance flag is \"security report\", and the issue is outage, data loss, or bug"
privacy_request = "the compliance flag is \"data deletion request\", and the issue is data loss or feature request"
outage_response = "the issue is outage"
loss_response = "the issue is data loss"
defect = "the issue is bug"
howto = "the issue is how-to"
feature_request = "none of the above match"

[fam.queue]
q = [
  "Which queue should this ticket go to?",
  "Per the dispatch table, which queue takes this ticket?",
  "Which queue owns this ticket?",
]
[fam.queue.criteria]
support_l1 = "front-line support"
engineering = "engineering"
incident_response = "incident response"
privacy_ops = "privacy compliance"
security_incident = "security incident"
product_backlog = "product backlog"

[fam.priority]
q = [
  "Which priority level is this ticket?",
  "Assign a priority level from the priority table.",
  "Where does this ticket rank on the priority scale?",
]
levels = [
  "level 0: lowest",
  "level 1: low",
  "level 2: medium",
  "level 3: highest",
]

[fam.needs_human]
q = [
  "Does this ticket require a human?",
  "Per the extra rules, should a person take this ticket?",
  "Should this ticket land in a human's hands?",
]
[fam.needs_human.criteria]
true = "yes: the queue is incident response / security incident / privacy compliance, or the area is a critical area and the tier is enterprise"
false = "no: neither of those two holds"
