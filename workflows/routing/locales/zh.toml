# 工单分诊 workflow 的中文文案：标签、词表、正文模板、题面判据与选项描述。
#
# 约定（由 tests/workflows/routing/test_locales.py 锁住）：
# - 工单每一格都有自己的标签，反解按标签认行；
# - 各语言的标签互不重叠（`reparse` 用合并表做语言无关的反解）；
# - 判据原文写进题面（严重度矩阵 / 派单表 / 时限表 / 优先级表），
#   只读 state 与题面的读者必须能自己把答案算出来。

[meta]
title = "工单分诊台"
colon = "："
# 正文里三句话之间的连接符：中文句子自带句号，不用再加空格。
sent_sep = ""
ticket_label = "工单号"
area_label = "产品域"
tier_label = "客户等级"
impact_label = "影响面"
urgency_label = "紧急度"
compliance_label = "合规标记"
created_label = "创建时间"
current_label = "当前时间"
body_label = "正文"

[area]
payments = "支付"
storage = "存储"
analytics = "分析"
identity = "身份"

[tier]
free = "免费版"
pro = "专业版"
enterprise = "企业版"

[impact]
single_user = "单个用户"
team = "一个团队"
all_users = "全部用户"

[urgency]
can_wait = "可以等"
blocked = "业务受阻"
deadline = "有截止时间"

[compliance]
none = "无"
gdpr = "数据删除请求"
security = "安全报告"

[body.issue]
outage = "{area}这条线从今早开始大面积不可用，我们这边完全没法继续。"
data_loss = "我们发现{area}里少了一批记录，数据可能已经丢了。"
bug = "{area}的表现和文档写的不一样，看着像缺陷。"
howto = "想确认一下{area}的正确用法。"
feature = "希望{area}能支持一种新的做法。"

[body.impact]
single_user = "目前只影响我一个人。"
team = "整个团队都卡在这里。"
all_users = "所有客户都在受影响。"

[body.urgency]
can_wait = "不急，等有空再看就行。"
blocked = "这条线现在完全走不通，业务停住了。"
deadline = "今天下班前必须有个结论。"

[fam.severity]
# 判据写在题面里：九格矩阵全写出来，读者照着查即可。
q = [
  "这条工单的严重度是哪一档？严重度矩阵（影响面 × 紧急度）：单个用户 → 可以等 s4、业务受阻 s4、有截止时间 s3；一个团队 → 可以等 s3、业务受阻 s2、有截止时间 s2；全部用户 → 可以等 s3、业务受阻 s1、有截止时间 s1。",
  "按严重度矩阵给这条工单定级。矩阵（影响面 × 紧急度）：单个用户 → 可以等 s4、业务受阻 s4、有截止时间 s3；一个团队 → 可以等 s3、业务受阻 s2、有截止时间 s2；全部用户 → 可以等 s3、业务受阻 s1、有截止时间 s1。",
  "这条工单落在哪个严重度档？矩阵（影响面 × 紧急度）：单个用户 → 可以等 s4、业务受阻 s4、有截止时间 s3；一个团队 → 可以等 s3、业务受阻 s2、有截止时间 s2；全部用户 → 可以等 s3、业务受阻 s1、有截止时间 s1。",
]

[option.severity]
s1 = "s1：全部用户受阻或有截止时间"
s2 = "s2：一个团队受阻或有截止时间"
s3 = "s3：单个用户有截止时间，或团队 / 全部用户还能等"
s4 = "s4：单个用户受阻或还能等"

[fam.queue]
# 判据写在题面里：六条有序规则，按顺序取第一个命中。
q = [
  "这条工单该派到哪个队列？派单规则（按顺序取第一个命中）：① 咨询类 → 一线支持组；② 合规标记是「数据删除请求」，且问题类型是数据丢失或需求 → 隐私合规组；③ 合规标记是「安全报告」，且问题类型是故障、数据丢失或缺陷 → 安全事件组；④ 问题类型是故障或数据丢失 → 事故响应组；⑤ 问题类型是缺陷 → 工程组；⑥ 其余 → 产品待办组。",
  "按派单规则选一个队列（按顺序取第一个命中）：① 咨询类 → 一线支持组；② 合规标记是「数据删除请求」，且问题类型是数据丢失或需求 → 隐私合规组；③ 合规标记是「安全报告」，且问题类型是故障、数据丢失或缺陷 → 安全事件组；④ 问题类型是故障或数据丢失 → 事故响应组；⑤ 问题类型是缺陷 → 工程组；⑥ 其余 → 产品待办组。",
]

[option.queue]
support_l1 = "一线支持组：接咨询类工单"
engineering = "工程组：接缺陷类工单"
incident_response = "事故响应组：接故障与数据丢失"
privacy_ops = "隐私合规组：接数据删除请求"
security_incident = "安全事件组：接安全报告"
product_backlog = "产品待办组：接需求类工单"

[fam.escalation]
q = [
  "这条工单要不要升级给负责人？升级规则：合规标记是「安全报告」→ 安全负责人；是「数据删除请求」→ 隐私负责人；没有合规标记 → 不升级。",
  "升级给谁？规则：合规标记是「安全报告」→ 安全负责人；是「数据删除请求」→ 隐私负责人；没有合规标记 → 不升级。",
]

[option.escalation]
none = "不升级"
security_lead = "升级给安全负责人"
privacy_lead = "升级给隐私负责人"

[fam.critical_area]
q = [
  "这条工单的产品域是不是关键产品域？关键产品域只有两个：支付、身份。",
  "产品域落在关键域里吗？关键产品域只有两个：支付、身份。",
]
criteria = { "true" = "是，产品域是关键域（支付或身份）", "false" = "否，产品域不是关键域" }

[fam.needs_human]
q = [
  "这条工单必须人工介入吗？规则：严重度是 s1 或 s2；或者合规标记是「安全报告」且客户等级是企业版——两条命中任意一条就必须人工。",
  "要不要人工看这条工单？规则：严重度 s1 / s2；或者「安全报告 + 企业版」——任一条成立就必须人工。",
]
criteria = { "true" = "必须人工介入", "false" = "不必人工介入" }

[fam.sla_breach]
q = [
  "这条工单已经超出首次响应时限了吗？时限表（严重度 → 免费版 / 专业版 / 企业版，单位分钟）：s1 → 10 / 5 / 3；s2 → 30 / 15 / 10；s3 → 120 / 60 / 30；s4 → 480 / 300 / 200。已等待时长 = 当前时间 − 创建时间；已等待**严格大于**时限才算超时，卡在时限上不算。",
  "首次响应超时了吗？时限表（严重度 → 免费版 / 专业版 / 企业版，分钟）：s1 → 10 / 5 / 3；s2 → 30 / 15 / 10；s3 → 120 / 60 / 30；s4 → 480 / 300 / 200。已等待 = 当前时间 − 创建时间，严格大于时限才算超时。",
]
criteria = { "true" = "已超时（已等待严格大于时限）", "false" = "没超时（已等待不超过时限）" }

[fam.data_risk]
q = [
  "这条工单要走数据事故流程吗？规则：问题类型是「数据丢失」，或者合规标记是「数据删除请求」——任一条成立即为真。",
  "要不要按数据事故流程处理？规则：问题类型是数据丢失，或合规标记是数据删除请求。",
]
criteria = { "true" = "要走数据事故流程", "false" = "不用走数据事故流程" }

[fam.priority]
q = [
  "这条工单的优先级是几档？优先级表（严重度 × 客户等级）：s1 → 4 档（不看客户等级）；s2 与 s3 → 免费版 1 档、专业版 2 档、企业版 3 档；s4 → 0 档（不看客户等级）。",
  "按优先级表定档（严重度 × 客户等级）：s1 → 4；s2 与 s3 → 免费版 1、专业版 2、企业版 3；s4 → 0。",
]
levels = [
  "0 档：严重度 s4",
  "1 档：严重度 s2 或 s3，且客户是免费版",
  "2 档：严重度 s2 或 s3，且客户是专业版",
  "3 档：严重度 s2 或 s3，且客户是企业版",
  "4 档：严重度 s1",
]
