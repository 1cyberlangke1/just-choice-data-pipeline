lang = "zh"
language_name = "简体中文"

# 正文里不许出现的话术：客户等级 / 合规标记 / 产品域那几档的词，以及三张表的名字，都归
# 「工单属性」那一行与那几张表管，正文里再写一遍就可能与它们打架。只收高精度短语——
# 宁可漏检也不误判，误判会在渲染期白拒一条本来能用的数据。`enterprise` / `gdpr` 是属性行
# 的**取值词元本身**，照抄等于泄底；`free` / `pro` 在自然文本里太常见（「free of charge」
# 「pro tips」），收了会大面积误伤，所以只收它们的中文名。
banned_intent_phrases = [
  "工单属性",
  "派单表",
  "优先级表",
  "附加规则",
  "关键产品域",
  "免费版",
  "专业版",
  "企业版",
  "数据删除请求",
  "安全报告",
  "gdpr",
  "enterprise",
]

[meta]
body_label = "工单正文"
attrs_label = "工单属性"
queue_label = "派单表"
priority_label = "优先级表"
flags_label = "附加规则"
header = "【{title}】"
row_prefix = "- "
paren = "（{text}）"
colon = "："
list_sep = "、"
attrs_columns = "产品域 | 客户等级 | 合规标记"
queue_columns = "规则名 | 条件 | 队列"
priority_columns = "紧急度 | 免费版 | 专业版 | 企业版"
flags_columns = "名 | 说明"
# 正文开头不许出现的档名：`fam.issue` 问的就是「这条工单是什么问题」，正文自己写「咨询：」
# 等于把答案印在题面里。只查**开头 + 冒号**这一种写法，正文里正常提到这些词不算（宁可漏检）。
issue_labels = ["故障", "数据丢失", "缺陷", "咨询", "需求"]

# 关键域清单由代码填进 {areas}：抄一遍就会漂移，而它正是 `needs_human` 那条规则要用的清单。
[flags]
critical_areas = "关键产品域只有两个：{areas}"
needs_human = "队列是事故响应组 / 安全事件组 / 隐私合规组，或者产品域是关键域且客户等级是企业版——任一成立就要人工介入"

[dims]
issue = "这条工单是什么问题"
urgency = "它有多急"

[prompt]
intro = "下面是一条**工单**的特征清单。请按清单写出这条工单的正文（用户提交上来的那段话）。"
bullet = "- {dim}：{brief}（{hint}）"
rules = [
  "正文必须是**单行**（一段话，不要换行）；不要用 Markdown 围栏，不要写注释",
  "正文里**不要**写客户等级、合规标记、产品域这些字段，也不要写「工单属性 / 派单表 / 优先级表 / 附加规则」这些表名——那些归工单系统里的字段与表格管，写进正文就会跟它们打架",
  "具体说：不要出现「免费版 / 专业版 / 企业版 / 数据删除请求 / 安全报告 / 关键产品域」这类词，也不要写 gdpr / enterprise 这两个词",
  "要像用户真的提交上来的那段话：写「我们这条线从今早开始就传不上数据了」可以，写「问题类型：故障」这种字段名不行",
  "「这条工单是什么问题」那一档要一眼看得出来，但**别把这一档的名字写进正文**——不要写「咨询：」「缺陷：」这种前缀，也不要写字段名",
  "「它有多急」那一档要一眼看得出来：可以等 / 业务受阻 / 有截止时间，三种之一",
  "不要写真实存在的公司、产品或代码库名字，一律用虚构的名字",
  "全部用{language}写；产品域的英文代号保持 ASCII",
]

[feature.issue.outage]
brief = "故障：某条线整体不可用"
hint = "写成「这条线现在完全用不了」那种话"

[feature.issue.data_loss]
brief = "数据丢失：记录少了 / 对不上"
hint = "写成「发现少了一批记录」那种话"

[feature.issue.bug]
brief = "缺陷：行为与文档写的不一样"
hint = "写成「它做的和文档写的不一致」那种话"

[feature.issue.howto]
brief = "咨询：问正确用法"
hint = "写成「想确认一下该怎么用」那种话"

[feature.issue.feature]
brief = "需求：想要一种新做法"
hint = "写成「希望你们能支持……」那种话"

[feature.urgency.can_wait]
brief = "可以等"
hint = "写成「不急，等有空再看」那种话"

[feature.urgency.blocked]
brief = "业务受阻"
hint = "写成「这条线现在完全走不通，事情停住了」那种话"

[feature.urgency.deadline]
brief = "有截止时间"
hint = "写成「今天下班前必须有个结论」那种话"

[area]
payments = "支付"
storage = "存储"
analytics = "分析"
identity = "身份"

[tier]
free = "免费版"
pro = "专业版"
enterprise = "企业版"

[compliance]
none = "无"
gdpr = "数据删除请求"
security = "安全报告"

[rules.security_report]
condition = "合规标记是「安全报告」，而且问题是故障、数据丢失或缺陷"

[rules.privacy_request]
condition = "合规标记是「数据删除请求」，而且问题是数据丢失或需求"

[rules.outage_response]
condition = "问题是故障"

[rules.loss_response]
condition = "问题是数据丢失"

[rules.defect]
condition = "问题是缺陷"

[rules.howto]
condition = "问题是咨询"

[rules.feature_request]
condition = "以上都不命中"

[verify]
intro = "下面是一条工单。请按给定的选项反解它的特征。"
state_header = "【工单全文】"
questions_header = "【问题】"
option_line = "   - {name}：{desc}"

[fam.issue]
q = [
  "这条工单是什么问题？",
  "按「这条工单是什么问题」选一项。",
  "这条工单属于哪一类问题？",
]
[fam.issue.criteria]
outage = "故障：某条线整体不可用"
data_loss = "数据丢失：记录少了 / 对不上"
bug = "缺陷：行为与文档写的不一样"
howto = "咨询：问正确用法"
feature = "需求：想要一种新做法"

[fam.urgency]
q = [
  "这条工单有多急？",
  "按「它有多急」选一项。",
  "这条工单的紧急度是哪一档？",
]
[fam.urgency.criteria]
can_wait = "可以等"
blocked = "业务受阻"
deadline = "有截止时间"

[fam.rule]
q = [
  "这条工单会命中派单表里的哪一条？",
  "派单表从上往下看，第一条命中的是哪一条？",
  "按派单表选一条命中的规则。",
]
[fam.rule.criteria]
security_report = "合规标记是「安全报告」，而且问题是故障、数据丢失或缺陷"
privacy_request = "合规标记是「数据删除请求」，而且问题是数据丢失或需求"
outage_response = "问题是故障"
loss_response = "问题是数据丢失"
defect = "问题是缺陷"
howto = "问题是咨询"
feature_request = "以上都不命中"

[fam.queue]
q = [
  "这条工单该派到哪个队列？",
  "按派单表，这条工单进哪个队列？",
  "这条工单归哪个队列接？",
]
[fam.queue.criteria]
support_l1 = "一线支持组"
engineering = "工程组"
incident_response = "事故响应组"
privacy_ops = "隐私合规组"
security_incident = "安全事件组"
product_backlog = "产品待办组"

[fam.priority]
q = [
  "这条工单的优先级是第几档？",
  "按优先级表给这条工单定一档。",
  "这条工单该排在第几档？",
]
levels = [
  "0 档：最低",
  "1 档：偏低",
  "2 档：中等",
  "3 档：最高",
]

[fam.needs_human]
q = [
  "这条工单必须人工介入吗？",
  "按附加规则，这条工单要不要有人接手？",
  "这条工单该不该直接落到人工手里？",
]
[fam.needs_human.criteria]
true = "要：队列是事故响应组 / 安全事件组 / 隐私合规组，或者产品域是关键域且客户是企业版"
false = "不要：以上两条都不成立"
